# How the test suite is run (GM-253). nextest resolves this path against the
# cargo *workspace* root, which is why it lives here: GM-284 added a root
# manifest (see `Cargo.toml`) so `core/`, `wire/` and `plugins/sdk` are one
# workspace, and this file moved up from `core/.config/` with it. Left in
# `core/` it would have been silently ignored - no fail-fast, no per-test
# timeout - which is exactly the blind spot the settings below exist to close.
#
# Adopted on the runners' evidence, against run 32588238433's `cargo test`
# step, after a local comparison said the opposite and was wrong. That one
# measured a ~4s exec stall belonging to one developer machine's
# `target/debug/deps/` - a byte-identical copy of the same binary elsewhere
# exec'd in 0.03s - which nextest pays once per test and `cargo test` pays
# once per binary, so it measured the stall multiplied by 19, not the tool.
#
#                   nextest   cargo test
#   linux              162s         180s
#   windows            130s         137s
#   x86_64-darwin      240s         509s
#   aarch64            184s         161s
#
# 714 tests passing on all four, no leaks reported, and faster on three of
# them. aarch64 pays 23s for what the rest of this file buys.
#
# The suite runs as named sections, each a filterset over these profiles:
# `scripts/test-sections.sh` (docs/adr/0030-test-sections.md). No profile here
# is per section; every section runs under `default` or `ci` unchanged.

[profile.default]
# Same reason `--no-fail-fast` is passed today: cargo otherwise stops at the
# first failing binary and every binary after it goes unreported, which is the
# blind spot that hid ~35 Windows binaries for weeks (GM-246).
fail-fast = false

# The whole point of the experiment. libtest has no per-test timeout, so a
# hung test can only be bounded by a budget on the entire step - and a step
# killed that way is reported as *cancelled* and prints nothing. GM-249 was
# one hung test that cost two runs and ninety minutes to identify.
#
# 210s is not a round number: it sits above this suite's own longest honest
# wait. The worst legitimate case is `common::wait_until_indexed` spending its
# full `DEFAULT_INDEXED_TIMEOUT_SECS` of 90s and then a semantic poll loop
# spending its `SEMANTIC_TIMEOUT` - 60s in `overload_call_binding`, the
# largest - so 150s before the test's own assertion fires. Terminating below
# that would replace a precise "timed out waiting for X" panic with an opaque
# kill, which is worse than having no timeout at all.
slow-timeout = { period = "30s", terminate-after = 7 }

# Deliberately absent: `retries`. Three load-dependent races surfaced this
# week only because CI reported them; a retry policy would have hidden all
# three and left the wait-predicate defect underneath them in place.

# `cargo test` runs one binary at a time; nextest runs `num-cpus` tests from
# anywhere in the suite at once. Each of these integration tests spawns a real
# detached daemon and a real Node plugin, and the first unconfigured run
# failed 23 tests that pass under `cargo test` - contention reported as
# failure. `kind(test)` is exactly the `core/tests/*.rs` targets, as against
# `kind(lib)`'s 621 cheap unit tests, which keep the full width.
[test-groups]
daemon-spawning = { max-threads = 2 }

[[profile.default.overrides]]
filter = 'kind(test)'
test-group = 'daemon-spawning'

# One unit test spawns processes too and asserts on *when* they start relative
# to one another, which is the first thing load destroys. It belongs with the
# heavy set despite living in the lib.
[[profile.default.overrides]]
filter = 'test(two_languages_spawn_at_the_same_time_rather_than_one_after_the_other)'
test-group = 'daemon-spawning'

# Ignored tests that list the whole workspace suite (twelve times for
# `scripts/test-sections.sh check`, twice for the `local` profile check),
# which outlast the 210s above on a loaded machine without hanging.
[[profile.default.overrides]]
filter = 'test(=the_real_sections_partition_the_real_suite) | test(=the_local_profile_skips_exactly_its_heavy_list)'
slow-timeout = { period = "60s", terminate-after = 20 }

# GM-344. A CI-only profile, so that a run leaves behind something a machine
# can read. Everything about how tests are *run* is inherited unchanged -
# this adds an output file and nothing else.
#
# CI-only on purpose: `cargo nextest run` locally must not start writing XML
# into anyone's tree. The runners ask for it with `--profile ci`.
#
# What it is for: until this existed, "what is failing on Windows" was
# answered by downloading a six-thousand-line log and writing a regex. That
# produced a wrong count twice in one session - 47 when it was 48, because
# the regex wanted `(` followed by a digit while nextest pads its counter
# (`( 246/1308)`), so every test numbered under 1000 silently vanished. A
# systematic parse error in the same direction both times, which is what
# hand-grepping cannot protect against and this replaces.
[profile.ci]
inherits = "default"

[profile.ci.junit]
# Written to `target/nextest/ci/junit.xml`, which `scripts/test-sections.sh`
# renames to `junit-<section>.xml` after each section. One `<testsuite>` per test
# binary, which is the grouping that matters: 25 failures in one binary is
# one cause, 25 across twelve is a different situation entirely, and that
# distinction is what made GM-337 diagnosable at all.
path = "junit.xml"

# Tests skipped by `scripts/test-local.sh` only, one exact (binary, name) term
# each. `default` and `ci` must keep running every one of them
# (docs/adr/0031-local-test-runs.md); `test-local.sh --full` runs them and
# reports any test whose time crossed 10s either way against this list. A test
# joins at 10s or more and leaves only after two batch-end runs under 10s.
[profile.local]
inherits = "default"
default-filter = """
not (
    (binary_id(g-mesh) & test(=mcp::response_bound_tests::every_single_hop_implementation_page_fits_the_ceiling)) |
    (binary_id(g-mesh) & test(=mcp::response_bound_tests::every_caller_page_fits_the_ceiling)) |
    (binary_id(g-mesh) & test(=mcp::response_bound_tests::every_reference_page_fits_the_ceiling)) |
    (binary_id(g-mesh) & test(=mcp::response_bound_tests::every_callee_page_fits_the_ceiling)) |
    (binary_id(g-mesh) & test(=mcp::response_bound_tests::paging_through_byte_cut_pages_returns_every_row_once)) |
    (binary_id(g-mesh) & test(=mcp::response_bound_tests::every_files_answer_fits_the_ceiling)) |
    (binary_id(g-mesh) & test(=graph::symbol_links::tests::link_all_and_link_diff_agree_on_the_same_end_state)) |
    (binary_id(g-mesh) & test(=daemon::semantic::tests::an_interrupted_pass_for_one_language_is_retried_without_rerunning_the_other)) |
    (binary_id(g-mesh::serving_while_indexing) & test(=a_walk_that_outlasts_the_bootstrap_timeout_is_waited_out_rather_than_losing_the_client)) |
    (binary_id(g-mesh::serving_while_indexing) & test(=a_restart_against_an_already_walked_project_never_reports_itself_as_still_indexing)) |
    (binary_id(g-mesh::serving_while_indexing) & test(=a_first_call_is_answered_normally_when_nothing_holds_the_walk_open)) |
    (binary_id(g-mesh::daemon_build_staleness) & test(=status_reports_a_daemon_that_an_upgrade_has_left_behind)) |
    (binary_id(g-mesh::daemon_build_staleness) & test(=shims_racing_to_replace_one_outdated_daemon_produce_exactly_one_replacement)) |
    (binary_id(g-mesh::daemon_build_staleness) & test(=a_daemon_started_from_an_older_build_is_replaced_before_it_answers_again)) |
    (binary_id(g-mesh::state_isolation) & test(=a_spawned_g_mesh_resolves_the_same_isolated_state_root)) |
    (binary_id(g-mesh::cli_clean) & test(=clean_orphaned_without_force_reports_and_deletes_nothing)) |
    (binary_id(g-mesh::cli_clean) & test(=clean_and_clean_orphaned_handle_a_front_state_dir)) |
    (binary_id(g-mesh::cli_init) & test(=init_on_a_fresh_project_creates_state_and_a_subsequent_status_shows_it_indexed)) |
    (binary_id(g-mesh::default_export_linking) & test(=usages_of_a_renamed_default_import_reach_the_class_it_really_names)) |
    (binary_id(g-mesh::plugin_memory_limit) & test(=the_generated_mcp_instructions_reflect_a_real_suspended_rust)) |
