    (binary_id(g-mesh::cli_status) & test(=status_in_a_front_served_folder_prints_the_front_line_and_no_coverage)) |
    (binary_id(g-mesh::cli_status) & test(=status_reports_the_daemon_plugin_coverage_and_syntax_errors_of_a_live_project)) |
    (binary_id(g-mesh::cli_status) & test(=status_reports_a_dead_daemon_and_the_files_its_index_never_saw)) |
    (binary_id(g-mesh::cli_status) & test(=status_does_not_show_a_dead_daemons_leftover_phase_and_progress_as_live)) |
    (binary_id(g-mesh::cli_status) & test(=status_warns_about_a_project_idle_past_the_threshold)) |
    (binary_id(g-mesh::cli_status) & test(=status_on_a_project_that_was_never_indexed_reports_an_empty_state)) |
    (binary_id(g-mesh::plugin_build_staleness) & test(=a_plugin_rebuilt_under_a_running_daemon_costs_the_project_a_re_walk)) |
    (binary_id(g-mesh::plugin_build_staleness) & test(=a_rebuild_of_any_discovered_plugin_retires_the_daemon_not_only_typescripts)) |
    (binary_id(g-mesh::replay_progress) & test(=a_held_replay_with_a_token_gets_a_heartbeat_then_the_full_answer)) |
    (binary_id(g-mesh::replay_progress) & test(=a_held_replay_without_a_token_gets_no_notifications_and_the_full_answer)) |
    (binary_id(g-mesh::ambiguous_reexport_linking) & test(=find_callers_resolves_through_an_ambiguous_export_star_barrel)) |
    (binary_id(g-mesh::release_packaging_scripts) & test(=prepare_release_assets_blesses_a_complete_release_with_plugin_assets)) |
    (binary_id(g-mesh::release_packaging_scripts) & test(=prepare_release_assets_refuses_a_tampered_plugin_asset_on_windows)) |
