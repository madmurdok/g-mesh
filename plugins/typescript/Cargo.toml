[package]
name = "g-mesh-plugin-typescript"
version = "4.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "g-mesh's TypeScript/JavaScript language plugin: tree-sitter structural extraction on the plugin SDK"

[lib]
name = "g_mesh_plugin_typescript"
path = "src/lib.rs"

[[bin]]
name = "g-mesh-plugin-typescript"
path = "src/main.rs"

[dependencies]
anyhow = "1"
g-mesh-plugin-sdk = { path = "../sdk" }
g-mesh-wire = { path = "../../wire" }
# Order-preserving JSON for package.json and tsconfig (`project::jsonc`).
serde = "1"
serde_json = "1"
tree-sitter = "0.25"
# Three grammars, routed per extension (`extractor::grammar`).
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"

[dev-dependencies]
# Reads this crate's own `plugin.toml` in the tests that pin it to the code.
toml = "0.8"
