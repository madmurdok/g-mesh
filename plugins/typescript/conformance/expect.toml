# Post-linking assertions for the bundled TypeScript plugin - GM-277,
# `g-mesh plugins check plugins/typescript --fixture
# plugins/typescript/conformance/project --expect
# plugins/typescript/conformance/expect.toml`.
#
# Every entry below is answered by the same handler code the MCP tools use
# (`core/src/cli/plugin_check/expectations.rs`'s module doc has the full
# contract: when these run, how a row becomes a string, how `symbol`/`file`
# resolve an anchor, and what a truncated page does). Each `expect` is a SET
# of `"filePath:qualifiedName"` strings - order never matters.
#
# The project this runs against is ./project, read alongside this one so
# each case below can be checked by hand against the real
# source rather than taken on faith.
#
# Three fields below are new in GM-386 and read the same way everywhere they
# appear: `files` (decision 12) and `excluded_references` (decision 13) assert
# the response's two per-page summaries, and an entry that does not mention
# them requires the response to carry neither. An `unresolved:`-prefixed row
# (decision 11) would mark an edge the linker could not confirm - no row in
# this file carries one, which is this fixture's assertion that every usage it
# names is a confirmed edge.
#
# No entry here gives `excluded_references`, and that is this language's
# answer rather than a gap: none of the three `[[callers]]` anchors below has
# a single `REFERENCES`-kind usage in this project. A TypeScript import is an
# `IMPORTS` edge to a file, and every use of these three names at the far end
# of one is a call - so the three entries assert the block's ABSENCE, which
# decision 13 makes an assertion in its own right and which is the arm that
# fails the day this plugin stops emitting a `REFERENCES` edge it used to.
#
# One entry here is a control rather than a claim about this plugin: the
# `[[importers]]` one at the bottom, GM-365's new incoming category, which
# passes identically against the pre- and post-GM-356 binary while the other
# three languages' entries in that category fail against the first. Its own
# comment says why, and it says so in this file rather than leaving the
# category out of it.

# --- same-file call, cross-file named import call, and both re-export forms -

[[callers]]
symbol = "add"
file = "src/math.ts"
# GM-382. This plugin's semantic tier is vtsls, found on `PATH`, in the
# project's `node_modules/.bin` or through `npx`, so it can be
# missing like the other three - the assertion is "it did not happen here":
# `"silent"` requires the response to carry no `provenance` block, and fails
# if this plugin ever answers while claiming its semantic tier was absent.
# Every other entry in this file requires the same thing by saying nothing,
# which is the same assertion (decision 10).
provenance = "silent"
# double() calls add() within math.ts itself (same-file); main.ts's run()
# imports { add } and calls it directly (cross-file named import); main.ts's
# useBarrelStar() imports add under a different local name through index.ts's
# `export * from "./math"` and calls that - a second declaration re-exporting
# the very same node, so it must not add a fourth, separate caller entry.
expect = ["src/math.ts:double", "src/main.ts:run", "src/main.ts:useBarrelStar"]
# Decision 12, and this is TypeScript's load-bearing entry for it - for the
# very risk the comment above names. The set cannot see a third CALLS edge
# that lands on the same node: `useBarrelStar` reaching `add` through
# `export * from "./math"` produces one more row spelled exactly
# `src/main.ts:useBarrelStar`, and a set collapses it. `find_callers` runs on
# `Distinctness::Edges` and decision 8 deliberately exempts `[[callers]]` from
# its duplicate-row check, so the per-file count here is the only thing in the
# kit that would notice. `src/main.ts:2` is one call each from run() and
# useBarrelStar(); a re-export walk that started answering twice makes it 3
# while the SET above still matches exactly.
files = ["src/main.ts:2", "src/math.ts:1"]

[[callers]]
symbol = "double"
file = "src/math.ts"
# main.ts's run() reaches `double` through index.ts's *named* re-export
# (`export { double as twice } from "./math"`) - resolved structurally, by
# the placeholder re-export walk, no semantic pass required.
#
# main.ts's useNamespaceImport() reaches it through `import * as m from
# "./math"; m.double(4)` - a namespace member call, which the structural
# pass cannot see at all (no bare name at the use site). This entry is the
# DISCRIMINATION case: with the semantic pass disabled, `useNamespaceImport`
# drops out of the actual set and this expectation fails - see
# core/tests/plugin_check.rs's `a_namespace_import_caller_needs_the_semantic_pass_to_resolve`.
expect = ["src/main.ts:run", "src/main.ts:useNamespaceImport"]
# Decision 12: both rows are in main.ts, one call each.
files = ["src/main.ts:2"]
# Both the namespace row and the tally need the semantic pass, and the set
# is compared exactly, so no structural spelling of this entry is true in
# both arms. The structural half - `run` found through the named re-export
# with the semantic pass off - is asserted by that same core test, which runs
# this entry without the skip flag and requires `run` in its actual set.
tier = "semantic"

[[callers]]
symbol = "format"
file = "src/overload.ts"
# useOverloads() calls format() under both of its overload signatures
# (format("a") and format(1)) - both must resolve to the one merged
# declaration, so the caller set has exactly one entry, not two.
expect = ["src/main.ts:useOverloads"]
# Decision 12, and the entry in this file where that field says the most -
# which is also the entry that made GM-386 pay for it. The set above has ONE
# member; the tally says `src/main.ts:2`, because the two overload call sites
# are two CALLS edges distinguished by `WireEdge::toDeclaration`, and a set
# collapses them onto the one merged declaration this entry exists to assert.
# `find_callers` runs on `Distinctness::Edges` and decision 8 deliberately
# exempts `[[callers]]` from its duplicate-row check, so this count is the
# only thing in the whole kit that can see whether both bindings survived.
files = ["src/main.ts:2"]
# The tally needs the semantic tier: the second binding is tsserver's work.
# Without a semantic pass only one CALLS edge exists, the tally is then not worth sending
# (`pagination::tally_is_worth_sending`), and the response carries no `files`
# at all. Since decision 12 makes an omitted `files` an assertion in its own
# right, there is no way to write this entry so that it is true in both arms -
# the healthy run needs the key and the structural-only run needs its absence.
# So the entry is tagged for what it actually needs, and
# `core/tests/plugin_check.rs`'s
# `a_namespace_import_caller_needs_the_semantic_pass_to_resolve` was updated
# to expect it among the failures of its structural arm, naming the tally as
# the reason rather than dropping the entry from its list.
tier = "semantic"

# --- callers: a receiver call, resolved by the semantic tier ----------------
#
# `src/shapes.ts`'s `viaGreetable(g: Greetable)` calls `g.greet()`. The
# structural tier has no type for `g`, so it records a receiver-call site and
# no edge (`receiver_calls_structural = "unresolved"`); the semantic tier asks
# vtsls where the call lands, and tsserver names the declaration the
# receiver's *static* type declares - the interface method, the same answer
# `go/types`, rust-analyzer and pyright give for their own fixtures
# (`receiver_calls = "resolved"`).
#
# The structural arm answers nothing, so `tests/conformance.rs`'s structural run without the skip flag lists it
# among the entries a missing tier must fail, as does
# `core/tests/plugin_check.rs`'s
# `a_namespace_import_caller_needs_the_semantic_pass_to_resolve`.
[[callers]]
symbol = "Greetable#greet"
file = "src/shapes.ts"
expect = ["src/shapes.ts:viaGreetable"]
tier = "semantic"

# --- references (includes SUPERTYPE_OF, which callers/implementations don't share) -

[[references]]
symbol = "Greetable"
file = "src/shapes.ts"
# Greeter's `implements Greetable` clause is a SUPERTYPE_OF edge, which
# find_references includes alongside CALLS/REFERENCES (its own
# USAGE_EDGE_KINDS) but find_callers does not - proving that inclusion.
#
# `viaGreetable` joined this set in GM-385: its parameter annotation
# `g: Greetable` is an ordinary same-file REFERENCES edge. Since GM-325 the
# `[[callers]] Greetable#greet` entry above also expects `viaGreetable`, so the
# type and its method now agree: following either one reaches the call site.
expect = ["src/shapes.ts:Greeter", "src/shapes.ts:viaGreetable"]
# Decision 12: two rows, one file, so the response carries the tally and this
# entry has to say so. It was absent - and asserted absent - until the second
# row existed, which is that decision's own absent arm doing its job: adding
# `viaGreetable` to the fixture failed this entry rather than slipping past it.
files = ["src/shapes.ts:2"]

# --- implementations ---------------------------------------------------------

[[implementations]]
symbol = "Greetable"
file = "src/shapes.ts"
expect = ["src/shapes.ts:Greeter"]

# --- imports (get_dependencies, one hop, Outgoing) ----------------------------

[[imports]]
file = "src/main.ts"
# main.ts imports math.ts (both the named `add` import and the `m` namespace
# import collapse onto the one File row), index.ts (both `twice` and
# `addViaBarrel`), util.js (shout) and overload.ts (format).
expect = ["src/index.ts", "src/math.ts", "src/overload.ts", "src/util.js"]

# --- definition ---------------------------------------------------------------

[[definition]]
symbol = "format"
file = "src/overload.ts"
# The overload's two signature declarations and one implementation
# declaration are one node under one qualifiedName - find_definition must
# resolve to exactly that node, not fail as ambiguous.
expect = ["src/overload.ts:format"]

[[definition]]
symbol = "Greeter"
# Unambiguous - no `file` needed to disambiguate.
expect = ["src/shapes.ts:Greeter"]

[[definition]]
symbol = "@Component"
# A decorator's use-site spelling. Nothing is named `@Component`, so it
# resolves only through plugin.toml's `[plugin.symbol_query_prefixes]`
# (`strip = ["@"]`): the remainder `Component` is looked up among this
# language's declarations.
expect = ["src/decorators.ts:Component"]

# --- importers (get_dependencies, one hop, Incoming) --------------------------
#     (GM-365; `expectations.rs`'s decision 7 has the contract)

[[importers]]
file = "src/math.ts"
# TypeScript's entry in the incoming category is also its CONTROL, and the
# missing `via_module` is the assertion, not an omission - decision 7 makes
# an absent `via_module` require that the response carry no `resolvedFrom` at
# all.
#
# The category applies here like everywhere else - these two files really do
# import math.ts - but the substitution GM-356 added does not, and this is
# where that is written down rather than left to be inferred from a missing
# key. In TypeScript a module *is* a file: an `IMPORTS` edge arrives at
# `src/math.ts` itself, so the anchor the caller named is the anchor the walk
# runs from, and `incoming_from_file`'s first guard (does this file have an
# incoming IMPORTS edge of its own?) is what keeps it that way - by
# construction, not by a list of languages. That is why this entry passes
# unchanged against both the pre-GM-356 and the post-GM-356 binary while go,
# rust and python's entries fail against the first: with all four in the same
# category, the arms differ in exactly the intended place.
#
# The two rows: `src/main.ts` imports `add` and `* as m`, and `src/index.ts`
# re-exports through both forms (`export * from "./math"` and `export {
# double as twice } from "./math"`). A re-export is an import of the file it
# reads. `src/overload.ts` and `src/util.js` import nothing from math.ts and
# must not appear.
expect = ["src/index.ts", "src/main.ts"]

# --- refusal: a name this project does not declare --------------------------
#     (GM-371, and `expectations.rs`'s decision 9)

[[refusal]]
tool = "definition"
symbol = "nosuchname"
contains = ["no symbol named 'nosuchname' found"]
# Like Rust's entry, this is the terse arm rather than GM-367's import-only
# one, and for the same reason stated in its own file rather than left
# implicit: every import in this project that resolves lands on a file the
# fixture contains. The `[[imports]]` entries are the direct evidence -
# all their rows are bare file paths, and decision 2 records that a
# `container:` row in TypeScript is precisely an import that resolved to
# nothing. There are none, so there is no import-only name here to refuse.
#
# What this entry asserts is that an unknown name is refused rather than
# answered: with real declarations in scope and a semantic tier
# running, "nosuchname" must still come back as nothing. See
# `plugins/rust/conformance/expect.toml` for why that is deterministic here.

[[refusal]]
tool = "definition"
symbol = "Greetable.greet"
# The interface method is `Greetable#greet`: an instance member is joined by
# `#`. The qualifiedName-suffix rung matches by exact spelling, so the same
# path written with `.` is refused rather than answered.
contains = ["no symbol named 'Greetable.greet' found"]

# =============================================================================
# Behaviours the TypeScript plugin must keep however it is implemented. Each
# group below exercises its own files under ./project, and every symbol they
# declare is unique in the fixture so the entries above stay unambiguous.
# =============================================================================

# --- workspaces, a `dist/` entry that was never built, and `extends` paths ---
#
# `packages/geom/package.json` names `@fx/geom` with `main` and both `exports`
# keys pointing at `./dist/prod/index.js`, which does not exist. The root
# `package.json`'s `workspaces` makes `@fx/geom` resolvable at all; a missing
# `dist/` target falls back to the package's `src/`. `~geom/*` comes from
# `packages/tsconfig.base.json`, reached only through
# `packages/app/tsconfig.json`'s `extends`, and has no `baseUrl`, so its
# target is relative to the config that declares it.

[[callers]]
symbol = "pointOf"
file = "packages/geom/src/point.ts"
# `pointOf` is `export const pointOf = (...) => ...`: it is anchorable only
# because a const arrow is extracted as a function. One caller per specifier
# form: the bare package root, a package subpath, and the `paths` alias.
expect = [
    "packages/app/src/alias.ts:viaAlias",
    "packages/app/src/root.ts:viaRoot",
    "packages/app/src/subpath.ts:viaSubpath",
]

[[importers]]
file = "packages/geom/src/index.ts"
# The bare `@fx/geom` import lands on the package's source entry, not on its
# unbuilt `dist/` entry. The subpath import goes to point.ts directly.
expect = ["packages/app/src/root.ts"]

[[imports]]
file = "packages/app/src/alias.ts"
expect = ["packages/geom/src/point.ts"]

# --- ESM specifiers: `./x.js` naming `./x.ts`, and a directory import --------

[[imports]]
file = "src/esm/use.ts"
expect = ["src/esm/dir/index.ts", "src/esm/lib.ts"]

[[callers]]
symbol = "fromLib"
expect = ["src/esm/use.ts:viaJsSpecifier"]

# --- members: a bare name never binds a class member; `Owner.member()` -------
#
# `src/members.ts` declares a module function `pick` and a method
# `Store#pick` whose body calls the bare `pick()` - which is the module
# function. The positive side (`[[callers]] symbol = "pick"`) cannot be
# written: both declarations sit in one file, so `file` cannot narrow the
# bare name to one anchor. The negative side is asserted instead: the method
# has no callers, so the bare call inside it did not bind to it.

[[callers]]
symbol = "Store#pick"
expect = []

[[callers]]
symbol = "Store.drop"
# A static member is joined by `.`, and `Store.drop()` resolves to it.
expect = ["src/members.ts:clear"]

[[definition]]
symbol = "Store#pick"
# An instance member is joined by `#`.
expect = ["src/members.ts:Store#pick"]

# --- heritage with a generic head --------------------------------------------

[[implementations]]
symbol = "Container"
# `Box implements Container<Item>`, cross-file. `SpecialBox extends Box` is
# not listed: implementations are direct.
expect = ["src/heritage/box.ts:Box"]

[[references]]
symbol = "Item"
# `Item` appears only as the heritage clause's type argument, and that is a
# reference from `Box`.
expect = ["src/heritage/box.ts:Box"]

# --- a default export imported under another name ----------------------------

[[callers]]
symbol = "MenuGroup"
# `import DropdownMenuGroup from "./menuGroup"`. The structural pass leaves
# the default import unbound; the semantic pass binds it.
expect = ["src/defaults/use.ts:renderGroup"]
tier = "semantic"

# --- an ambiguous `export *` barrel ------------------------------------------
#
# `src/amb/index.ts` re-exports both `./a` and `./b`, which each export
# `mutate`. TypeScript binds the import in `src/amb/use.ts` to the first
# `export *` (`./a`); the structural pass binds it to neither. Swapping the
# two lines in index.ts swaps these two sets.

[[callers]]
symbol = "mutate"
file = "src/amb/a.ts"
expect = ["src/amb/use.ts:useMutate"]
tier = "semantic"

[[callers]]
symbol = "mutate"
file = "src/amb/b.ts"
# Empty in both arms, so untagged: the semantic tier binds the import to
# `./a`, and the structural tier to neither branch. A `tier = "semantic"` tag
# would require it to fail in the structural arm, where it passes.
expect = []

# --- calls inside arrows, callbacks, class fields, and at top level ----------

[[callers]]
symbol = "leaf"
# A const arrow's body is attributed to the const, a callback's to the
# enclosing function, and a class-field arrow's to the field.
expect = [
    "src/callbacks.ts:Holder#fire",
    "src/callbacks.ts:arrowCaller",
    "src/callbacks.ts:viaCallback",
]
files = ["src/callbacks.ts:3"]
# The module-level `leaf();` has no enclosing declaration: it is a usage from
# the file, not a caller, and is disclosed here rather than listed. It is
# counted, but its file is not repeated: `files` above already names it.
excluded_references = { count = 1, files = [] }

# --- a parameter that shadows a module function ------------------------------

[[callers]]
symbol = "helper"
# `outer(helper: () => void)` calls its parameter, not the module function.
expect = ["src/shadow.ts:inner"]

# --- dynamic imports ---------------------------------------------------------

[[imports]]
file = "src/dyn/load.ts"
# ``import(`${DIR}/alpha`)`` folds the same-file `const DIR = "./plugins"`
# into a path. ``import(`./locales/${code}.json`)`` cannot be folded and
# records nothing: an import that resolves to no file would appear here as
# a `container:<specifier>` row, so this exact set also asserts its absence.
expect = ["src/dyn/plugins/alpha.ts"]

# --- package.json `imports` --------------------------------------------------

[[imports]]
file = "src/privateUse.ts"
# `#int/secret` through the root package.json's `"#int/*"` mapping.
expect = ["src/int/secret.ts"]

# --- declaration merging, ambient overloads, dotted namespaces ---------------

[[definition]]
symbol = "Settings"
# Two `interface Settings` statements are one node.
expect = ["src/merge.ts:Settings"]

[[definition]]
symbol = "ambient"
# Two bodiless `export declare function ambient` signatures are one node.
expect = ["src/ambient.ts:ambient"]

[[definition]]
symbol = "deepFn"
# Declared inside `export namespace Outer.Inner`: the dotted name is kept as
# one path, joined by `.`.
expect = ["src/ambient.ts:Outer.Inner.deepFn"]

# --- a namespace member read that is not a call ------------------------------

[[references]]
symbol = "target"
# `export const keep = lib.target` through `import * as lib from "./lib"`.
# The structural pass cannot see a member of a namespace import.
expect = ["src/nsref/use.ts:keep"]
tier = "semantic"

# --- an inherited method through `this` and `super` -------------------------

[[callers]]
symbol = "Base#hello"
# `src/inherit/derived.ts`'s `Child#viaThis` calls `this.hello()` and
# `Other#viaSuper` calls `super.hello()`; neither class declares `hello`, and
# `Base` is imported from another file. The structural tier binds a
# `this.m()` / `super.m()` only to a member declared in the calling file, so
# both are receiver-call sites it leaves open; vtsls lands both on
# `Base#hello`.
expect = ["src/inherit/derived.ts:Child#viaThis", "src/inherit/derived.ts:Other#viaSuper"]
# Decision 12: two rows in one file.
files = ["src/inherit/derived.ts:2"]
tier = "semantic"

# GM-516: `capabilities.files-created-resolves` (expectations' decision 14).
# Neither file exists in ./project: the kit writes both mid-session, sends
# one `filesCreated` listing them, then routes the importer's `fileChanged`
# before the target's - so the relative import below resolves only if the
# plugin added the target to its file set when told it was created.
[files_created]
target = "src/gmCheckTarget.ts"
target_text = """
export function created(): number {
  return 1;
}
"""
importer = "src/gmCheckImporter.ts"
importer_text = """
import { created } from "./gmCheckTarget";

export const n = created();
"""
