# Bundled TypeScript/JavaScript plugin manifest. See
# docs/architecture/plugin-modularity.md (Data Model section) for the schema
# this file follows, and core/src/daemon/manifest.rs (`read_manifest`) for the
# parser/validation rules it must satisfy. `language` must equal this
# directory's own name ("typescript"), the rule every bundled plugin follows.
#
# The plugin is the Rust binary built from this directory's crate on the SDK in
# plugins/sdk. It is a member of the cargo workspace, so
# `cargo build` builds it beside g-mesh itself; `${G_MESH_BIN_DIR}` expands to
# the directory of the running g-mesh executable, as for plugins/python and
# plugins/rust.
#
# Structural tier only, for now: `semantic_pass = false` below. Semantics come
# with the language-server tier on the SDK's LSP bridge, which adds
# `[plugin.semantic]` and turns `semantic_pass` back on.

[plugin]
language = "typescript"
protocol_version = 2
# Must equal this crate's `Cargo.toml` `version`: a plugin in the cargo
# workspace tracks the release version (docs/architecture/plugin-modularity.md,
# "plugin_version: two rules, not one"); scripts/cut-release.sh checks it.
plugin_version = "4.0.0"

[plugin.spawn]
command = "${G_MESH_BIN_DIR}/g-mesh-plugin-typescript"

[plugin.languages]
extensions = [".ts", ".tsx", ".mts", ".cts", ".js", ".jsx", ".mjs", ".cjs"]

[plugin.capabilities]
# Off until the language-server tier lands: core never sends this plugin a
# semanticPass request, and the structural tier answers alone.
semantic_pass = false
# Off: meaningless while `semantic_pass` is off, and kept off until the
# semantic tier states that a whole-project pass re-sends every edge it stands
# behind (ADR 0008, section 3).
semantic_sweep = false
# The project model resolves imports against the set of files the walk listed,
# so every created file of one watcher batch must be in it before the first of
# them is extracted (docs/adr/0026-batch-created-files-notification.md).
files_created = true
# Receiver calls (`x.foo()`) stay unresolved: the structural tier has no type
# information to know what `x` is, and there is no semantic tier yet. Honest
# gap, not a missing feature this manifest should overclaim - see
# docs/architecture/multi-language-plugins.md's `plugin.toml additions`
# section for what core does with an "unresolved" declaration (lists the gap
# in the MCP instructions rather than silently under-reporting call sites).
receiver_calls = "unresolved"
receiver_calls_structural = "unresolved"

[plugin.grammars]
# Which tree-sitter grammar parses which extension. Read by this plugin's tests
# only (core ignores unknown [plugin] tables): the binary can only parse with
# the grammars it links, so routing stays in code. Must equal
# `extractor::grammar::GRAMMARS`; a test in tests/units.rs pins the two, and
# that every extension in [plugin.languages] has exactly one grammar.
typescript = [".ts", ".mts", ".cts"]
tsx = [".tsx"]
javascript = [".js", ".jsx", ".mjs", ".cjs"]

[plugin.workspace]
# The files the project model is built from: workspace packages
# (`package.json`, `pnpm-workspace.yaml`), `exports`/`imports` maps
# (`package.json`) and `paths` (`tsconfig*.json`, `jsconfig*.json`, which also
# match `extends` targets such as `tsconfig.base.json`). The model reads them
# once, so a save of one reindexes the language (ADR 0008). Must equal
# `project::WATCH_FILES`; a test in tests/units.rs pins the two.
watch_files = ["package.json", "tsconfig*.json", "jsconfig*.json", "pnpm-workspace.yaml"]
# Directories this plugin's walk never descends into, on top of the SDK's own
# baseline (`.git` and the like, which are not specific to this language).
# Must equal `project::EXCLUDE_DIRS`, order included: core reads this file as
# data, so it cannot be derived, and a test in tests/units.rs pins the two.
exclude_dirs = ["node_modules", "dist"]
# A miss-path lookup treats a directory's `index` file as its container's
# entry point - the Node/bundler convention this repo already indexes.
entry_points = ["index"]

[plugin.non_symbol_queries]
# Query shapes that are never a TypeScript/JavaScript symbol: core sets aside this language's
# semantic candidates for such a query, and no other language's
# (docs/architecture/multi-language-plugins.md, "plugin.toml additions").
# `@` starts a scoped package or a decorator, `/` is a path or package
# separator, and `node:` starts a Node.js built-in module specifier
# (`node:fs`, `node:path`); no TypeScript/JavaScript function, type or
# member name contains `@`, `/` or `:`.
starts_with = ["@", "node:"]
contains = ["/"]

[plugin.symbol_query_prefixes]
# A query `@Name` that matches nothing is looked up again as `Name`, among
# TypeScript/JavaScript declarations only: `@` marks a decorator use, and the
# decorator is indexed under its own name. Each prefix must also be in
# `non_symbol_queries.starts_with` above (docs/adr/0019-symbol-query-prefixes.md).
strip = ["@"]

[plugin.reexports]
# A local or explicit export (`export { T } from "./a"`) beats `export *`
# for the same name in ES modules, so core's linker stops at the named row
# (docs/adr/0020-named-reexport-shadows-glob.md).
named_shadows_glob = true
