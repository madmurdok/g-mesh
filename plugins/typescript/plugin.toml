# Bundled JS/TS plugin manifest. See docs/architecture/plugin-modularity.md
# (Data Model section) for the schema this file follows, and
# core/src/daemon/manifest.rs (`read_manifest`) for the parser/validation
# rules it must satisfy.
#
# `language` below is "typescript" - the plugin's actual wire identifier, per
# its handshake (plugins/typescript/src/index.ts: `language: "typescript"`)
# and core/src/protocol/types.rs's `handshake_payload_round_trips` test.
# `read_manifest` requires `language` to equal this manifest's *containing
# directory* name, which is why this directory (formerly `plugins/js-ts`) is
# named `typescript` rather than describing the toolchain that builds it -
# task 155 (the discovery-wiring task) renamed it to close that gap, so the
# bundled plugin goes through the exact same directory-name-is-the-manifest's-
# language rule as any other discovered plugin, no special case retained.

[plugin]
language = "typescript"
protocol_version = 2
# This plugin's OWN semver, not g-mesh's release version - GM-303 wrote down
# why (docs/architecture/plugin-modularity.md, "plugin_version: two rules,
# not one"): this directory is a separate npm package, not a member of the
# cargo workspace the release version is cut from, so it is bumped by hand
# for its own capability changes - 2.1.0 for becoming a self-contained Node
# SEA, 2.2.0 for the --run-node entry path (see `git log` on this file and on
# package.json) - and must equal package.json's `.version`, which the
# handshake follows via scripts/generate-version.js. Two tests hold that
# agreement: `every_declaration_of_the_bundled_plugins_version_agrees` and
# `the_bundled_plugins_handshake_reports_the_version_its_manifest_declares`,
# both in core/src/daemon/manifest.rs. scripts/cut-release.sh re-checks it
# directly at release time too, since neither test runs under --skip-tests.
plugin_version = "2.2.0"

[plugin.spawn]
command = "node"
args = ["dist/src/index.js"]

[plugin.languages]
extensions = [".ts", ".tsx", ".mts", ".cts", ".js", ".jsx", ".mjs", ".cjs"]

[plugin.capabilities]
# TypeScript's own checker is this plugin's semantic tier (src/semantic.ts) -
# core may send it a semanticPass request.
semantic_pass = true
# Both tiers leave receiver calls (`x.foo()`) unresolved: the structural pass
# has no type information to know what `x` is, and the semantic pass
# (src/semanticPass.ts) resolves imports/overloads/declaration targets but
# does not yet walk method-call receivers to an edge. Honest gap, not a
# missing feature this manifest should overclaim - see
# docs/architecture/multi-language-plugins.md's `plugin.toml additions`
# section for what core does with an "unresolved" declaration (lists the gap
# in the MCP instructions rather than silently under-reporting call sites).
receiver_calls = "unresolved"
receiver_calls_structural = "unresolved"

[plugin.workspace]
# No file here plays the role go.mod/Cargo.toml/*.csproj play for their
# languages (a workspace-boundary file whose change moves module/crate
# roots and forces a per-language reindex): tsconfig.json/package.json's
# path-mapping and package-boundary facts are already read fresh per file
# by tsconfigPaths.ts/workspace.ts rather than cached at a project-wide
# model that a stale read could poison, so there is nothing this field
# needs to name yet.
watch_files = []
# Mirrors this plugin's own walk exclusions (ignorePolicy.ts's
# HARD_EXCLUDED_DIRS), minus `.git`/`.claude`, which are already excluded
# at the baseline core level and are not specific to this language - the
# same split the architecture doc's Go example makes (`vendor`/`testdata`,
# not `.git`).
exclude_dirs = ["node_modules", "dist"]
# A miss-path lookup treats a directory's `index` file as its container's
# entry point - the Node/bundler convention this repo already indexes.
entry_points = ["index"]
