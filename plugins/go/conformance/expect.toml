# Post-linking expectations for the Go plugin, answered by the same handler
# code the MCP tools use (core/src/cli/plugin_check/expectations.rs):
#
#   g-mesh plugins check plugins/go \
#     --fixture plugins/go/conformance/project \
#     --expect  plugins/go/conformance/expect.toml
#
# **Deliberately minimal.** GM-282 owns the full Go expectations file, and
# this one is not it. Every entry below exists to prove *one* end-to-end
# claim, and nothing here tries to cover the fixture:
#
#   - GM-280's claim about the linker contract - that the container-scoped,
#     `name`-keyed placeholders the structural tier emits are addresses core
#     can actually resolve (the first five entries);
#   - GM-281's claim about the semantic tier - that a `go/types` pass
#     resolves each of the three receiver shapes (through a variable,
#     through an embedded field, through an interface value) and that
#     `types.Implements` finds implementers nothing in the syntax declares
#     (the last four).
#
# The second group is what makes this file a discrimination test for the
# semantic tier as a whole: run the same fixture with a `go` binary off
# PATH, or with the Selections lookup disabled, and exactly those four fail
# while the five structural ones still pass.
#
# Every `expect` list is an exact set, which is what makes the two `helper`
# entries a real test rather than two ways of finding some function with that
# name: the fixture declares `helper` twice, unexported, in two different
# packages, and each entry asserts that *only* its own package's caller
# reaches it. An address that was file-scoped, or scoped to the project
# rather than to a container, would put the other package's caller in the set
# and fail here.

# A cross-file call inside one package, linked through core's container-
# scoped lookup: main.go's `Placeholder` calls `helper`, which is declared in
# helper.go. This is the single most important line in this file - it is the
# shape core's linker must accept from a Go placeholder, and the reason
# `scope = container` exists in the wire protocol at all.
#
# `init`'s call is the same-file, already-resolved half of the same picture:
# it is in the set because it is a real caller, and it is attributed to `init`
# rather than to the file because this plugin gives `init` a node of its own.
[[callers]]
symbol = "helper"
file = "helper.go"
expect = ["main.go:Placeholder", "helper.go:init"]

# The same shape in the server package, against an identically named target.
# The root package's `Placeholder` and `init` must NOT appear here, and this
# package's `New` must not appear above: an unexported symbol is visible only
# inside its own container, and a container-scoped placeholder never looks
# outside the container it names.
[[callers]]
symbol = "helper"
file = "server/conn.go"
expect = ["server/server.go:New"]

# A qualified cross-package call, `app.Placeholder()`, from the *external*
# test package - a different container (`github.com/example/app_test`) from
# the one it calls into. It links because `Placeholder` is exported; the two
# entries above are what show that an unexported one would not have.
[[callers]]
symbol = "Placeholder"
expect = ["app_test.go:TestPlaceholder"]

# The same cross-file link again, in the *second module* of the fixture's
# go.work. Both files' container key comes from tools/go.mod, so this passes
# only if they agree on it.
[[callers]]
symbol = "local"
expect = ["tools/gen.go:Generate"]

# An import of a package of this project resolves onto that package's
# container node; an import of anything else stays an unresolved placeholder.
# Both render the same way here (`container:<key>`) - see expectations.rs's
# decision 2 for why the row shape cannot tell them apart - so what this
# entry pins down is that a Go file's imports are addressed as containers at
# all, and that both of cmd/main.go's are present.
[[imports]]
file = "cmd/main.go"
expect = ["container:fmt", "container:github.com/example/app/server"]

# --- GM-281: the semantic tier ------------------------------------------
#
# Each of the four below is unanswerable without type information, and each
# is an exact set, so a pass that resolved the *wrong* declaration fails
# here just as loudly as one that resolved nothing.

# Receiver call through a variable (`s := server.New(); s.Addr()`) and
# through an *embedded field* (`l.Addr()` on a Logged that embeds *Server),
# in one set. Neither call site names `Server` at all: the first knows only
# that `s` came out of `New()`, and the second calls a method Logged never
# declares. `types.Info.Selections` answers both with the same declaration,
# which is why they are one expectation rather than two.
[[callers]]
symbol = "Server.Addr"
expect = ["cmd/main.go:main", "server/logged.go:UseLogged"]

# A method call through a struct field, resolved to the sibling file that
# declares it. The structural tier emits nothing here either: `c.server` is
# a selection through a value, and so is the `.Close()` on it.
[[callers]]
symbol = "Server.Close"
expect = ["server/conn.go:Conn.Close"]

# Receiver call through an *interface value*. The honest answer is the
# interface method's own declaration - which concrete `Close` runs is a
# run-time question - so `Closer.Close` is what carries the caller, and
# `[[implementations]]` below is what gets a reader from there to the
# concrete types.
[[callers]]
symbol = "Closer.Close"
expect = ["server/conn.go:CloseAll"]

# Implicit implementation: the thing Go's structural interfaces make
# invisible to any amount of parsing. Three implementers, none of which
# mentions Closer anywhere - Server (pointer receiver), Conn (pointer
# receiver), and Logged, which declares no Close at all: it embeds *Server,
# and the method-set promotion is what satisfies the interface.
[[implementations]]
symbol = "Closer"
expect = [
  "server/server.go:Server",
  "server/conn.go:Conn",
  "server/logged.go:Logged",
]
