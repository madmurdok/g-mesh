# Post-linking expectations for the Python plugin - `g-mesh plugins check
# plugins/python --fixture plugins/python/conformance/project --expect
# plugins/python/conformance/expect.toml`, which `tests/conformance.rs` runs
# from `cargo test`.
#
# These are the acceptance criteria of GM-296, and since GM-299 of the pyright
# tier as well, turned into assertions against a *linked* index: the checks
# above this section prove the plugin's stream is well formed, and only these
# prove that the edges it emits actually reach the declarations they name.
#
# **`tier = "semantic"`** marks the three entries that need a real pyright
# behind the SDK's `LspBridge` - decision 6 of
# `core/src/cli/plugin_check/expectations.rs`'s own module doc, the same way
# `plugins/rust/conformance/expect.toml` marks its five.
# `tests/conformance.rs` runs this file three ways, and the three together are
# the whole point:
#
#   1. with the manifest this plugin ships, where all eleven entries run and pass;
#   2. with 3.4.0's own manifest (`semantic_pass = false`, no
#      `[plugin.semantic]`) and `--skip-semantic-expectations`, where those
#      three report `Skip` and the other eight - every structural entry here -
#      keep passing;
#   3. with 3.4.0's manifest and *without* the skip flag, where those three
#      must FAIL.
#
# Arm 3 is the discrimination, and it is not decoration: measured, it fails
# exactly three entries, each for the reason it was written -
#
#   callers[2]  missing through_a_base_annotation, module_alias_is_bound
#   callers[3]  empty, wanted through_a_subclass   (the subclass's override)
#   callers[4]  missing through_a_variable          (a local, typed by inference)
#
# - which is how this file is known to be measuring the pyright tier rather
# than describing it.
#
# Every category `g-mesh plugins check --expect` can assert is exercised at
# least once
# (`core/src/cli/plugin_check/expectations.rs`'s module doc has the
# format/anchoring/paging contract):
#
#   - callers, through a package's `__all__` re-export chain and through a
#     module-qualified call and a bare imported name, all against one
#     declaration (`assist`);
#   - callers, through a relative import two levels up (`assist` again, from
#     `pkg/sub/deep.py`);
#   - callers, across a PEP 420 namespace package (`greet`);
#   - callers, a class-qualified call, plus the receiver calls pyright answers
#     and the one it does not (`Base.describe`, semantic - see that entry's
#     own comment, which is the sharpest one in this file);
#   - callers, the same call spelling resolved to a subclass's override
#     (`Deep.describe`, semantic - `Base.describe`'s exact control);
#   - callers, a call through a method's own instance parameter, and one
#     through a local typed only by inference (`Greeter.render`, semantic);
#   - references (`Base`, which `[[callers]]` cannot reach at all - a base
#     class and an import line are both usages, never calls);
#   - references through the `__all__` chain for a *class* (`Greeter`);
#   - implementations (`Base`, `class Sub(Base)` found by
#     `find_implementations`) - deliberately still structural after GM-299,
#     because pyright implements no `textDocument/implementation` at all;
#   - imports (`pkg/sub/deep.py`, both of them relative);
#   - importers, the *incoming* direction (`pkg/helpers.py`, GM-365's new
#     category - see that entry, and `expectations.rs`'s decision 7: it is
#     where GM-356's file-to-module substitution is asserted, and where
#     GM-358's missing edge is asserted from the other end);
#   - definition, anchored on the module self-announcement node
#     (`pkg.sub.deep`) - the node `crate::project`'s Decision 1 obliges this
#     plugin to emit, asserted here to be a real, addressable declaration
#     rather than an internal detail.
#
# Every `expect` is a SET of `"filePath:qualifiedName"` strings - order never
# matters, and an entry missing from the set is as much of a failure as an
# extra one. A `"filePath:"` row with nothing after the colon is a whole-file
# row: the usage sits outside any tracked symbol, which for Python is what an
# `import` line at a module's top level is.

# --- callers: the `__all__` re-export chain, a module-qualified call, a bare
#     imported name, and a relative import two levels up ----------------------

[[callers]]
symbol = "assist"
# `pkg.helpers.assist` is called four ways, and each one is a different row of
# `src/extractor/bodies.rs`'s own table:
#
#   - `pkg/consumer.py:build` calls it as `helper(...)`, imported by
#     `from pkg import helper`. Nothing in container `pkg` is named `helper`
#     and nothing in `pkg/__init__.py` declares it, so the only path from that
#     call to this declaration is core's re-export walk over the `reexport`
#     node `__all__ = [..., "helper"]` produced - carrying the *rename*, which
#     is why the published name is `helper` and the target's key is `assist`.
#     This entry is the `__all__` acceptance criterion.
#   - `pkg/mod.py:call_through_module` calls it as `helpers.assist(...)`,
#     where `helpers` came from `from . import helpers` - a module-qualified
#     call, addressed by `name` key in container `pkg.helpers`.
#   - `pkg/mod.py:call_through_imported_name` calls it bare, after
#     `from .helpers import assist`.
#   - `pkg/sub/deep.py:Deep.describe` calls it as `helpers.assist(...)` too,
#     but `helpers` got there through `from .. import helpers` - a **relative
#     import two levels up**, the other acceptance criterion. Its presence
#     here is what proves the dots resolved to `pkg` rather than to
#     `pkg.sub`: had they resolved to `pkg.sub`, the placeholder would address
#     container `pkg.sub.helpers`, which nothing declares, and this row would
#     simply be absent.
expect = [
    "pkg/consumer.py:build",
    "pkg/mod.py:call_through_module",
    "pkg/mod.py:call_through_imported_name",
    "pkg/sub/deep.py:Deep.describe",
]

# --- callers: across a PEP 420 namespace package -----------------------------

[[callers]]
symbol = "greet"
file = "pkg/mod.py"
# `pkg/plugins/` holds no `__init__.py`, so `pkg.plugins` is a namespace
# package that exists only because `loader.py`'s own self-announcement node is
# a member of it (`crate::project`, Decision 3). `load` calling `greet` across
# that boundary is the edge that would be missing if the parent chain gapped
# there.
#
# `Greeter.render`'s call is the same declaration reached from inside a method
# body: a bare name in a method resolves to the *module's* `greet`, not to the
# sibling method `Greeter.greet` - which is Python's own rule, since a class
# body is not a closure.
#
# `file` is given because `pkg/__init__.py` publishes a `reexport` node also
# named `greet`; naming the file picks the declaration rather than the
# pass-through.
expect = ["pkg/plugins/loader.py:load", "pkg/mod.py:Greeter.render"]

# --- callers: a class-qualified call, plus the receiver calls pyright answers
#     and the one it does not (GM-299) --------------------------------------

[[callers]]
symbol = "Base.describe"
tier = "semantic"
# Through 3.4.0 this entry was the receiver gap's airtight *proof of absence*:
# `describe` was called two ways in `pkg/mod.py` and only `call_through_a_class`'s
# class-qualified `Base.describe(obj)` produced an edge, so the set was one
# row and the other call's absence was the assertion. (Proven, not claimed:
# `src/extractor/bodies.rs` was deliberately broken to give an unresolved
# receiver the naive "let core sort it out" answer, and this entry failed with
# exactly one extra row.)
#
# GM-299 turns it over, and the honest set is now **three rows and not four**,
# which is what makes this the sharpest entry in the file:
#
#   - `pkg/mod.py:call_through_a_class` is the structural one, unchanged.
#   - `pkg/callers.py:through_a_base_annotation` is `obj.describe()` where
#     `obj: Base`. pyright reads the annotation; the structural tier records a
#     receiver open site and no edge.
#   - `pkg/mod.py:module_alias_is_bound` is `base_module.Base().describe()` -
#     a receiver that is a *call result*, which nothing structural can type
#     and which pyright types without being asked twice.
#   - `pkg/mod.py:on_an_unknown_receiver` is `obj.describe()` where `obj` has
#     **no annotation**, and it is absent *with pyright running*. That is the
#     Python-specific half of this task's honesty requirement, asserted rather
#     than merely written in the README: a `receiver_calls = "resolved"`
#     manifest does not mean every receiver call resolves, it means the ones
#     whose type a checker can infer do. pyright answers `null` here, the
#     bridge records nothing (missing edge beats wrong edge), and this set
#     stays at three. If that ever became four, the pass would have started
#     guessing.
#
# `pkg/sub/deep.py:Deep.describe` *overrides* this method and does not call
# it, so it must not appear either - and the call that reaches the override
# is asserted separately, below, as the pair that makes both entries
# measurements rather than one claim written twice.
expect = [
    "pkg/mod.py:call_through_a_class",
    "pkg/mod.py:module_alias_is_bound",
    "pkg/callers.py:through_a_base_annotation",
]

# --- callers: the same call spelling, resolved to a SUBCLASS's override -----

[[callers]]
symbol = "Deep.describe"
tier = "semantic"
# `pkg/callers.py:through_a_subclass` writes `deep.describe()` where
# `deep = Deep()`. Character for character the same shape as
# `through_a_base_annotation` above; the only difference is the receiver's
# type, which is precisely what only a semantic tier knows.
#
# The two entries are exact sets and are each other's control: a pass that
# resolved every `describe()` to the base's declaration fails *here* on the
# missing row, and a pass that resolved them all to the override fails
# *above* on the missing rows. One of them passing alone would prove nothing.
expect = ["pkg/callers.py:through_a_subclass"]

# --- callers: through a method's own instance parameter, and through a local
#     whose type comes from its initializer -----------------------------------

[[callers]]
symbol = "Greeter.render"
tier = "semantic"
# `pkg/mod.py:Greeter.shout` calls `self.render()`, which the *structural*
# tier resolves by reading the method's first parameter and never the name
# `self` (`src/extractor/bodies.rs`, Decision 7). That half needs no
# toolchain and is pinned where none is needed: `src/extractor/tests.rs`'s
# `a_call_through_a_methods_first_parameter_resolves_to_that_class`.
#
# `pkg/callers.py:through_a_variable` is the semantic half: `greeter.render()`
# where `greeter = Greeter(name)`. No annotation anywhere - the type comes
# from the initializer, which is inference rather than declaration, and is
# the most ordinary shape in Python code that has no type hints at all.
expect = ["pkg/mod.py:Greeter.shout", "pkg/callers.py:through_a_variable"]

# --- references: usages [[callers]] cannot reach at all ----------------------

[[references]]
symbol = "Base"
file = "pkg/base.py"
# `Base` is never called - it is a class, and `Greeter(name)` is a call to
# `Greeter`, not to its base - so this is the category `[[callers]]`
# structurally cannot exercise for it.
#
#   - `pkg/mod.py:Greeter` and `pkg/sub/deep.py:Deep` are `SUPERTYPE_OF`
#     edges, an edge kind `find_references` reports and `find_callers` does
#     not share;
#   - `pkg/mod.py:` and `pkg/sub/deep.py:` are whole-file rows: the
#     `from pkg.base import Base` and `from ..base import Base` lines
#     themselves, which belong to the file rather than to anything in it.
#     `pkg/sub/deep.py:`'s presence is the relative-import acceptance case
#     again, this time for a *named* symbol rather than for a module;
#   - `pkg/mod.py:module_alias_is_bound` uses it as `base_module.Base()`,
#     where `base_module` came from `import pkg.base as base_module` - the
#     aliased-module-import shape, whose alias binds the whole dotted path.
#
# `pkg/mod.pyi` declares a `class Greeter(Base)` too and must **not** appear:
# a `.pyi` stub contributes its `File` node and nothing else
# (`crate::project`, Decision 6; `src/extractor`, Decision 8). Its absence
# here is the second half of the stub acceptance criterion, asserted against
# a linked index rather than against one file's graph.
#   - `pkg/gaps.py:` is a third import line, the one `gap_2_monkey_patching`
#     needs. Its `Base.describe = replacement` is a reference to
#     `Base.describe`, not to `Base`, and it is a `REFERENCES` edge rather
#     than a `CALLS` one - which is why `pkg/gaps.py:gap_2_monkey_patching`
#     appears in neither this set nor `Base.describe`'s caller set above.
#   - `pkg/callers.py:` and `pkg/callers.py:through_a_base_annotation` are
#     GM-299's: the `from pkg.base import Base` line, and the *annotation*
#     `obj: Base`, which is an ordinary structural `REFERENCES` edge in both
#     arms. The call inside that function is the semantic half and is
#     asserted separately, under `Base.describe`.
#
# `pkg/dynamic.py` must **not** appear, and its absence is the fixture for
# gap 4: `from pkg.base import *` is recorded as a container import and a `*`
# re-export, never as a reference to any particular name, so nothing here
# points at `Base` - not structurally, and not with pyright either, because
# the bridge only ever asks about open sites and a bare star-imported name is
# deliberately not one.
expect = [
    "pkg/callers.py:",
    "pkg/callers.py:through_a_base_annotation",
    "pkg/gaps.py:",
    "pkg/mod.py:",
    "pkg/mod.py:Greeter",
    "pkg/mod.py:module_alias_is_bound",
    "pkg/sub/deep.py:",
    "pkg/sub/deep.py:Deep",
]

# --- references: a class reached through the `__all__` chain -----------------

[[references]]
symbol = "Greeter"
file = "pkg/mod.py"
# The class half of the `__all__` acceptance criterion. `pkg/consumer.py` does
# `from pkg import Greeter`, and container `pkg` declares no `Greeter` at all -
# only the `reexport` node `pkg/__init__.py`'s `__all__` produced, pointing at
# container `pkg.mod`. Both rows from that file are the chain: the import line
# itself (the whole-file row) and `build`'s `Greeter(name)`, which is a
# `REFERENCES` edge rather than a `CALLS` one because core's linker lands a
# `CALLS` edge only on a `Function`.
#
# `pkg/mod.py:call_through_a_class` is the same construction written in the
# declaring file, resolved directly rather than through the chain.
#
# `pkg/callers.py:` and `pkg/callers.py:through_a_variable` are GM-299's, and
# structural in both arms: an import line, and `Greeter(name)`, which is a
# `REFERENCES` edge onto the class rather than a `CALLS` one for the same
# reason `pkg/consumer.py:build`'s is.
expect = [
    "pkg/callers.py:",
    "pkg/callers.py:through_a_variable",
    "pkg/consumer.py:",
    "pkg/consumer.py:build",
    "pkg/mod.py:call_through_a_class",
    "pkg/__init__.py:",
]

# --- implementations: class Sub(Base), found by find_implementations ---------

[[implementations]]
symbol = "Base"
file = "pkg/base.py"
# Both subclasses reach their base across a file boundary, one by an absolute
# import and one by a relative one two levels up. `pkg/mod.pyi`'s `class
# Greeter(Base)` is not a third implementor, because the stub emits nothing.
#
# Untagged, and that is a decision GM-299 had to make rather than inherit.
# `plugins/rust`'s equivalent gains a cross-crate implementor from the
# bridge's `textDocument/implementation` sweep; pyright answers that request
# with `{"code":-32601,"message":"Unhandled method"}` and advertises no
# `implementationProvider`, so the manifest's `implementation_kinds` is empty
# and no sweep runs for Python at all. This set is therefore exactly the
# structural one in both arms, and `find_implementations` on a Python class is
# exactly as complete - and as incomplete - as it was in 3.4.0.
#
# `pkg/dynamic.py:Megaphone` is the case that would have needed the sweep:
# `class Megaphone(Speaker)` where `Speaker` arrived through
# `from pkg.base import *`. It is absent here and stays absent, which is the
# honest report - see `plugins/python/README.md`.
expect = ["pkg/mod.py:Greeter", "pkg/sub/deep.py:Deep"]

# --- imports (get_dependencies, one hop, Outgoing): both relative ------------

[[imports]]
file = "pkg/sub/deep.py"
# `from ..base import Base` and `from .. import helpers`: two dots each, and
# both land on a container two levels up from the module rather than one.
# `container:` is how a row with no `filePath` renders, and a container node's
# `qualifiedName` is its key - so `container:pkg` is the package itself, which
# `from .. import helpers` reads a member out of, and `container:pkg.base` is
# the module `from ..base import …` names.
#
# `container:pkg.helpers` is the GM-358 entry: `helpers` is not a symbol
# `pkg/__init__.py` declares, it is `pkg/helpers.py` - a real submodule, the
# same shape `src/requests/__init__.py`'s `from . import packages, utils` and
# `tests/test_utils.py`'s `from requests import compat` measured against
# psf/requests. Before the fix this row was silently missing (`truncated:
# false`, no flag - indistinguishable from a complete answer) and only
# `container:pkg`/`container:pkg.base` came back; `find_references` on
# `pkg::helpers` already worked, since it never depended on the missing
# `IMPORTS` edge.
#
# It is anchored on *this* file rather than on `pkg/mod.py`, whose imports are
# more varied, because the kit's session empties and restores the file with
# the most nodes - `pkg/mod.py` - and core GCs a container whose last member
# goes, taking every `IMPORTS` edge pointing at it along
# (`graph::containers`: "importers' placeholders come back on their next
# reindex", which within one session never happens). An expectation over
# `pkg/__init__.py`'s imports would be asserting that deliberate core
# behaviour, not this plugin's.
expect = ["container:pkg", "container:pkg.base", "container:pkg.helpers"]

# --- definition: the module self-announcement node ---------------------------

[[definition]]
symbol = "pkg.sub.deep"
# `crate::project`'s Decision 1 obliges this plugin to emit, for every
# non-stub module and `__init__` file with a parent package, one node whose
# `qualifiedName` is the module's own dotted key. This entry asserts it is a
# real declaration a lookup can land on - not an internal artefact - and that
# it lives in the file it describes.
expect = ["pkg/sub/deep.py:pkg.sub.deep"]

# --- importers (get_dependencies, one hop, Incoming): the other direction ----
#     (GM-356 and GM-358, and `expectations.rs`'s decision 7)

[[importers]]
file = "pkg/helpers.py"
via_module = "pkg.helpers"
# Until GM-365 every entry in this kit asked an *outgoing* question, and two
# of this batch's six defects were in this direction. This entry is where
# both of them would have been caught.
#
# `via_module` is half the assertion, and it is GM-356's: in Python an
# `IMPORTS` edge arrives at the *module* `pkg.helpers`, never at
# `pkg/helpers.py`, so a walk literally anchored on the file finds no
# incoming edge and returns `results: []` with `truncated: false` - a
# well-formed zero saying "nothing imports this" about a file five statements
# in four files import. The fix substitutes the module the file defines and
# names it in `resolvedFrom.qualifiedName`; this entry requires that key
# exactly, so against the pre-fix binary it fails twice - no substitution,
# and an empty set.
#
# The five statements behind the five rows, read out of the fixture rather
# than off the tool's own answer:
#
#   - `pkg/mod.py` imports it three ways at once (`import pkg.helpers`,
#     `from . import helpers`, `from .helpers import assist`), which collapse
#     onto one row: this is a walk over nodes, not a list of statements.
#   - `pkg/__init__.py`: `from .helpers import assist as helper`.
#   - `pkg/plugins/loader.py`: `from pkg.helpers import *` - a star import is
#     still an import of the module.
#   - `pkg/gaps.py`: `from .helpers import SEPARATOR as JOINER`, inside a
#     `try:`. An import in a conditional body is an import.
#   - `pkg/sub/deep.py`: `from .. import helpers` - and this row is GM-358's,
#     from the other end. `helpers` there is a *submodule* reached through a
#     relative import two levels up, exactly the `from <pkg> import
#     <submodule>` form that built no `IMPORTS` edge before 3.8.0. The
#     `[[imports]]` entry above asserts that same edge from deep.py's side as
#     `container:pkg.helpers`; this asserts it from the module's, which is
#     the side a caller asking "what would break if I changed this file"
#     actually reads. Against a pre-GM-358 binary (with GM-356 in place) this
#     entry fails on that one missing row while the other four stay - a
#     missing member rather than an empty answer, which is the discrimination
#     the two halves of the fix have to be told apart by.
#
# Anchored on `pkg/helpers.py` and not on `pkg/mod.py` for the reason the
# `[[imports]]` entry above gives at length: the session empties and restores
# the file with the most nodes, which is `pkg/mod.py`, and a container whose
# last member went with it is GC'd along with every `IMPORTS` edge pointing
# at it. `pkg.helpers`' members are all in `helpers.py`, which the session
# never touches.
expect = [
    "pkg/__init__.py",
    "pkg/gaps.py",
    "pkg/mod.py",
    "pkg/plugins/loader.py",
    "pkg/sub/deep.py",
]

# --- refusal: a name this project does not declare --------------------------
#     (GM-371, and `expectations.rs`'s decision 9)

[[refusal]]
tool = "definition"
symbol = "os.path"
contains = [
  "nothing named 'os.path' is declared in this project",
  "It names something this project imports: 'os.path' (1)",
  "use get_dependencies",
]
# Python is the second of the two fixtures whose imports leave the project,
# so it is one of the two that can state GM-367's refusal in the form that
# change is actually about - see `plugins/go/conformance/expect.toml`'s pair
# for the full argument, which is not repeated here.
#
# What this entry adds over Go's is the *shape of the name*. `plugins/
# loader.py` writes `import os.path`, and the placeholder that leaves behind
# answers to the dotted specifier itself - `os.path` - and not to its last
# segment: `find_definition("path")` refuses this project with the terse
# "no symbol named 'path' found", having found no import record by that
# name at all. That is worth a fixture entry rather than a comment in core,
# because it is the plugin's choice of specifier that makes it true, and a
# plugin that one day indexed `import os.path` under `path` would still pass
# every other expectation in this file.
