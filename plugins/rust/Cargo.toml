[package]
name = "g-mesh-plugin-rust"
version = "3.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "g-mesh's Rust language plugin: Cargo.toml/workspace/module-tree project model (GM-285), tree-sitter extraction (GM-286)"

[lib]
name = "g_mesh_plugin_rust"
path = "src/lib.rs"

[[bin]]
name = "g-mesh-plugin-rust"
path = "src/main.rs"

[dependencies]
anyhow = "1"
g-mesh-plugin-sdk = { path = "../sdk" }
g-mesh-wire = { path = "../../wire" }
# `Cargo.toml` parsing for the project model (`project::cargo_manifest`) -
# crate roots and workspace membership, read as data, never by invoking
# `cargo` itself. Already a dependency of `g-mesh-plugin-sdk` (for its own
# `plugin.toml`), so this adds no new crate to the workspace's dependency
# graph, only a second user of one already vetted.
toml = "0.8"
serde = { version = "1", features = ["derive"] }
# The structural tier's parser (GM-286). tree-sitter rather than `syn` or
# `rustc_ast`, for the reason the design doc gives for every plugin on this
# SDK: an error-tolerant parser is the requirement (`Extractor`'s own
# contract - "a syntax error is a normal answer"), and `syn` is all-or-nothing
# on a half-typed file, which is exactly the file someone is about to ask a
# question about. It is also the same grammar family every other plugin in
# this design uses, so the shape of an extractor is one shape.
#
# ONE NON-OBVIOUS CONSEQUENCE, MEASURED RATHER THAN ASSUMED. `tree-sitter`
# depends on `serde_json` with its `preserve_order` feature, which swaps
# `serde_json::Map`'s backing store from `BTreeMap` (keys sorted) to
# `IndexMap` (keys in insertion order). Cargo unifies features across the
# packages *being built together*, so this reaches `core` in a workspace-wide
# build - `cargo test --workspace`, or a bare `cargo build` at the root -
# and changes the key order of any JSON core builds through `Value` rather
# than through a derive.
#
#   cargo tree -p g-mesh    -e features | grep -c preserve_order  -> 0
#   cargo tree              -e features | grep -c preserve_order  -> 1
#
# It does **not** reach the shipped binary: `scripts/build-targets.sh` builds
# core from `core/`, package-scoped, where tree-sitter is not in the graph at
# all. So the effect is confined to workspace-wide builds, and the whole
# suite passes under it (nothing asserts sorted JSON keys) - but a CI
# workspace run is exercising a core whose `Value` key order differs from the
# released one, which is worth knowing before blaming a diff on something
# else.
tree-sitter = "0.25"
tree-sitter-rust = "0.24"

[dev-dependencies]
# `tests/workspace_changed.rs` drives the plugin's control-plane wire
# directly (hand-rolled `Content-Length` framing, no SDK-published client
# harness - see that test's own module doc) and needs to build/read the JSON
# frames it sends and receives.
serde_json = "1"
