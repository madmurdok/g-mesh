[package]
name = "g-mesh-plugin-rust"
version = "3.11.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "g-mesh's Rust language plugin: Cargo.toml/workspace/module-tree project model (GM-285), tree-sitter extraction (GM-286)"

[lib]
name = "g_mesh_plugin_rust"
path = "src/lib.rs"

[[bin]]
name = "g-mesh-plugin-rust"
path = "src/main.rs"

[dependencies]
anyhow = "1"
g-mesh-plugin-sdk = { path = "../sdk" }
g-mesh-wire = { path = "../../wire" }
# `Cargo.toml` parsing for the project model (`project::cargo_manifest`) -
# crate roots and workspace membership, read as data, never by invoking
# `cargo` itself. Already a dependency of `g-mesh-plugin-sdk` (for its own
# `plugin.toml`), so this adds no new crate to the workspace's dependency
# graph, only a second user of one already vetted.
toml = "0.8"
serde = { version = "1", features = ["derive"] }
# The structural tier's parser (GM-286). tree-sitter rather than `syn` or
# `rustc_ast`, for the reason the design doc gives for every plugin on this
# SDK: an error-tolerant parser is the requirement (`Extractor`'s own
# contract - "a syntax error is a normal answer"), and `syn` is all-or-nothing
# on a half-typed file, which is exactly the file someone is about to ask a
# question about. It is also the same grammar family every other plugin in
# this design uses, so the shape of an extractor is one shape.
#
# ONE NON-OBVIOUS-LOOKING CONSEQUENCE, MEASURED RATHER THAN LEFT AT THE FIRST
# READING (GM-302). `tree-sitter` depends on `serde_json` with its
# `preserve_order` feature, which swaps `serde_json::Map`'s backing store from
# `BTreeMap` (keys sorted) to `IndexMap` (keys in insertion order):
#
#   cargo tree -p g-mesh    -e features | grep -c preserve_order  -> 0
#   cargo tree              -e features | grep -c preserve_order  -> 1
#
# Read at face value, that says cargo's feature unification carries
# `preserve_order` into `core` on any workspace-wide build (`cargo test
# --workspace`, or a bare `cargo build` at the root), changing the key order
# of any JSON core builds through `Value` rather than through a derive. IT
# DOES NOT, and this is the "measured rather than assumed" part: `tree-sitter`
# needs `preserve_order` as a BUILD-dependency of its own code generation, and
# cargo's resolver v2 keeps build-dependencies and proc-macros in a separate
# "host artifact" feature resolution from the normal/target graph a linked
# binary or library actually draws from - which is exactly why `cargo tree -e
# normal,features,no-proc-macro` (excluding those two host-only edge kinds)
# reads 0 on BOTH views above, not just the scoped one. Confirmed beyond that
# filtered `cargo tree` reading, too: `cargo build --workspace -v`'s rustc
# invocation for both the `g-mesh` bin and core's own lib/test targets under
# `cargo test --workspace` link the identical compiled `serde_json` unit
# (features `["alloc","default","std"]`, no `preserve_order`) that the
# package-scoped, shipped build does; and a real `g-mesh mcp-shim`, spoken to
# over its actual wire protocol, returns a byte-identical `tools/list`
# response - every schema's property order included - built either way.
#
# So core's shipped JSON key order does not, today, differ from what `cargo
# test --workspace` exercises, and `scripts/build-targets.sh`'s package-scoped
# build (where tree-sitter is not in the graph at all) was never the reason -
# the reason is resolver v2's host/target separation, which holds regardless
# of build scope. `scripts/cut-release.sh`'s `check_core_feature_isolation`
# (GM-302) is the standing check that this stays true, since nothing pins
# that separation down the way a type system would - a future dependency that
# pulls the same feature in as a NORMAL dependency of something core links
# would flip it, and that function is written to catch exactly that (verified
# by injecting precisely that change temporarily and watching it fail - see
# GM-302's completion notes).
tree-sitter = "0.25"
tree-sitter-rust = "0.24"

[dev-dependencies]
# `tests/workspace_changed.rs` drives the plugin's control-plane wire
# directly (hand-rolled `Content-Length` framing, no SDK-published client
# harness - see that test's own module doc) and needs to build/read the JSON
# frames it sends and receives.
serde_json = "1"
