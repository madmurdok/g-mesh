# Post-linking expectations for the Rust plugin - `g-mesh plugins check
# plugins/rust --fixture plugins/rust/conformance/project --expect
# plugins/rust/conformance/expect.toml`, which `tests/conformance.rs` runs
# from `cargo test`.
#
# GM-287's full file - every category `g-mesh plugins check --expect` can
# assert (`core/src/cli/plugin_check/expectations.rs`'s module doc has the
# format/anchoring/paging contract), each exercised at least once against
# `conformance/project`, the fixture GM-285/GM-286 built and this task moved
# here from `tests/fixtures/workspace` so CI and `cargo test` share one copy
# (`plugins/typescript/conformance/`'s own layout, GM-277's precedent):
#
#   - callers, free fn (`shapes::describe`, called across crates through a
#     plain `use` import - not a path call, not a pub-use rename chain);
#   - callers, path (`nested::deep::work`, a module-qualified path call
#     within one crate - the `name`-keyed row of `bodies.rs`'s own table);
#   - callers, `Self::` and cross-crate path together (`shapes::Square::new`
#     - see that entry's own comment);
#   - callers, cross-crate through a `pub use` chain (`internals::published`);
#   - callers, `pub(crate)` visibility (`internals::crate_only` - GM-286's
#     own acceptance case, kept here rather than duplicated);
#   - callers, the receiver-call gap now closed (`shapes::Square::perimeter`,
#     semantic - see that entry for how GM-290 turned an assertion of
#     absence into one of presence);
#   - callers, a receiver call through a variable and through a trait object
#     (semantic): `shapes::<Square as Shape>::area` and `shapes::Shape::area`,
#     one pair of exact sets that a pass resolving either to the other's
#     answer fails twice;
#   - callers, a default trait method through a generic (semantic):
#     `shapes::Shape::label`;
#   - implementations in another crate of the workspace (semantic):
#     `shapes::Loud`, which `crates/beta` implements through a glob import
#     the structural tier cannot follow;
#   - references (`shapes::Shape`, which `[[callers]]` cannot reach at all -
#     a trait bound and a `SUPERTYPE_OF` edge are both usages, never calls);
#   - implementations (`shapes::Shape`, `impl Trait for T` found by
#     `find_implementations` - GM-286's own acceptance case);
#   - implementations, the three shapes whose edge does not start at a type
#     declaration (`blanket::Sink`, GM-361): two blanket impls, which start
#     theirs at the `impl` block, and one inside an inline module, whose
#     module must not be reported as a fifth implementor;
#   - imports (`nested/mod.rs`, a glob and a container-scoped named re-export
#     - GM-286's own acceptance case);
#   - definition, three times (`internals::crate_only` with a
#     redundant-but-armless `file`, `shapes::Square::perimeter` without one,
#     and GM-360's `Ruler`, where `file` is load-bearing);
#   - references, a qualifiedName two crates carry (GM-360's `shapes::Gauge`).
#
# Every `expect` is a SET of `"filePath:qualifiedName"` strings - order never
# matters, and an entry missing from the set is as much of a failure as an
# extra one.
#
# **`tier = "semantic"`** marks the five entries that need a real
# rust-analyzer behind the SDK's `LspBridge` (GM-290) - decision 6 of
# `core/src/cli/plugin_check/expectations.rs`'s own module doc, the same way
# `plugins/go/conformance/expect.toml` marks its four. `tests/conformance.rs`
# runs this file three ways, and the three together are the whole point:
#
#   1. with the manifest this plugin ships, where all eighteen entries run and
#      pass;
#   2. with 3.2.0's own manifest (`semantic_pass = false`, no
#      `[plugin.semantic]`) and `--skip-semantic-expectations`, where those
#      five report `Skip` and the other thirteen - every structural entry
#      here, ten of them unchanged since 3.2.0, two added by GM-360 and
#      one by GM-361 -
#      keep passing;
#   3. with 3.2.0's manifest and *without* the skip flag, where those five
#      must FAIL.
#
# Arm 2 is what "without rust-analyzer, the structural results are the 3.2.0
# results" means as something a machine checks. Arm 3 is the discrimination,
# and it is not decoration: measured, it fails exactly five entries, each for
# the reason it was written -
#
#   callers[5]  missing shapes::total_perimeter            (receiver call on a variable)
#   callers[6]  empty, wanted shapes::total                (variable receiver -> the impl's method)
#   callers[7]  empty, wanted total_dyn and gaps::measure  (trait object / generic -> the trait's)
#   callers[8]  empty, wanted shapes::describe             (a default trait method)
#   implementations[1]  missing beta's Megaphone           (an impl in another crate)
#
# - which is how this file is known to be measuring the rust-analyzer tier
# rather than describing it.
#
# 3.2.0's manifest rather than "the shipped one with a broken command" for
# arm 2 and 3, and the reason is the kit's own rule: a plugin that declares
# `semantic_pass = true` and cannot start an engine reports its whole-project
# pass incomplete, `watcher::apply` turns that into a session failure, and the
# kit then skips the entire expectations section. The degradation itself is
# asserted by `tests/conformance.rs`'s own missing-toolchain test, which reads
# the log rather than the expectations.

# --- callers: pub(crate), linkable from a sibling module and not from another
#     crate (GM-286's own acceptance case) --------------------------------------

[[callers]]
symbol = "internals::crate_only"
# `alpha::internals::crate_only` is `pub(crate)`, i.e. `container(alpha)`.
#
# IN: `shapes` is a *sibling* of `internals`, not an ancestor - it reaches the
# item because `alpha` is on its parent chain. `internals::published` reaches
# it from the same module. `nested::deep::deep_work` reaches it from two
# modules down, and that one is only linkable because every `mod` item is
# emitted as a member of the module that declares it: `alpha::nested`
# declares nothing else, so without `mod deep;` it would have no `containers`
# row, `parent_chain` would stop there, and `alpha` would never appear on the
# chain (see `src/extractor/decls.rs`, and that file's own doc).
#
# OUT, and this is the assertion: `crates/beta/src/main.rs:forbidden` calls it
# too, through a `use` that real `rustc` would reject. The plugin emits that
# placeholder like any other; core's visibility check is what must refuse it,
# because `alpha` is not on `beta_crate`'s parent chain. Its absence from this
# set is the check.
expect = [
    "crates/alpha/src/shapes.rs:shapes::<Circle as Shape>::area",
    "crates/alpha/src/internals.rs:internals::published",
    "crates/alpha/src/nested/deep.rs:nested::deep::deep_work",
]

# --- callers: a pub use re-export chain, cross-crate --------------------------

[[callers]]
symbol = "internals::published"
# `main` calls `exported_helper()`, imported from `alpha::prelude`, which
# declares nothing: the only path from the call to this declaration is core's
# re-export walk over `pub use crate::internals::published as exported_helper`
# - including the rename, which is why the placeholder's key is `published`
# and its node's name is `exported_helper`.
expect = ["crates/beta/src/main.rs:main"]

# --- callers: a type-qualified path call across crates, and a `Self::` call
#     against the same declaration from inside its own impl -------------------

[[callers]]
symbol = "shapes::Square::new"
# `Square::new(3)` in the other crate is addressed by `qualifiedName`, not by
# name: `alpha::shapes` holds several declarations named `new` would have to
# choose between if it were a name key. `unit`'s `Self::new(1)`, in this same
# file, resolves through the same `qualifiedName` lookup `bodies.rs`'s table
# gives `Self::f()` - `self_member` finds the impl's own type first - so one
# entry proves both the cross-crate path form and the in-impl `Self::` form
# reach the one declaration.
expect = ["crates/beta/src/main.rs:main", "crates/alpha/src/shapes.rs:shapes::Square::unit"]

# --- callers: a free function, called across crates through a plain `use` -----

[[callers]]
symbol = "shapes::describe"
# `main` imports `describe` by name (`use alpha::shapes::{describe, Square};`)
# and calls it bare - a free function, not a method and not a re-export
# rename, so this is the plain "name key in an imported container" row of
# `bodies.rs`'s own table, exercised cross-crate rather than same-file the
# way `internals::published`'s callers already are.
expect = ["crates/beta/src/main.rs:main"]

# --- callers: a module-qualified path call, within one crate ------------------

[[callers]]
symbol = "nested::deep::work"
# `run`'s `nested::deep::work()` is a multi-segment path whose qualifier
# (`nested::deep`) is a module, not a type - the `a::b::f()` row of
# `bodies.rs`'s table, addressed as a `name` key in the container the path
# names rather than by `qualifiedName`. `nested/mod.rs`'s own `pub use
# deep::work;` re-export is not a call site and must not appear here.
expect = ["crates/alpha/src/lib.rs:run"]

# --- callers: the receiver-call gap, now closed (GM-290) -----------------------

[[callers]]
symbol = "shapes::Square::perimeter"
tier = "semantic"
# This entry used to be the receiver-call gap's airtight *proof of absence*:
# `perimeter` is called three ways in this file, `Square::scale`'s
# `self.perimeter()` and `total_perimeter_via_path`'s
# `Square::perimeter(square)` both resolve structurally, and
# `total_perimeter`'s `square.perimeter()` did not - so the set below listed
# two callers and the third's absence was the assertion.
#
# GM-290 turns it over. With rust-analyzer behind the bridge the third call
# resolves too, so the honest expected set is all three, and the entry
# becomes a proof of *presence* - the same discrimination pointing the other
# way. It is `tier = "semantic"` because that is exactly what it now
# measures: run this file with `--skip-semantic-expectations` against a
# plugin whose server is missing and this entry reports `Skip`; run it with a
# server and `total_perimeter` has to be there, or the pass resolved nothing
# and nobody noticed.
#
# The structural half did not go away, it moved somewhere that needs no
# toolchain to check: `src/extractor/tests.rs`'s
# `a_receiver_call_produces_no_edge_and_one_open_site` asserts, on the parser
# alone, that `x.m()` still emits one open site and no edge.
expect = [
    "crates/alpha/src/shapes.rs:shapes::Square::scale",
    "crates/alpha/src/shapes.rs:shapes::total_perimeter_via_path",
    "crates/alpha/src/shapes.rs:shapes::total_perimeter",
]

# --- callers: a receiver call through a variable, and through a trait object ---
#
# GM-290's acceptance criterion, split into the two entries that make it a
# measurement rather than a formality. Both call sites are spelled `_.area()`
# and neither produces a structural edge; what separates them is the
# receiver's type, which is precisely what only a semantic tier knows.

[[callers]]
symbol = "shapes::<Square as Shape>::area"
tier = "semantic"
# Through a *variable* of a concrete type: `total`'s `square.area()`, where
# `square: &Square`. The honest answer is the impl's own method, not the
# trait's declaration - and this set is exact, so a pass that answered
# `Shape::area` here fails on the missing entry while the entry below fails
# on the extra one.
expect = ["crates/alpha/src/shapes.rs:shapes::total"]

[[callers]]
symbol = "shapes::Shape::area"
tier = "semantic"
# Through a *trait object* (`total_dyn`'s `&dyn Shape`) and through a
# *generic* (`gaps::measure`'s `<S: crate::prelude::Shape>`). In both, which
# `area` runs is a run-time question, so the honest answer is the trait's own
# declaration - and `shapes::total` must NOT appear here, which is what makes
# this entry and the one above a pair rather than two spellings of one claim.
expect = [
    "crates/alpha/src/shapes.rs:shapes::total_dyn",
    "crates/alpha/src/gaps.rs:gaps::measure",
]

[[callers]]
symbol = "shapes::Shape::label"
tier = "semantic"
# A *default* trait method, reached through a generic: `describe`'s
# `shape.label()`. No type implements it, so there is nothing else this could
# resolve to - which makes it the cheapest possible check that the pass reads
# a trait's own body and not only its implementors.
expect = ["crates/alpha/src/shapes.rs:shapes::describe"]

# --- references: a usage [[callers]] cannot reach at all -----------------------

[[references]]
symbol = "shapes::Shape"
file = "crates/alpha/src/shapes.rs"
# `Shape` is never called - it is a trait, not a callee - so this is the one
# category `[[callers]]` structurally cannot exercise for it at all.
# `SUPERTYPE_OF` (from `impl Shape for Square`/`impl Shape for Circle`) is a
# `find_references` edge kind `find_callers` does not share
# (`plugins/typescript/conformance/expect.toml`'s own `Greetable` case makes
# the same point); `describe`'s `<S: Shape>` bound is an ordinary same-file
# `REFERENCES` edge; `gaps::measure`'s `<S: crate::prelude::Shape>` bound
# names `Shape` through `alpha::prelude`'s re-export, a cross-file
# `REFERENCES` edge the same re-export walk `internals::published` above
# proves resolves through a prelude with no container node of its own
# (README: "names imported through a prelude still resolve").
#
# `prelude.rs:` (a File-kind row, no `qualifiedName`, per `expectations.rs`'s
# own doc on that shape) is the fourth: `pub use crate::shapes::{Shape,
# Square};` is itself a reference to `Shape`, and `prelude.rs` declares
# nothing of its own for the edge to start at - the same reason its own
# `containers` row is missing (README's "A module that declares nothing but
# `pub use` gets no container node"). Measured, not guessed: this row showed
# up as an unexpected extra the first time this entry was written without it.
#
# `shapes::total_dyn` joined this set in GM-290: its `&dyn Shape` parameter
# is an ordinary same-file type reference, structural like `describe`'s
# bound, and it is here in both arms for that reason - the *call* inside its
# body is the semantic half and is asserted separately, under
# `shapes::Shape::area`.
expect = [
    "crates/alpha/src/shapes.rs:shapes::Square",
    "crates/alpha/src/shapes.rs:shapes::Circle",
    "crates/alpha/src/shapes.rs:shapes::describe",
    "crates/alpha/src/shapes.rs:shapes::total_dyn",
    "crates/alpha/src/gaps.rs:gaps::measure",
    "crates/alpha/src/prelude.rs:",
]

# --- implementations: impl Trait for T, found by find_implementations ---------
# (GM-286's own acceptance case, kept here rather than duplicated)

[[implementations]]
symbol = "shapes::Shape"
# Both impls are same-file `SUPERTYPE_OF` edges from the type to the trait.
# `prelude.rs` re-exports `Shape`, which is a placeholder and must not appear
# here as a third implementor.
#
# Deliberately still structural after GM-290, and it is an assertion about
# the semantic tier too: the implementation sweep asks rust-analyzer about
# *every* trait, so it re-derives these same two impls and emits its own
# `SUPERTYPE_OF` edges for them. This set staying exactly two is what says
# those answers landed on the declarations the structural tier had already
# found, rather than on the `impl` blocks, on the prelude's re-export, or on
# nothing at all.
expect = ["crates/alpha/src/shapes.rs:shapes::Square", "crates/alpha/src/shapes.rs:shapes::Circle"]

# --- implementations: an impl in another crate of the workspace (GM-290) ------

[[implementations]]
symbol = "shapes::Loud"
tier = "semantic"
# The other acceptance criterion, and the one nothing structural can reach.
# `crates/beta/src/main.rs` implements `alpha`'s `Loud` for its own
# `Megaphone`, naming the trait through `use alpha::prelude::*` - a glob. The
# extractor resolves a bare *type* name that is neither declared nor imported
# by item to `Bound::Nothing`: no edge, and not even an open site (see
# `crates/alpha/src/prelude.rs`'s comment). So `Megaphone` is here only if
# `textDocument/implementation` on the trait found it, and `Circle` is here
# either way - which is what makes this one entry both the cross-crate claim
# and a guard against a sweep that drops the answers it used to get right.
expect = ["crates/alpha/src/shapes.rs:shapes::Circle", "crates/beta/src/main.rs:Megaphone"]

# --- implementations: blanket impls, and the module that is not one (GM-361) --

[[implementations]]
symbol = "blanket::Sink"
# Structural, deliberately - and it is an assertion about the semantic tier
# too, the same way `shapes::Shape`'s entry above is. Four implementors, and
# the set staying exactly four is what three separate failures each break:
#
#   - `blanket::<&'a mut S as Sink>` and `blanket::<Box as Sink>` are the two
#     blanket impls. Neither implements the trait for a declaration of this
#     project - one self type is not a path at all, the other names `Box` -
#     so neither has a type node to start its edge at, and both were simply
#     absent from the measured 12-row page on ripgrep. The `impl` block
#     itself carries the edge; its name is the prefix its own methods have.
#   - `blanket::inner::Inner` is declared inside an inline module, whose node
#     covers the `impl` header. `textDocument/implementation` answers with a
#     position in that header, and the smallest node containing it is the
#     module - so `blanket::inner` appearing here as a fifth implementor is
#     precisely the ripgrep row `sink::sinks @ crates/searcher/src/sink.rs:516`,
#     a `pub mod`, reported as implementing a trait.
#   - Every one of these is found by both tiers, which the index holds as two
#     edges with two `source` values. A page that listed edges rather than
#     implementors would repeat each of them; the kit compares sets, so that
#     duplication is invisible *here* and asserted in
#     `find_implementations`'s own unit tests instead.
expect = [
    "crates/alpha/src/blanket.rs:blanket::Direct",
    "crates/alpha/src/blanket.rs:blanket::<&'a mut S as Sink>",
    "crates/alpha/src/blanket.rs:blanket::<Box as Sink>",
    "crates/alpha/src/blanket.rs:blanket::inner::Inner",
]

# --- imports (get_dependencies, one hop, Outgoing): glob and container --------
# (GM-286's own acceptance case, kept here rather than duplicated)

[[imports]]
file = "crates/alpha/src/nested/mod.rs"
# Every `use` is an import, not only the glob - which is all the design doc's
# sketch listed, and which would make `get_dependencies` answer "nothing" for
# almost every Rust file. This file has one of each: `use crate::internals::*`
# (a glob) and `pub use deep::work` (a named re-export), and both link onto
# the container they read from. `container:` is how a row with no `filePath`
# renders, and a container node's `qualifiedName` is its key.
#
# It is anchored on *this* file rather than on `crates/beta/src/main.rs`,
# whose `use` items are more interesting, because the kit's session empties
# and restores the file with the most nodes - `crates/alpha/src/shapes.rs` -
# and core GCs a container whose last member goes, taking every `IMPORTS`
# edge pointing at it along (`graph::containers`: "importers' placeholders
# come back on their next reindex", which within one session never happens).
# An expectation over beta's imports would be asserting that deliberate core
# behaviour, not this plugin's.
expect = ["container:alpha::internals", "container:alpha::nested::deep"]

# --- definition ------------------------------------------------------------------

[[definition]]
symbol = "internals::crate_only"
file = "crates/alpha/src/internals.rs"
# Already unambiguous by `qualifiedName` alone - `file` is given anyway, the
# way `plugins/go/conformance/expect.toml`'s `Server.Addr` entry does,
# because `find_definition` only ever consults it once resolution turns out
# ambiguous; here it doesn't, and the entry still passes.
expect = ["crates/alpha/src/internals.rs:internals::crate_only"]

[[definition]]
symbol = "shapes::Square::perimeter"
# Unambiguous - no `file` needed to disambiguate.
expect = ["crates/alpha/src/shapes.rs:shapes::Square::perimeter"]

# --- definition: a bare name whose namesakes are spread across module depths
#     (GM-360, face A1) -------------------------------------------------------

[[definition]]
symbol = "Ruler"
file = "crates/alpha/src/shapes.rs"
# `Ruler` is declared twice: `alpha::shapes::Ruler`, whose qualifiedName is
# `shapes::Ruler`, and beta's crate-root `Ruler`, whose qualifiedName is the
# bare string. Before GM-360 the exact-qualifiedName rung matched beta's and
# only beta's, so this entry resolved - unflagged, `resolvedBy:
# qualifiedName` - to `crates/beta/src/main.rs:Ruler`, and `file` was never
# consulted because nothing looked ambiguous. That is ripgrep's
# `RegexMatcher` in two files: the declaration that wins is the one that
# happens to sit at a crate root, which is a fact about module depth and not
# about which type was meant.
#
# Now the bare name is an ambiguity over both, `file` picks this one, and the
# re-call by its `qualifiedName` (`shapes::Ruler`, which nothing else
# carries) takes the fast rung - so the entry fails against the pre-GM-360
# resolver on the wrong file and passes against this one.
expect = ["crates/alpha/src/shapes.rs:shapes::Ruler"]

# --- references: a *qualified* spelling two crates carry (GM-360, face A5) ---

[[references]]
symbol = "shapes::Gauge"
file = "crates/alpha/src/shapes.rs"
# A Rust qualifiedName is a module path within its crate, so `alpha::shapes`
# and `beta_crate::shapes` both spell their members `shapes::<name>` and
# `shapes::Gauge` names two declarations - ripgrep's `matcher::RegexMatcher`,
# which `crates/regex` and `crates/pcre2` both declare, in one workspace.
#
# Before GM-360 "the exact rung matched two rows" was treated as no match at
# all: resolution fell through to a bare-name lookup, which no qualified
# spelling can ever match, then to file names, then to semantic neighbours -
# so this entry failed with `no symbol named 'shapes::Gauge' found` rather
# than with a wrong set. It is `[[references]]` rather than `[[definition]]`
# deliberately: the disambiguated re-call for the four edge-walking tools is
# by the candidate's `id`, while `find_definition` has only `qualifiedName`
# to re-call with (expectations.rs, decision 3) - which for *this* face is the
# very string that is ambiguous, so the kit could not express it that way.
#
# The set is exact, and both crates' `Gauge` have a reference of their own, so
# a resolution landing on `crates/beta/src/shapes.rs:shapes::Gauge` fails
# twice over: one missing entry and one extra.
expect = ["crates/alpha/src/shapes.rs:shapes::calibrate"]
