# Bundled Rust plugin manifest. See docs/architecture/multi-language-plugins.md
# ("Interfaces > `plugin.toml` additions") for the schema this file follows,
# and core/src/daemon/manifest.rs (`read_manifest`) for the parser/validation
# rules it must satisfy. `language` must equal this directory's own name
# ("rust"), the same rule plugins/typescript's manifest documents.
#
# `command` is a dev-time path into the workspace's own `target/` (relative to
# this manifest's directory, `plugins/rust/`), not a packaged layout - this is
# a dev-checkout contract, not a release one, the same distinction
# plugins/go/plugin.toml documents for itself. `g-mesh plugins check
# plugins/rust --fixture <dir>` run from the repository root, after `cargo
# build -p g-mesh-plugin-rust`, is what this path is for today.
#
# GM-288 (distribution) does not reuse this file for a release archive: it
# generates a separate, installed manifest per target
# (scripts/bundle-rust-plugin.sh) whose command names that target's actual
# staged binary (`./g-mesh-plugin-rust` or `./g-mesh-plugin-rust.exe`), the
# same way plugins/typescript/plugin.toml's checked-in dev manifest is never
# the one an archive ships either (see scripts/bundle-plugin.sh).

[plugin]
language = "rust"
protocol_version = 2
plugin_version = "0.1.0"

[plugin.spawn]
command = "../../target/debug/g-mesh-plugin-rust"

[plugin.languages]
extensions = [".rs"]

[plugin.capabilities]
# No semantic tier yet (GM-285 is the project model; GM-286 is the
# tree-sitter extractor; rust-analyzer over the SDK's LspBridge is R4 in the
# design doc's Rollout table). `false` means core never sends `semanticPass`
# and never requires an answer to one.
semantic_pass = false
# Receiver calls (`x.m()`) are an open site with no structural answer - the
# design doc's Rust plugin section lists this as a documented structural gap,
# and it stays "unresolved" in both fields until the semantic release lands.
receiver_calls = "unresolved"
receiver_calls_structural = "unresolved"

[plugin.workspace]
# A workspace's own Cargo.toml, or a crate's: either can move crate roots or
# the module tree (members/exclude, [lib]/[[bin]] paths), so either must
# trigger the per-language reindex this plugin answers with a fresh
# `load_project` (see `ProjectContext::reload` / `Extractor::load_project`).
watch_files = ["Cargo.toml"]
# cargo's own build output - never source, and excluded from the walk the
# same way `node_modules`/`dist` are for TypeScript.
exclude_dirs = ["target"]
# A miss-path lookup's container-entry-point names: `lib.rs`/`main.rs` are a
# crate's own root file, `mod.rs` is a directory-module's.
entry_points = ["lib.rs", "main.rs", "mod.rs"]
