# Checks that run on every change, as against `release.yml`, which builds four
# targets and only fires on a tag, a manual dispatch, or a PR touching the
# pipeline itself. A lint that only runs during a release is a lint that tells
# you about a mistake after it shipped.

name: CI

on:
  push:
    branches:
      - main
      - "release-*"
      # Experiment branches too. "Is nextest affordable on the runners" was
      # answerable only on the runners - the local measurement said no and was
      # measuring the local machine - and without this line, answering it
      # meant landing the question on a release branch first (GM-253).
      - "experiment/*"
  pull_request:
  # So `release.yml` can gate on these jobs rather than duplicating them. A
  # release able to publish artifacts from a commit whose tests never ran is
  # the state this file exists to end, and the only way to be sure it is the
  # *same* checks is to call the same workflow.
  workflow_call:
  # GM-343. Until this existed there was no way to ask CI anything without
  # pushing a commit, and no way to ask it of one platform - so every Windows
  # question through the 3.6.0 and 3.7.0 batches cost a four-platform matrix,
  # three rows of which were already known green and stayed green throughout.
  # The default is still all four: this is an extra door, not a narrower one.
  workflow_dispatch:
    inputs:
      target:
        description: Which platform to test. `all` is the default and is what push and PR still do.
        type: choice
        default: all
        options:
          - all
          - x86_64-pc-windows-msvc
          - x86_64-unknown-linux-gnu
          - x86_64-apple-darwin
          - aarch64-apple-darwin
      # GM-346. Opt-in, default off, and reachable only through a dispatch -
      # see the step at the end of the `test` job for the exposure this opens
      # and the three specific questions it exists to answer.
      debug:
        description: "Hold the runner open with an interactive session if the tests fail. Off unless you say otherwise."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # GM-343. The matrix is computed rather than literal so that a dispatch can
  # narrow it, and so that narrowing it *fails* on a name we do not recognise
  # instead of quietly selecting nothing. A skipped matrix job renders almost
  # exactly like a passed one, which is the single real hazard here: a partial
  # run must never be mistaken later for a full one.
  matrix:
    name: Select the platforms to test
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      include: ${{ steps.select.outputs.include }}
      partial: ${{ steps.select.outputs.partial }}
    steps:
      - id: select
        shell: bash
        env:
          # Empty on push, pull_request and workflow_call - none of which take
          # inputs - so those all land on `all`, unchanged.
          TARGET: ${{ inputs.target || 'all' }}
        run: |
          set -euo pipefail
          # The same four rows release.yml builds. Kept in step with the
          # comment that used to sit on the literal matrix below.
          all='[
            {"target":"x86_64-apple-darwin","runner":"macos-15-intel"},
            {"target":"aarch64-apple-darwin","runner":"macos-15"},
            {"target":"x86_64-unknown-linux-gnu","runner":"ubuntu-22.04"},
            {"target":"x86_64-pc-windows-msvc","runner":"windows-2022"}
          ]'
          if [ "$TARGET" = all ]; then
            include="$(printf '%s' "$all" | jq -c .)"
            partial=false
          else
            include="$(printf '%s' "$all" | jq -c --arg t "$TARGET" '[.[] | select(.target == $t)]')"
            if [ "$(printf '%s' "$include" | jq 'length')" -ne 1 ]; then
              echo "::error::unknown target '$TARGET' - it matches none of the four rows this workflow knows" >&2
              exit 1
            fi
            partial=true
            {
              echo "## Partial run"
              echo
              echo "Only \`$TARGET\` was tested. **This run says nothing about the other three platforms.**"
              echo
              echo "It was started with \`workflow_dispatch\` and a \`target\` input; an ordinary push runs all four."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "include=$include" >> "$GITHUB_OUTPUT"
          echo "partial=$partial" >> "$GITHUB_OUTPUT"
          echo "testing: $include"

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-22.04
    env:
      SHELLCHECK_VERSION: v0.11.0
    steps:
      - uses: actions/checkout@v4

      # Pinned rather than taken from the runner image. ShellCheck adds checks
      # between releases, so an unpinned lint turns red on code nobody touched,
      # on a day nobody chose - and the first thing anyone does with a gate that
      # fails for reasons unrelated to their change is stop reading it. Bumping
      # this line is then a deliberate act with its own diff, which is where the
      # new findings can be triaged.
      - name: Install ShellCheck ${{ env.SHELLCHECK_VERSION }}
        run: |
          set -euo pipefail
          url="https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL "$url" | tar -xJ
          sudo install -m 0755 "shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      # Every script in the repo, found rather than listed: a list is a thing
      # to forget to update, and this repository went from one script to six in
      # two days.
      #
      # The dialect comes from each file's shebang, so `install.sh` is checked
      # as POSIX sh and the rest as bash without a flag saying so - which also
      # means a script whose shebang is wrong is caught by being checked as the
      # wrong shell.
      #
      # `-S style` is the lowest severity, so info- and style-level findings
      # fail too. Optional checks (`-o all`) are deliberately *not* enabled:
      # they add 515 findings here, 481 of them SC2250/SC2292 (require ${braces}
      # everywhere, prefer [[ ]] over [ ]) which is a whole-codebase rewrite for
      # no defect, and the 14 SC2310s are all deliberate predicates - `have
      # curl` in an `if` is asking whether curl exists, so `set -e` being
      # disabled inside the condition is the point rather than an accident.
      - name: Check every shell script
        run: |
          set -euo pipefail
          git ls-files '*.sh' | sed 's/^/  checking /'
          git ls-files -z '*.sh' | xargs -0 shellcheck -S style

  # install.sh's PATH editing, run in throwaway HOMEs against a fake
  # archive: no runner's real rc file is ever written (the script also
  # checks that the real ones did not change). Both OSes, because the
  # script runs under dash on Ubuntu and under macOS's sh and BSD tools.
  installer:
    name: install.sh PATH tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15]
    steps:
      - uses: actions/checkout@v4
      - name: Run scripts/test-install.sh
        run: bash scripts/test-install.sh

  test:
    name: tests (${{ matrix.target }})
    needs: matrix
    runs-on: ${{ matrix.runner }}
    env:
      RUST_VERSION: "1.97.1"
      NEXTEST_VERSION: "0.9.143"
    # The integration suite spawns real daemons, real shims and the real JS/TS
    # plugin, and a cold build compiles ONNX Runtime bindings, bundled SQLite
    # and Oniguruma from scratch. A deadlock guard, not a target.
    #
    # 45 rather than 90: a healthy run finishes in about five minutes on Linux
    # and macOS, so 90 only bought a longer wait for the same answer - Windows
    # hung for the whole budget and produced nothing usable. Fail sooner and
    # collect the log instead.
    timeout-minutes: 45
    strategy:
      # One platform failing must not hide whether the other three work -
      # which is the whole point here, since before this job the Windows port
      # was verified by compilation alone.
      fail-fast: false
      matrix:
        # The same four rows release.yml builds, deliberately: a target that
        # ships is a target whose tests ran. Kept in step by hand rather than
        # shared, because the two matrices carry different extra fields and a
        # merged one would be harder to read than two honest copies.
        #
        # Computed by the `matrix` job above rather than written here, so a
        # `workflow_dispatch` can narrow it (GM-343). The rows themselves are
        # unchanged and live in that job's script.
        include: ${{ fromJSON(needs.matrix.outputs.include) }}

    steps:
      - uses: actions/checkout@v7

      # GM-342. `scripts/install.ps1` is 616 lines that, until this step, had
      # never been executed OR parsed by anything: PowerShell is absent from
      # the machine it was written on, and no job invoked it. GM-208 caught
      # three real bugs in it by reading - `-match` on a multi-line array
      # returning elements rather than a boolean, `$IsWindows` not existing on
      # 5.1 and being fatal under StrictMode, and `Move-Item` refusing a
      # cross-volume move - which is the argument for that review and equally
      # the argument for this: they were found by attention, not by a process.
      #
      # First, because it is the cheapest possible failure and needs nothing
      # installed - the Windows runner already has PowerShell.
      #
      # PARSING IS NOT EXECUTION, and a green tick here must not be read as
      # "the installer works". It says nothing about Invoke-WebRequest,
      # Expand-Archive, Get-FileHash's output shape, the cross-volume
      # fallback, $LASTEXITCODE after a native binary, or the `throw`-under-
      # `iex` behaviour `Die` depends on. StrictMode is a *runtime* setting
      # and is not covered either. Running the thing end to end is GM-333.
      - name: install.ps1 parses under PowerShell
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = (Resolve-Path 'scripts/install.ps1').Path
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$null, [ref]$errors) | Out-Null
          if ($errors -and $errors.Count -gt 0) {
            Write-Host "::error file=scripts/install.ps1::install.ps1 does not parse - $($errors.Count) error(s) follow"
            foreach ($e in $errors) {
              Write-Host ("  line {0}, col {1}: {2}" -f $e.Extent.StartLineNumber, $e.Extent.StartColumnNumber, $e.Message)
            }
            exit 1
          }
          Write-Host "install.ps1 parses cleanly under PowerShell $($PSVersionTable.PSVersion)"

      # GM-342. This was informational for exactly one run, which is what the
      # decision was waiting on. Run 35464832833 reported 25 findings:
      #
      #   23  PSAvoidUsingWriteHost
      #    1  PSReviewUnusedParameter           line 354, 'Force'
      #    1  PSAvoidOverwritingBuiltInCmdlets  line 169, 'Write-Log'
      #
      # So the rule is a gate now, with one exclusion. `PSAvoidUsingWriteHost`
      # is 23 of the 25 and is simply wrong here: this is a CLI installer
      # whose entire job is to talk to the person running it, and its output
      # is deliberately not on the pipeline where a caller might capture it.
      # Excluded by name rather than by lowering the severity floor, so the
      # other two - and anything new - still fail the job.
      #
      # AND THEN IT WENT STRAIGHT BACK TO INFORMATIONAL, one run later, which
      # is the part worth reading. Making it a gate while two findings were
      # knowingly unfixed did exactly what it had to: run 35479078370 failed
      # at this step - step 4 of 18 - and **skipped the entire Windows suite
      # behind it**. A green Windows column, earned the same day, traded for a
      # gate on a condition we had already decided to defer. The gate was not
      # wrong; enabling it before the findings were dealt with was.
      #
      # So it stayed non-fatal until GM-347 settled `$Force` (see below for
      # where `Write-Log` went). Then `continue-on-error` came off and this
      # became a gate on a file that passes it. The general rule the mistake
      # illustrates: a check that can skip everything after it must be green
      # on the day it becomes required.
      #
      # `PSReviewUnusedParameter` earned the step its keep on the first run:
      # `Install-GMesh` declares `[switch]$Force` and never mentions it again,
      # calling `Test-InstallDir -Dir $InstallDir` without it, while
      # `Test-InstallDir` declares no `$Force` of its own and reads one
      # anyway. It resolves today only because PowerShell looks a variable up
      # through the caller's scope - so `-Force` works by dynamic scoping
      # rather than by being passed, and under `Set-StrictMode -Version
      # Latest` a call from any other scope would throw rather than default to
      # false. Filed rather than fixed blind: nothing has ever executed this
      # script (GM-333), so "it works today" is itself unverified.
      #
      # GM-347 settled `$Force` (Test-InstallDir now declares it and
      # Install-GMesh passes it; release.yml's GM-333 step executes both the
      # refusal and the replacement), so `continue-on-error` is off.
      #
      # GM-392 settled the other finding. `PSAvoidOverwritingBuiltInCmdlets`
      # flagged `Write-Log` from its "core-6.1.0-windows" compatibility
      # profile, not from anything that actually resolves at runtime: on a
      # real Windows runner (run 35989152753), under both pwsh 7.6.6 and
      # Windows PowerShell 5.1, `Get-Command Write-Log` resolved to nothing
      # but this script's own function, and no module ships one - the
      # collision the rule reports is absent, measured. But the rule has no
      # way to be told that short of a named exclusion, so the function was
      # renamed to `Write-Step` instead of carrying one: no exclusion for
      # `PSAvoidOverwritingBuiltInCmdlets` remains, and every rule -
      # `PSReviewUnusedParameter` included - fails the job.
      - name: install.ps1 lint
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -AllowClobber | Out-Null
          }
          $found = Invoke-ScriptAnalyzer -Path 'scripts/install.ps1' `
            -Severity Error,Warning `
            -ExcludeRule PSAvoidUsingWriteHost
          if (-not $found) {
            Write-Host 'PSScriptAnalyzer: nothing to report'
            return
          }
          $found | Format-Table -AutoSize RuleName, Severity, Line, Message | Out-String -Width 200 | Write-Host
          Write-Host "::error file=scripts/install.ps1::PSScriptAnalyzer reported $($found.Count) finding(s)"
          exit 1

      # Executes install.ps1's user-PATH editing against a throwaway user
      # variable, never the runner's real Path. The function is lifted out of
      # the script by its AST, since running the script would install. The
      # default path through Install-GMesh (and -NoModifyPath) runs end to end
      # in release.yml, which restores the real user Path afterwards.
      - name: install.ps1 user PATH editing
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = (Resolve-Path 'scripts/install.ps1').Path
          $ast = [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$null, [ref]$null)
          $fn = $ast.Find({
              param($n)
              $n -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $n.Name -eq 'Add-UserPathEntry'
            }, $true)
          if (-not $fn) { throw 'install.ps1 defines no Add-UserPathEntry' }
          . ([scriptblock]::Create($fn.Extent.Text))

          $name = 'G_MESH_CI_TEST_PATH'
          $dir = 'C:\g-mesh-ci\bin'
          $seed = '%USERPROFILE%\keep;C:\other'
          $key = [Microsoft.Win32.Registry]::CurrentUser.CreateSubKey('Environment')
          function Get-Raw { [string]$key.GetValue($name, '', [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames) }
          try {
            $key.SetValue($name, $seed, [Microsoft.Win32.RegistryValueKind]::ExpandString)

            if (-not (Add-UserPathEntry -Dir $dir -Name $name)) { throw 'first call reported the entry as already present' }
            $after = Get-Raw
            if ($after -ne "$seed;$dir") { throw "after the first call: expected '$seed;$dir', got '$after'" }
            if ($key.GetValueKind($name) -ne [Microsoft.Win32.RegistryValueKind]::ExpandString) {
              throw "the value was rewritten as $($key.GetValueKind($name)), not REG_EXPAND_SZ - %VAR% entries would stop expanding"
            }
            Write-Host "PASS: appended once, %USERPROFILE% left unexpanded, kind still REG_EXPAND_SZ"

            foreach ($again in @($dir, 'C:\G-MESH-CI\BIN\')) {
              if (Add-UserPathEntry -Dir $again -Name $name) { throw "a second call with '$again' wrote again" }
              $now = Get-Raw
              if ($now -ne $after) { throw "a second call with '$again' changed the value to '$now'" }
            }
            Write-Host "PASS: a second call (same dir, or differing only in case and a trailing backslash) changes nothing"

            $key.DeleteValue($name, $false)
            if (-not (Add-UserPathEntry -Dir $dir -Name $name)) { throw 'call on a missing variable did not write' }
            if ((Get-Raw) -ne $dir) { throw "on a missing variable: expected '$dir', got '$(Get-Raw)'" }
            Write-Host "PASS: a missing variable is created holding just the directory"
          } finally {
            $key.DeleteValue($name, $false)
            $key.Close()
          }

      # Pinned, not `stable`, and this run is why: clippy gained a lint between
      # this pin and the runner's then-current stable, and it turned the gate
      # red on code nobody had touched. Same reasoning as the ShellCheck pin -
      # a gate that fails for reasons unrelated to your change is a gate people
      # stop reading. Bumping this is a deliberate act with its own diff, which
      # is where the new findings get triaged.
      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
          rustup default "$RUST_VERSION"
          rustc -vV

      # rust-analyzer is a *test* dependency of `plugins/rust`, exactly the way
      # Go is one of `plugins/go`: since GM-290 the Rust plugin's semantic tier
      # drives a real rust-analyzer, and `plugins/rust/tests/conformance.rs` runs the
      # conformance kit against it rather than skipping when there is none.
      # `--profile minimal` above deliberately installs nothing beyond
      # rustc/cargo, so this line is what makes that suite runnable at all.
      #
      # `rust-analyzer --version` is the check, not `which rust-analyzer`:
      # `~/.cargo/bin/rust-analyzer` is a rustup *proxy* that exists for every
      # component rustup knows of, installed or not, and exits 1 with "unknown
      # binary in toolchain" when the component behind it is missing. The
      # plugin makes exactly this check at run time, for exactly this reason
      # (plugins/rust/src/semantic.rs).
      - name: Install rust-analyzer
        shell: bash
        run: |
          rustup component add rust-analyzer --toolchain "$RUST_VERSION"
          rust-analyzer --version

      # Node is only here for npm: the "Install pyright" step below runs
      # `npm ci` in plugins/python. Pinned to match release.yml for the same
      # reason it is pinned there.
      - uses: actions/setup-node@v6
        with:
          node-version: "22.x"

      # pyright is a *test* dependency of `plugins/python`, the same way
      # rust-analyzer is one of `plugins/rust` (GM-290's step above) - since
      # GM-299 the Python plugin's semantic tier drives a real
      # pyright-langserver, and its tests fail naming the missing binary
      # rather than skipping. Both jobs below need it: `cargo nextest run
      # --workspace` runs the crate's own suite, and the conformance loop
      # runs `plugins check plugins/python`, whose `session` check fails
      # outright when the engine cannot start.
      #
      # `npm ci` against plugins/python's committed package.json and
      # package-lock.json, through `scripts/test-deps.sh` so that a local setup
      # and CI install the same pyright - pinned in that package.json exactly
      # (GM-419: before, this step ran a bare `npm install pyright` and floated
      # on npm's latest).
      # plugins/python gitignores only node_modules/, and the install lives
      # there, beside the plugin, rather than inside
      # conformance/project/ - the kit copies the fixture and `copy_tree`
      # drops symlinks, so an npm `.bin` would not survive the copy, and
      # pyright's 5,205 bundled typeshed stubs would land in the walk as if
      # they were the project's own declarations. The cost of that choice is
      # this step: unlike rustup's machine-wide rust-analyzer, an npm install
      # is per-directory, so every runner and every fresh worktree needs its
      # own.
      #
      # `pyright --version` is the check, not `pyright-langserver --version`:
      # the language server has no such flag and exits 1 with "Connection
      # input stream is not set", so it cannot report its own health. The two
      # binaries are `"bin"` entries of one package, and the plugin probes
      # through the same CLI twin at run time for the same reason
      # (plugins/python/src/semantic.rs).
      #
      # Windows is deliberately included. The Python plugin ships on all four
      # triples (GM-298), so its semantic tier should be tested on all four -
      # and this is the first time the `.cmd` shim path npm creates there is
      # exercised for real rather than unit-tested (GM-299 lists it as
      # unverified). A Windows failure in this step is therefore information
      # about that path, not noise to route around.
      #
      # GM-390: the paragraph above says "unlike rustup's machine-wide
      # rust-analyzer" and stopped there, which is exactly the gap. The
      # conformance step below (`g-mesh plugins check`, and the same
      # `plugins/python/conformance/project` fixture `cargo nextest run`
      # exercises) runs pyright discovery with the *fixture's own copied
      # temp workspace* as the project root - the copy the rejected
      # alternative above would have polluted - which has no `node_modules`
      # of its own and is not this `working-directory`. So
      # `plugins/python/src/semantic.rs`'s two local candidates (`PATH`, and
      # the indexed project's own `node_modules/.bin`) can never reach what
      # this step just installed; only the third, network-dependent `npx`
      # candidate can, and on x86_64-pc-windows-msvc it lost that race,
      # `npx.cmd --version` not answering inside the 60s `PROBE_BUDGET`.
      # Every prior green Windows run of this step proves only that npx won
      # that same race before - never that this step's own install was
      # reachable at all. The `.cmd`-shim path GM-299 wanted verified for
      # real has therefore never actually been exercised by this job, on any
      # of the four triples.
      #
      # `echo ... >> "$GITHUB_PATH"` closes that gap the same way rustup
      # closes it for rust-analyzer: putting this install where the `PATH`
      # candidate - not the network one - can find it, for every later step
      # in this job, including the fixture-copied conformance run. This is
      # not a wider timeout or a retry around the 60s bound; it makes the
      # `PATH` candidate (tried first, and already the discovery order this
      # module's doc calls out as "a global install over a project-local one
      # over the network") actually win, so `npx` is no longer the only
      # candidate that can succeed here. What still needs a Windows CI run to
      # confirm: that `pyright.cmd` on `PATH` is actually found by
      # `Command::new` there the way this repository's own host-independent
      # unit tests for `script_spellings`/Decision 1b predict, since no
      # Windows host is available to run this on directly.
      - name: Install pyright
        working-directory: plugins/python
        shell: bash
        run: |
          ../../scripts/test-deps.sh pyright
          # `pwd` here is Git Bash's own MSYS-style path on Windows
          # (`/d/a/...`), which only that shell's process launcher
          # understands - a later, non-bash consumer of `PATH` (like the
          # `g-mesh` binary's own `CreateProcess` calls) needs the native
          # `D:\...` spelling `cygpath -w` gives, which Git for Windows
          # ships alongside this same `bash`.
          bin_dir="$(pwd)/node_modules/.bin"
          if [ "$RUNNER_OS" = "Windows" ]; then
            bin_dir="$(cygpath -w "$bin_dir")"
          fi
          echo "$bin_dir" >> "$GITHUB_PATH"

      # vtsls is a *test* dependency of `plugins/typescript`, installed the
      # way pyright is above (GM-325): `npm ci` against the committed
      # package.json and lock through `scripts/test-deps.sh`, with the `.bin`
      # directory put on `PATH` (native spelling on Windows, so the `.cmd`
      # shim is found by `Command::new`).
      - name: Install vtsls
        working-directory: plugins/typescript
        shell: bash
        run: |
          ../../scripts/test-deps.sh typescript
          bin_dir="$(pwd)/node_modules/.bin"
          if [ "$RUNNER_OS" = "Windows" ]; then
            bin_dir="$(cygpath -w "$bin_dir")"
          fi
          echo "$bin_dir" >> "$GITHUB_PATH"

      # The Go plugin is a bundled plugin with a real toolchain dependency,
      # a test dependency and not only a packaging one: `build.rs` runs `go build` to produce
      # `plugins/go/g-mesh-plugin-go`, and both the Rust integration tests
      # (`core/tests/plugin_check.rs`'s two `the_go_plugin_*` cases) and the
      # conformance step below spawn that binary for real. Without a Go
      # toolchain build.rs downgrades the failure to a warning, the run
      # continues, and those fail much later with "failed to spawn".
      #
      # Pinned to the minor version plugins/go/go.mod requires, for the same
      # reason Node is pinned: a gate that changes underneath you is a gate
      # people stop reading.
      #
      # `cache: true` since GM-281: the plugin now requires
      # golang.org/x/tools for its go/types tier, so without the module cache
      # every run re-downloads it (and every `go build` re-compiles it). It
      # was `false` while `plugins/go/go.mod` had zero requirements and there
      # was genuinely nothing to cache. The cache is keyed off
      # `plugins/go/go.sum`, which only exists for the same reason.
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache: true
          cache-dependency-path: plugins/go/go.sum

      # The Go plugin's own suite - the extractor's scope rules, container
      # keys, edge shapes and incremental diff. Runs before the slower Rust
      # steps, like the JS/TS one above, since it needs only the toolchain
      # just installed. `gofmt -l` prints the files that need formatting and
      # exits 0 either way, so the emptiness of its output is the assertion.
      - name: Go plugin tests (go vet, gofmt, go test)
        shell: bash
        working-directory: plugins/go
        run: |
          set -euo pipefail
          go vet ./...
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt would rewrite:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
          go test ./...

      # Pinned and fetched directly, like ShellCheck and for the same reason:
      # a gate that changes underneath you is a gate people stop reading.
      # Fetched rather than taken from a third-party action, so the only
      # things this pipeline trusts are the ones it names.
      #
      # `windows-tar` is nextest's own variant for extracting with tar rather
      # than a zip tool, which is what lets one bash step serve all four
      # runners.
      - name: Install cargo-nextest ${{ env.NEXTEST_VERSION }}
        shell: bash
        run: |
          set -euo pipefail
          case "${{ runner.os }}" in
            Linux)   slug=linux ;;
            macOS)   slug=mac ;;
            Windows) slug=windows-tar ;;
            *) echo "unrecognised runner OS: ${{ runner.os }}"; exit 1 ;;
          esac
          curl -fsSL "https://get.nexte.st/${NEXTEST_VERSION}/${slug}" | tar -xz -C "${HOME}/.cargo/bin"
          cargo nextest --version

      # State goes to G_MESH_HOME, which `<repo>/.cargo/config.toml` already
      # points at /tmp/g-mesh-test-home for everything cargo launches - so a
      # runner needs no setup for it, and on Windows it resolves against the
      # current drive. That file is what makes this job safe to run at all:
      # without it the suite would write into the runner's real home.
      #
      # The embedding-weights tests stay `#[ignore]`d. 154 MiB per runner, on
      # four runners, is not a cost worth paying for a check that a download
      # works.
      # A detached daemon has no console, so this file is the only account of
      # what one was doing. Cheap to always collect and only printed on
      # failure - and it is the step the harness's own timeout message asks
      # for. Windows' first integration binary times out waiting for a walk
      # that a 300s budget did not help, so something is not starting rather
      # than running slowly (GM-246).
      # Windows only. `.cargo/config.toml` sets `/tmp/g-mesh-test-home`, which
      # is not an absolute path there but a *drive-relative* one: it resolves
      # against whatever drive the process is on. The test binary runs from the
      # D: checkout and the detached daemon it spawns need not, so the two got
      # different state roots - the daemon indexed into its own while the test
      # waited forever on an index.db that was never going to appear (GM-246).
      # `force = false` in that file means this explicit value wins.
      #
      # A separate step rather than an `env:` expression, because the other
      # platforms must have this variable *absent*, not empty: cargo's
      # `force = false` treats an empty-but-present variable as already set and
      # would leave the state root pointing at nothing.
      #
      # Scoped to one platform after applying it to all four moved the macOS
      # state root onto the work volume and turned `cold_start_grace_wait` red
      # on both macOS runners, which had been green one commit earlier.
      - name: Point Windows at an absolute state root
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        run: echo "G_MESH_HOME=${{ runner.temp }}/g-mesh-test-home" >> "$GITHUB_ENV"

      # Every section step and the daemon log step below read this path.
      # `G_MESH_TRACE_CALLS` stays unset: its two lines per tool call crowd the
      # daemon activity out of the log's last 200 lines.
      - name: Daemon log path for the test sections
        shell: bash
        run: echo "G_MESH_DAEMON_LOG=${{ runner.temp }}/g-mesh-daemon.log" >> "$GITHUB_ENV"

      # The test sections, one step each, on one build. Why steps and not a
      # matrix, and why `!cancelled()` between them:
      # docs/adr/0030-test-sections.md.
      #
      # Invariants:
      # - This step builds every test binary the sections run, and with it
      #   the `g-mesh`, plugin and SDK binaries the tests spawn; the
      #   `plugins check` step reuses that `g-mesh` build.
      # - Each step timeout bounds one part (the build, or one section) and is
      #   a backstop: nextest itself terminates a hung test at 210s and names
      #   it (`.config/nextest.toml`), while a step killed by its timeout is
      #   reported as cancelled and prints nothing.
      # - `--profile ci` only adds the JUnit file; how tests run is the
      #   `default` profile's.
      - name: Build the test binaries
        id: build
        timeout-minutes: 25
        shell: bash
        run: cargo nextest run --workspace --profile ci --no-run

      # The partition does not depend on the platform, so one row checks it.
      - name: Test sections cover the whole suite
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        timeout-minutes: 5
        shell: bash
        run: scripts/test-sections.sh check

      - name: "tests: core-it"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 20
        shell: bash
        run: scripts/test-sections.sh run --profile ci core-it

      - name: "tests: core-mcp"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 10
        shell: bash
        run: scripts/test-sections.sh run --profile ci core-mcp

      - name: "tests: core-daemon"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 10
        shell: bash
        run: scripts/test-sections.sh run --profile ci core-daemon

      - name: "tests: core-cli"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 10
        shell: bash
        run: scripts/test-sections.sh run --profile ci core-cli

      - name: "tests: core-graph"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 10
        shell: bash
        run: scripts/test-sections.sh run --profile ci core-graph

      - name: "tests: core-rest"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 10
        shell: bash
        run: scripts/test-sections.sh run --profile ci core-rest

      - name: "tests: sdk"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 10
        shell: bash
        run: scripts/test-sections.sh run --profile ci sdk

      - name: "tests: plugin-typescript"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 10
        shell: bash
        run: scripts/test-sections.sh run --profile ci plugin-typescript

      - name: "tests: plugin-rust"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 10
        shell: bash
        run: scripts/test-sections.sh run --profile ci plugin-rust

      - name: "tests: plugin-python"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 10
        shell: bash
        run: scripts/test-sections.sh run --profile ci plugin-python

      - name: "tests: wire"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 10
        shell: bash
        run: scripts/test-sections.sh run --profile ci wire

      # `always()` because the interesting case is the failing one, and a
      # section step has already failed the job by the time this runs.
      - name: Test results, by binary
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          shopt -s nullglob
          junit=(target/nextest/ci/junit-*.xml)
          if [ ${#junit[@]} -eq 0 ]; then
            echo "No JUnit under \`target/nextest/ci/\` - nextest did not get far enough to write one." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # `python3` on the Unix images, `python` on windows-2022.
          py="$(command -v python3 || command -v python)"
          "$py" scripts/ci-junit-summary.py "${junit[@]}" "${{ matrix.target }}" >> "$GITHUB_STEP_SUMMARY"

      # Kept for every run, not only failing ones: a run-to-run diff
      # (`scripts/ci-diff-runs.sh`) needs both sides.
      - name: Keep the JUnit results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-${{ matrix.target }}
          path: target/nextest/ci/junit-*.xml
          if-no-files-found: warn
          retention-days: 30

      # GM-277's conformance kit, per bundled plugin that has one -
      # `plugins/*/conformance/{project,expect.toml}` - on the same four
      # runners the rest of this job already covers, so a plugin (or a core
      # change to the linker/queries `--expect` reads) that regresses on one
      # OS and not another is caught here instead of only in a bug report.
      #
      # `cargo run`, not a resolved `target/debug/g-mesh(.exe)` path: the
      # `Build the test binaries` step above already built the `g-mesh` binary
      # (every test that uses `CARGO_BIN_EXE_g-mesh` forces cargo to build
      # it first), and `cargo run` re-uses that same debug-profile artifact
      # after a fast freshness check rather than rebuilding it - which is
      # simpler and more portable across the four runners than hand-rolling
      # the `.exe` suffix and target layout ourselves for one extra step.
      - name: g-mesh plugins check (--expect, every plugin with a conformance fixture)
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for dir in plugins/*/; do
            plugin="${dir%/}"
            fixture="$plugin/conformance/project"
            expect="$plugin/conformance/expect.toml"
            if [ -d "$fixture" ] && [ -f "$expect" ]; then
              found=1
              echo "=== g-mesh plugins check $plugin ==="
              cargo run --manifest-path core/Cargo.toml --bin g-mesh -- \
                plugins check "$plugin" --fixture "$fixture" --expect "$expect"
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "no plugins/*/conformance fixture found - this step has nothing to check" >&2
            exit 1
          fi

      # `always()`, not `failure()`: a job killed by `timeout-minutes` is
      # reported as *cancelled*, and `failure()` does not fire for it - so the
      # one run where the log mattered most produced none. Windows hung for the
      # full 90 minutes and this step was skipped (GM-246).
      - name: What the daemons were doing
        if: always()
        shell: bash
        run: |
          log="${{ runner.temp }}/g-mesh-daemon.log"
          if [ -f "$log" ]; then
            echo "=== $(wc -l < "$log") lines ==="
            tail -200 "$log"
          else
            echo "no daemon log at $log - nothing ever wrote one, which is itself the answer"
          fi

  # GM-282's other half of "the Go toolchain is available on all CI
  # runners" (the `test` job above, all four platforms): one job proves the
  # opposite - a `go` binary off `PATH` - and asserts the *reduced*
  # expectation set `plugins/go/conformance/expect.toml`'s `tier =
  # "semantic"` entries carve out (`expectations.rs`'s own module doc,
  # decision 6). One OS is enough: this is a property of the plugin's own
  # `exec.LookPath("go")` fallback, not of the runner - `plugins/go/
  # semantic_test.go`'s `TestSemanticPassWithoutAToolchainAnswersAnEmptyDiff`
  # already proved that at the unit level, and this job is its CI-facing,
  # end-to-end counterpart.
  #
  # GM-318: "a `go` binary off PATH" used to be built by filtering PATH.
  # That premise broke once this image started shipping a second `go` from
  # a SYSTEM directory (GM-312), because a system directory cannot be
  # filtered out of PATH without taking unrelated tools with it - see the
  # "Delete every go binary" step below for the failed directory-filtering
  # approach and why deleting the file instead is what fixed it.
      # GM-346. A shell on the platform, for the questions that reading could
      # not settle. Three are waiting for it right now, each one closed by
      # inference rather than by observation:
      #
      #   * GM-337 - which internal of node rejects a `\\?\` plugin path was
      #     never established. `path.win32.resolve` normalises such a string
      #     correctly on Node 20, so the mechanism sits past argv
      #     normalisation, in module resolution or realpath. The fix works;
      #     the reason is unknown.
      #   * GM-339 - whether `current_exe()` follows a rename on Windows was
      #     reasoned from `GetModuleFileNameW` reading the loader's record,
      #     not observed. It happened to be right, and the identical reasoning
      #     about Linux happened to be wrong, which is the argument.
      #   * GM-341 - what npm actually writes into `node_modules/.bin` there
      #     (`.cmd` only? plus an extensionless shim? a `.ps1`?) is taken from
      #     documentation, and the whole fix rests on it.
      #
      # WHAT THIS OPENS, stated because a debug door deserves it: an
      # interactive shell on a machine holding this repository's checkout and
      # this job's `GITHUB_TOKEN`. It creates no permission the job did not
      # already have - `permissions: contents: read` still applies - but it
      # puts those behind a prompt somebody types at, which is a different
      # exposure from a script that runs and exits. Hence every guard below:
      #
      #   * `github.event_name == 'workflow_dispatch'` as well as the input,
      #     so no push or pull_request can reach it even if the input ever
      #     acquires a truthy default by accident.
      #   * `failure()`, so a green run never holds a runner.
      #   * `limit-access-to-actor`, so the connection string in the log is
      #     not an invitation - only the account that dispatched the run can
      #     attach.
      #   * `timeout-minutes`, so a session nobody attaches to cannot hold a
      #     runner until the job's own 45-minute budget expires. A forgotten
      #     dispatch costs 20 minutes, not the whole job.
      #
      # Pinned to a commit rather than a tag, unlike the `actions/*` above:
      # those are GitHub's own and pinned to a major by this file's
      # convention, while this is a third party and a moving tag is a
      # third party that can change what runs here without a diff.
      # 35b54af is v3.24 (2026-05-29).
      - name: Interactive session (only on a dispatch that asked for one)
        if: ${{ failure() && github.event_name == 'workflow_dispatch' && inputs.debug }}
        uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113
        timeout-minutes: 20
        with:
          limit-access-to-actor: true

  go-plugin-without-toolchain:
    name: Go plugin conformance (no toolchain on PATH)
    runs-on: ubuntu-22.04
    env:
      RUST_VERSION: "1.97.1"
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
          rustup default "$RUST_VERSION"
          rustc -vV

      # Needed only to BUILD plugins/go/g-mesh-plugin-go (core/build.rs's own
      # `go build`, downgraded to a `cargo:warning` rather than a failure
      # without a toolchain - see that file). The staged binary itself needs
      # no toolchain to run; only its semantic tier does, by shelling out to
      # `go list`/`go env` through golang.org/x/tools/go/packages, which is
      # exactly what this job deletes below, after the build. Without this
      # step the binary is never produced at all, and the check step would
      # fail on "failed to spawn" - a real failure, but not the one this job
      # exists to prove.
      #
      # `cache: true`, matching the `test` job's own note: GM-281 gave
      # plugins/go/go.mod its first real dependency (golang.org/x/tools),
      # keyed off plugins/go/go.sum.
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache: true
          cache-dependency-path: plugins/go/go.sum

      # Builds `g-mesh` and, as a side effect of core/build.rs, the Go
      # plugin binary - with `go` still on PATH, unlike the steps below.
      - name: Build g-mesh and the Go plugin
        run: cargo build --manifest-path core/Cargo.toml --bin g-mesh

      # Used to filter every directory that holds a `go` out of PATH rather
      # than deleting a hardcoded one, since which directory
      # `actions/setup-go` prepended is this step's own business, not
      # something to hardcode and have drift - and, verified rather than
      # assumed (this repo's own rule), refused outright if `go` still
      # resolved after filtering.
      #
      # GM-312 made that loop handle more than one `go` (this image carries
      # a second one, from `actions/setup-go`'s hostedtoolcache directory and
      # an OS package), and found the approach's ceiling doing it: the
      # second `go` lives at /usr/bin/go, a SYSTEM directory, and removing a
      # PATH entry removes everything else in it too - dropping /usr/bin to
      # hide `go` would take `git`, `curl` and most of the rest of this job
      # with it, and the resulting failure would name none of that. The
      # refusal ("go is installed in the system directory ... this job
      # cannot hide it without removing unrelated tools") was correct: on
      # THIS image, with THAT mechanism, the job's premise no longer held.
      #
      # GM-318: the mechanism, not the premise, was the problem. Filtering
      # PATH only ever has directory-sized moves available, and a system
      # directory mixes the one binary this job needs gone with others it
      # cannot touch. Deleting the FILE - the one binary literally named
      # `go`, wherever `command -v` finds it - has no such mixing: removing
      # `/usr/bin/go` never removes `/usr/bin/git`, so there is no longer a
      # directory this job needs to refuse, and the whole case-statement
      # guard for "is this a system directory" goes away with it. The
      # runner is a disposable VM this job (and this workflow) never
      # returns to, so deleting a system package's binary here is scoped to
      # this one job and costs nothing beyond it.
      #
      # Two other fixes were considered and set aside:
      #   - A minimal, hand-built PATH (only the directories the check step
      #     below actually needs) sounds smaller, and was tried: that step's
      #     `cargo run` reads `G_MESH_HOME` from `.cargo/config.toml`'s
      #     `[env]` table, which cargo injects itself, so bypassing `cargo
      #     run` for a direct `target/debug/g-mesh` call to dodge PATH
      #     entirely would silently lose that. Keeping `cargo run` on a
      #     PATH trimmed to "just enough" instead leaves it re-running its
      #     own freshness check on every invocation, and a rebuild spuriously
      #     triggered with no linker on that trimmed PATH fails as "linker
      #     `cc` not found" (reproduced locally against a throwaway crate) -
      #     a confusing failure that proves nothing about Go, and a worse
      #     diagnosis than what this job already gives today.
      #   - A container image with no Go installed is closest to a real
      #     end-user machine and immune to this exact image drift, but
      #     trades a five-line shell loop for an image pin, a workspace
      #     mount and a Rust-toolchain-version match to maintain against
      #     THIS job's `RUST_VERSION` - overhead this job does not need
      #     when deleting the file is this direct.
      # (A third option, shadowing `go` with a binary that exists but
      # fails, was rejected without trying it: LookPath would still
      # succeed, only the later exec would fail, which is a DIFFERENT
      # scenario from no toolchain at all and would not test what this job
      # exists to prove.)
      #
      # `sudo`: /usr/bin/go is root-owned on this image (the hostedtoolcache
      # copy is not, but sudo is harmless there too, and GitHub-hosted
      # Ubuntu runners grant it passwordlessly). `hash -r` after each
      # removal clears bash's remembered command locations - not observed
      # to be load-bearing on this runner's bash (`command -v` re-checked
      # correctly without it in local testing), but cheap enough to keep as
      # a defense this job does not want to have to rediscover it needs.
      # The existence check after `rm` is what makes a permission failure
      # loud instead of silent: `rm -f` does not error on a file that was
      # never there, but `set -e` still stops the step if deletion was
      # refused, and the explicit `[ -e ]` catches a `rm` that exits 0
      # without actually removing anything. The iteration cap is a sanity
      # backstop, not an expected path - normal images have shipped one or
      # two `go` binaries, not twenty.
      # Safe here and nowhere else: a GitHub-hosted runner is a throwaway VM
      # that is destroyed when the job ends, so `sudo rm -f` on a system
      # binary costs nothing and leaves nothing behind. Do NOT lift this loop
      # onto a real machine to try something out - GM-318 learned that the
      # hard way when an experiment with the same shape let PATH fall through
      # to the real system and deleted a developer's own Go install. If you
      # need to exercise this logic locally, build the PATH from nothing
      # (`env -i PATH=<only fake dirs>`) rather than subtracting from the one
      # you inherited: a subtraction that misses leaves the real system in
      # the blast radius.
      - name: Delete every go binary reachable on PATH
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while go_path="$(command -v go 2>/dev/null)"; do
            count=$((count + 1))
            if [ "$count" -gt 20 ]; then
              echo "still finding a go binary after removing $count of them - something is replacing it \
                    faster than this loop can delete it, or command -v is not seeing the deletions" >&2
              exit 1
            fi
            echo "deleting $go_path"
            sudo rm -f "$go_path"
            hash -r
            if [ -e "$go_path" ]; then
              echo "$go_path still exists after rm - this job cannot prove its premise without deleting it" >&2
              exit 1
            fi
          done
          echo "removed $count go binaries; none resolve on PATH any more"

      # GM-384: this step now asserts a FAILING run, and that is deliberate,
      # not a regression the flag below used to paper over.
      #
      # Before GM-384, the Go plugin's whole-project `semanticPass` answered
      # an empty diff with no `incomplete` field (wire/src/lib.rs's
      # `FileChangeResponse::incomplete`), so a Go-only index built with no
      # toolchain on PATH looked exactly like one whose semantic tier had
      # just finished: `language_state.semanticPassAt` got set,
      # `mcp::provenance` had nothing to warn about, and `mcp::instructions`
      # stopped listing Go's receiver-call gap - both readers misled by one
      # missing field. `semantic.go`'s own doc comment said as much
      # ("`language_state.semanticPassAt` is never set for Go"), and it was
      # false.
      #
      # Now the plugin reports `incomplete: true`, and core's
      # `watcher::apply::apply_semantic_pass` treats an *incomplete
      # whole-project* pass as a failed round trip - correctly: nothing
      # downstream should be able to certify a semantic pass that never ran.
      # The conformance session (`core/src/cli/plugin_check/session.rs`)
      # aborts at that step, before expectations are ever reached, so
      # `--skip-semantic-expectations` (which only changes how `tier =
      # "semantic"` entries are scored *once expectations run*) can no
      # longer rescue this run into a clean `Pass` - it is passed below only
      # for parity with how a real daemon run gates on the same capability,
      # not because it changes this step's outcome any more. See
      # `core/tests/plugin_check.rs`'s
      # `the_go_plugin_without_a_toolchain_fails_the_session_check_with_an_incomplete_whole_project_pass`,
      # which pins exactly this and proves the flag makes no difference here.
      #
      # So the assertion below is not "did the command succeed" (it must
      # not) but "did it fail for *this* reason" - an unrelated regression
      # (a crash, a hang, a shape violation) must not be able to hide behind
      # an exit code this step already expects to be nonzero. No PATH
      # override on this step, unlike before GM-318: the step above deleted
      # every `go` binary this job could find, from the job's real,
      # unmodified PATH, so there is nothing left to override - and this
      # step still checks that directly below rather than trusting the step
      # above, in case a later change reintroduces one.
      - name: g-mesh plugins check plugins/go (no Go on PATH answers incomplete and fails the session check)
        shell: bash
        run: |
          set -uo pipefail
          if command -v go >/dev/null 2>&1; then
            echo "go must not be resolvable in this step - deleting it did not take" >&2
            exit 1
          fi
          # The capture sits in an `if` CONDITION rather than standing alone,
          # and that placement is the whole point. `shell: bash` expands to
          # `bash --noprofile --norc -e -o pipefail {0}` - the `-e` is on the
          # invocation line, where the script's own `set -uo pipefail` cannot
          # reach it. A bare `report="$(...)"` therefore kills the step the
          # instant the check exits non-zero, which is EVERY run of this job,
          # taking `status=$?` and both assertions below with it. That is how
          # GM-384's rewrite reached main having never once executed its own
          # assertion (GM-388). A command in an `if` condition is exempt from
          # errexit by the shell's own rules, so no `set +e` and no custom
          # shell line is needed; the structure states the expectation instead
          # of working around the flag.
          if report="$(cargo run --manifest-path core/Cargo.toml --bin g-mesh -- \
            plugins check plugins/go --fixture plugins/go/conformance/project \
            --expect plugins/go/conformance/expect.toml --skip-semantic-expectations)"; then
            echo "$report"
            echo "expected this run to fail - a whole-project semantic pass with no toolchain is not \
                  certifiable - but it exited 0; the Go plugin may have stopped reporting incomplete=true" >&2
            exit 1
          fi
          echo "$report"
          if ! grep -q "incomplete whole-project semantic pass" <<<"$report"; then
            echo "the run failed, but not for the reason this job exists to prove - see the report above" >&2
            exit 1
          fi

  lint:
    name: cargo clippy
    runs-on: ubuntu-22.04
    env:
      RUST_VERSION: "1.97.1"
    # One platform, unlike `test`: clippy's findings here are about the code,
    # not about the target. The cfg'd platform modules are the exception, and
    # `ipc/windows.rs` is small enough that the Windows `test` job compiling it
    # is the check that matters for it.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # Pinned, not `stable`, and this run is why: clippy gained a lint between
      # this pin and the runner's then-current stable, and it turned the gate
      # red on code nobody had touched. Same reasoning as the ShellCheck pin -
      # a gate that fails for reasons unrelated to your change is a gate people
      # stop reading. Bumping this is a deliberate act with its own diff, which
      # is where the new findings get triaged.
      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
          rustup default "$RUST_VERSION"
          rustup component add clippy rustfmt
          cargo clippy --version
          cargo fmt --version

      # Before clippy, because it is the cheaper failure and the one with an
      # obvious fix: `cargo fmt` and push. The style it enforces is recorded in
      # rustfmt.toml, recovered by measurement rather than picked - see that
      # file. A formatter written down but not checked drifts straight back,
      # which is the state this repository was in until GM-241.
      # Both steps call scripts/check.sh rather than spelling the command
      # here, so a contributor running it locally runs exactly this (GM-368).
      # They differed before: six tasks ran `clippy -p g-mesh --lib`, which
      # does not compile test targets, and four lints in a `#[cfg(test)]`
      # module reached this job unseen. The steps stay separate so `fmt` -
      # the cheaper failure, with the obvious remedy - is reported first.
      - name: cargo fmt --check
        # `--all`: every workspace member, not core alone (GM-284).
        run: scripts/check.sh fmt

      # `-D warnings`, because a lint that reports and passes is a lint nobody
      # reads. The tree was brought to zero findings before this was turned on
      # (44 of them: 36 doc-list continuations, a transmute without
      # annotations, a seven-field tuple type, and one assertion that was
      # constant-true and therefore checking nothing).
      - name: cargo clippy
        run: scripts/check.sh clippy
