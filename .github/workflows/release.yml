# Builds `g-mesh` for every target triple REQUIREMENTS.md implies, from a
# single trigger, uploads one named archive per triple, and - on a version tag
# - publishes them as a GitHub Release.
#
# Every matrix leg builds its archive and runs release-smoke.sh on it. The
# Windows leg also installs the archive with install.ps1; the installed
# g-mesh.exe then reindexes a fixture with the checkout's plugins\ hidden
# and answers one MCP call (scripts/mcp-smoke.py). The install-latest job
# (manual dispatch, and on a tag run after publish) installs the latest
# published release with the README one-liner under pwsh and Windows
# PowerShell 5.1; on a tag run it also asserts that release is the tag. The asset names the
# publish job uploads come from `build-targets.sh --asset-names`, and
# `scripts/prepare-release-assets.sh` fails the release if the files on disk
# disagree with it.
#
# GM-613 (written offline, proven by its own workflow_dispatch rehearsal):
# x86_64 macOS is cross-built on the arm64 `macos-15` runner and smoke-tested
# there under Rosetta, and the `tests` job is skipped when ci.yml already
# passed a full run on the same code (`ci-gate` below). The x86_64 *tests*
# still run on the Intel runner, in ci.yml.
#
# ---------------------------------------------------------------------------
# WHAT THESE ARTIFACTS ARE
#
# Since task #65 each archive carries a working install: the core binary and
# the JS/TS plugin in `plugins/typescript/`. Since GM-326 that plugin is a
# plain cargo binary built in the same workspace as core for the same target
# (`scripts/bundle-plugin.sh`); it was a Node single-executable application
# until GM-324/GM-351 ported it to Rust, which is why no job here sets up
# Node any more. Since GM-283 the archive also carries the Go plugin, one
# static `CGO_ENABLED=0` binary cross-compiled for the target in
# `plugins/go/`, and since GM-288 the Rust plugin, a plain cargo binary built
# in the same workspace as core for the same target, in `plugins/rust/` - see
# `scripts/bundle-rust-plugin.sh` for why that needs no extra toolchain setup
# here (it is built by the Rust toolchain this file already installs for
# core). Since GM-298 the same is true of the Python plugin, in `plugins/python/` -
# it is a tree-sitter structural extractor written in Rust, not a program run
# by a Python interpreter, so it needs no Python on this runner and no Python
# on the machine that later runs it either; see
# `scripts/bundle-python-plugin.sh` for the same reasoning
# `scripts/bundle-rust-plugin.sh` already gives. Every plugin directory lives
# where `daemon::manifest::bundled_roots` looks beside the executable.
# `scripts/install.sh` (#66) fetches exactly these assets, by the URLs the
# section below fixes, and verifies the `.sha256` beside each archive before
# it unpacks anything.
#
# ---------------------------------------------------------------------------
# HOW TO CUT A RELEASE
#
# 1. Make sure `core/Cargo.toml`'s version is the version you are releasing.
#    It, not the tag, is what the artifacts are named after; the tag is checked
#    against it in the first step of every build job so a mismatch costs a
#    minute instead of four 90-minute builds. Since GM-288, `wire/Cargo.toml`,
#    `plugins/sdk/Cargo.toml` and `plugins/rust/Cargo.toml` must say the same
#    version too, since GM-298 so must `plugins/python/Cargo.toml`, and since
#    GM-351 `plugins/typescript/Cargo.toml` (and its plugin.toml's
#    `plugin_version`, which the shipped manifest carries unchanged), and
#    since GM-514 `walk/Cargo.toml` -
#    `scripts/cut-release.sh` refuses if any of them disagree (see that
#    script's own header), which is the easiest way to check this by hand as
#    well.
# 2. Tag the commit and push the tag:  `git tag v2.7.0 && git push origin v2.7.0`
#    The repository has no tags at all today, so this is a deliberate, manual,
#    human act - nothing in this pipeline creates one.
# 3. Four builds run (~1h). If any one of them fails, nothing is published:
#    the publish job `needs: build`, and a three-platform Release is worse than
#    none, because an installer cannot tell "not built yet" from "your platform
#    is not supported".
# 4. A DRAFT Release is created with 41 assets (per target: the main archive,
#    one plugin asset per bundled language, and a `.sha256` for each; plus
#    SHA256SUMS). Once the uploaded asset count matches the list, the job
#    publishes it and marks it latest. A Release is public only after every
#    asset is uploaded, because `/releases/latest/download/...` URLs and the
#    installers' `releases/latest` lookup see a published Release at once. If
#    the job fails part-way the Release stays a draft: fix the cause and
#    re-run the job, which publishes a still-draft Release. Notes can be
#    edited after publishing.
#
# THE ASSETS, AND THE CONTRACT WITH #66
#
#   g-mesh-v<version>-<target>.tar.gz          (.zip for the windows target)
#   g-mesh-v<version>-<target>.tar.gz.sha256   one per archive
#   g-mesh-plugin-<language>-v<version>-<target>.tar.gz
#                                              one per bundled language and
#                                              target, .tar.gz on every target:
#                                              the staged plugins/<language>/
#                                              directory (see build-targets.sh)
#   g-mesh-plugin-<language>-v<version>-<target>.tar.gz.sha256
#   SHA256SUMS                                 every archive above (20), for
#                                              `sha256sum -c`
#
# `build-targets.sh --asset-names <target>` lists the main archive and its
# `.sha256` first; two steps below index those two lines by position.
#
# Both checksum forms are published on purpose: the per-asset file is one small
# extra fetch for an installer that already knows which single archive it
# wants, and SHA256SUMS is the form a human verifying a download by hand
# expects. The download URL an installer builds is
#
#   https://github.com/<owner>/<repo>/releases/download/v<version>/<asset>
#
# and only the `<version>` and `<target>` parts vary - which is why the names
# are generated, not typed.
#
# Every job needs Go, for the one bundled plugin that is not a cargo
# workspace member (`plugins/go`, GM-283) - `setup-go` only, no per-target
# runner requirement, since that plugin cross-compiles instead of embedding a
# runtime (see scripts/bundle-go-plugin.sh).
# ---------------------------------------------------------------------------
#
# WHY A MATRIX ON NATIVE RUNNERS, NOT TRUE CROSS-COMPILATION
#
# Four dependencies compile C/C++ (or asm) for the target: `rusqlite` with
# `bundled` (SQLite), `tokenizers` with `onig` (the Oniguruma regex library),
# `sqlite-vec`, and `ring`, which arrives transitively through `ureq`'s rustls
# TLS. On top of that, `ort` links ONNX Runtime statically, which
# drags in a C++ standard library that differs per platform (libc++ on macOS,
# libstdc++ on Linux, the MSVC CRT on Windows). Producing all four triples from
# one host would mean supplying four cross toolchains and four sysroots and
# getting every C++ stdlib link right - `cross`/zig territory, and the MSVC
# target is not honestly reachable from a non-Windows host at all. A runner per
# platform makes each build a plain native `cargo build` with the toolchain the
# image already has. The cost is four machines instead of one; the benefit is
# that nothing here depends on a cross-toolchain setup that breaks silently.
#
# This is measured, not assumed: `cargo check --target
# x86_64-unknown-linux-gnu` on a macOS host dies at the *first* crate that
# compiles C - `ring`, long before SQLite or Oniguruma get a turn - with
# `failed to find tool "x86_64-linux-gnu-gcc"`. Making that work means
# installing and maintaining a Linux cross toolchain (or `cross` + Docker) for
# every C dependency in the tree, and the Windows MSVC target has no honest
# equivalent at all.
#
# One measured exception, worth writing down because it is the escape hatch for
# 2027: macOS -> macOS *does* cross-compile out of the box, because Apple's
# clang carries both architectures' SDKs. `cargo build --release --target
# aarch64-apple-darwin` on an x86_64 Mac was run while writing this and
# produced a working arm64 binary (onig_sys, rusqlite/bundled, sqlite-vec and
# ort-sys all compiled; `otool -L` showed only system dylibs, i.e. ONNX Runtime
# really is statically linked).
#
# GM-613 uses that escape hatch in the other direction: the x86_64 row runs on
# the arm64 `macos-15` runner and cross-builds (`--target x86_64-apple-darwin`),
# because the Intel runner gated the whole release (36-42 min of tests, 14-20
# min of build, and up to 24 min of queue). The rows stay two (owner decision
# D1), both on `macos-15`, so the job-per-target view and artifact names are
# unchanged. A cross-built binary is still *executed* before it ships: Rosetta
# runs it, and every check that ran natively before (`--version`, `plugins
# list`, each plugin's handshake, release-smoke.sh's two `reindex` legs) runs
# the x86_64 code. Rosetta would equally run a mislabelled arm64 binary, so
# `lipo -archs` asserts the architecture of core and every plugin binary
# first (scripts/lib/runnable.sh). The shipped x86_64 binary is never run on
# Intel hardware (owner decision D3); the same code's x86_64 tests are, in
# ci.yml.
#
# `ort` is pinned to `=2.0.0-rc.9` (see core/Cargo.toml for why). Verified
# against that release's own `dist.txt`: it ships a *static*, execution-
# provider-free prebuilt for all four triples below (ONNX Runtime 1.20.0), so
# no target here is blocked by the pin. `ort-sys` downloads that prebuilt
# during the build, so these jobs need network access - they are not hermetic.

name: Release artifacts

on:
  # Builds artifacts and verifies them, but creates no Release, whatever the
  # branch. This is the safe way to exercise the pipeline - Actions tab -> this
  # workflow -> "Run workflow" - and the reason publishing is bound to a tag
  # rather than to a button somebody might press by accident. Run this once
  # before cutting the first tag: the `verify` job rehearses everything the
  # release depends on except the Releases API calls themselves. It also runs
  # the same `ci-gate` a tag does (GM-613, owner decision D4), so a dispatch on
  # a commit ci.yml already passed in full skips the tests exactly as the tag
  # would, and one on an untested commit runs them.
  workflow_dispatch:
  # The one trigger that publishes. The repository still has no tags; pushing
  # the first one is the deliberate human act that cuts the first release.
  push:
    tags:
      - "v*"
  # Building four targets is expensive, so PRs only trigger it when the
  # pipeline itself changes. This is the intended way to prove the workflow
  # works before relying on it for a real release: open a PR touching these
  # files and watch all four jobs.
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "scripts/build-targets.sh"
      - "scripts/bundle-plugin.sh"
      - "scripts/bundle-go-plugin.sh"
      - "scripts/bundle-rust-plugin.sh"
      - "scripts/bundle-python-plugin.sh"
      - "scripts/prepare-release-assets.sh"
      # GM-613: the shared "can this run here" helpers every build script
      # sources, and the script that decides whether `tests` runs.
      - "scripts/lib/runnable.sh"
      - "scripts/ci-green-for-commit.sh"
      # GM-333: a change to any of these should get the same "watch all
      # four jobs" PR run as a change to the build/package scripts above -
      # they are what the new smoke-test steps in the `build` job actually
      # run.
      - "scripts/release-smoke.sh"
      - "scripts/release-smoke-fixture/**"
      - "scripts/install.ps1"
      - "scripts/mcp-smoke.py"

# The floor for every job. Only the `publish` job raises it, to `contents:
# write`, and only for itself - the jobs that compile third-party C, C++ and
# Rust never hold a token that can write to this repository.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # A superseded branch build is worth cancelling; a release in flight is not.
  # Cancelling between "assets uploaded" and "Release created" would leave a
  # half-formed draft that the next run then has to reconcile.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # GM-613: has ci.yml already passed a *full* run on this code? A tag is cut
  # by scripts/cut-release.sh only after GM-391 checked the release branch's
  # ci.yml run, and the tag commit's tree is that commit's tree, so testing it
  # again repeats a result already in hand (~41-60 minutes, most of it the
  # Intel runner). scripts/ci-green-for-commit.sh looks for a successful ci.yml
  # run whose "Full test suite ran" job succeeded, on this commit or on a
  # parent with the identical tree (owner decision D2), and answers
  # `green=false` on anything it cannot prove - any API error included - so a
  # failure here runs the tests, never skips them. Runs on every event (D4).
  #
  # The only job that holds `actions: read` (to list ci.yml runs and jobs);
  # the workflow floor stays `contents: read`, and the jobs that compile
  # third-party code never get it.
  ci-gate:
    name: CI already green on this code?
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      green: ${{ steps.gate.outputs.green }}
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v7
      - name: Look for a green full ci.yml run on this commit or a same-tree parent
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out="$(bash scripts/ci-green-for-commit.sh "$GITHUB_REPOSITORY" "$GITHUB_SHA")" || out="green=false"
          # Only an exact `green=true` line skips the tests.
          green=false run="" sha=""
          if printf '%s\n' "$out" | grep -qx 'green=true'; then
            green=true
            run="$(printf '%s\n' "$out" | sed -n 's/^run=//p')"
            sha="$(printf '%s\n' "$out" | sed -n 's/^sha=//p')"
          fi
          {
            echo "green=$green"
            echo "run=$run"
          } >> "$GITHUB_OUTPUT"
          {
            echo '### CI gate'
            echo
            if [ "$green" = true ]; then
              echo "Tests skipped: ci.yml run [$run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run) passed a full run on \`$sha\` (same tree as \`$GITHUB_SHA\`)."
            else
              echo "Tests run: no green full ci.yml run found on \`$GITHUB_SHA\` or a same-tree parent (or the lookup failed)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # The test gate. Calling ci.yml rather than restating its steps is the
  # point: a copy would drift, and a release gated on a *drifted* copy of the
  # tests is worse than one gated on nothing, because it looks like it was
  # checked.
  #
  # Until GM-613 this cost every release a full test run on four platforms
  # before the first artifact was compiled. It still does whenever `ci-gate`
  # cannot prove ci.yml already passed in full on this code - an untested
  # commit is never published untested. When it can, this job is skipped and
  # `build` starts at once. ci.yml's per-row limits (GM-612) live in its own
  # matrix, so this call inherits them.
  tests:
    needs: ci-gate
    if: needs.ci-gate.outputs.green != 'true'
    uses: ./.github/workflows/ci.yml

  build:
    name: ${{ matrix.target }}
    needs: [ci-gate, tests]
    # `tests` is either green or deliberately skipped by the gate. Not
    # `always()`: a cancelled release must not start building; and a failed
    # `tests` or `ci-gate` skips this job, and with it publish/verify.
    if: ${{ !cancelled() && needs.ci-gate.result == 'success' && (needs.tests.result == 'success' || needs.tests.result == 'skipped') }}
    runs-on: ${{ matrix.runner }}
    # GM-613: a smoke check that cannot run fails the build instead of
    # logging "smoke test skipped" (scripts/lib/runnable.sh).
    env:
      G_MESH_REQUIRE_SMOKE: "1"
    # A full build compiles ONNX Runtime bindings, bundled SQLite and Oniguruma
    # from scratch (no cache is used - a release build should not be able to
    # pick up a stale object file), which is slow on the macOS images.
    timeout-minutes: 90
    strategy:
      # One platform failing should not hide whether the other three work.
      fail-fast: false
      matrix:
        include:
          # Intel macOS, cross-built on the arm64 runner and smoke-tested
          # there under Rosetta (GM-613; see "WHY A MATRIX ON NATIVE
          # RUNNERS" above). Its *tests* still run on real Intel
          # (`macos-15-intel`) in ci.yml - only the build moved. That image
          # is GitHub's last Intel one; x86_64 macOS runners go away in
          # autumn 2027, after which only this cross-build remains.
          - target: x86_64-apple-darwin
            runner: macos-15
          - target: aarch64-apple-darwin
            runner: macos-15
          # Pinned to the oldest supported Ubuntu on purpose: the glibc the
          # binary links against is the runner's (2.35 here), and a binary
          # built on a newer image simply will not start on an older distro.
          # `ubuntu-latest` would move the floor up; it does not follow that
          # this pin keeps the floor low. GM-332 measured where it actually
          # sits, and the answer is **glibc 2.34 / GLIBCXX_3.4.29 (GCC 11)**:
          #
          #   ubuntu:22.04  glibc 2.35   starts, indexes
          #   ubuntu:24.04  glibc 2.39   starts, indexes
          #   ubuntu:20.04  glibc 2.31   does not start:
          #     libstdc++.so.6: version `GLIBCXX_3.4.29' not found
          #     libc.so.6: version `GLIBC_2.34' not found
          #
          # So Ubuntu 20.04, Debian 11, RHEL 8, Amazon Linux 2 and CentOS 7
          # cannot run the artifact at all. Two separate causes, neither of
          # them a dependency we could drop:
          #
          #   * GLIBC_2.34 comes from glibc itself. 2.34 absorbed libpthread,
          #     libdl and librt into libc, so `pthread_create`, `dlopen` and
          #     `__libc_start_main` are only offered at that version here. A
          #     five-line Rust program with no dependencies, built on this
          #     runner, needs the same 12 symbols at GLIBC_2.34. The builder's
          #     glibc is the floor; the crate graph has nothing to do with it.
          #   * GLIBCXX_3.4.29 comes from ONNX Runtime (`ort`), the only C++
          #     in the tree - the same probe links no libstdc++ at all.
          #
          # Which kills the obvious idea: making the embedding runtime
          # optional would drop 36MB but NOT one version of floor, because
          # GCC 11 and glibc 2.34 ship on the same distros. Lowering the floor
          # means building against an older glibc - a manylinux/older-Ubuntu
          # *container* on this runner, since GitHub retired the 20.04 image -
          # or a musl target. Both are real work and neither is scheduled; see
          # GM-332 for the decision and the numbers behind it.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: x86_64-pc-windows-msvc
            runner: windows-2022

    steps:
      # Pinned to the current major of each action as of 2026-08.
      - uses: actions/checkout@v7

      # First, because it is the cheapest possible failure. The archives are
      # named after `core/Cargo.toml`'s version, so a tag that disagrees with
      # it would otherwise burn four 90-minute builds to produce a "v2.7.0"
      # Release whose every file says v2.6.0. `--version` needs no toolchain,
      # which is why this can run before Rust is installed.
      - name: Check the tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          crate="$(bash scripts/build-targets.sh --version)"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$crate" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match core/Cargo.toml version $crate - bump the crate version, or delete and recut the tag"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches crate version $crate"

      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc -vV

      # The Go plugin (plugins/go, GM-283) needs no native runner - it
      # cross-compiles a static, CGO-free binary for any target from any
      # host (`GOOS`/`GOARCH`, `CGO_ENABLED=0`; see
      # scripts/bundle-go-plugin.sh) - but `go build` itself still has to
      # exist on PATH. `go-version-file` reads plugins/go/go.mod so the
      # toolchain version installed here can never drift from the one the
      # module declares. `cache: false` because that module has zero
      # dependencies (no go.sum to key a cache on).
      - uses: actions/setup-go@v7
        with:
          go-version-file: plugins/go/go.mod
          cache: false

      # GM-613: the x86_64 row executes its cross-built binary under Rosetta.
      # GitHub's arm64 macOS images install it today; if one ever does not,
      # install it here rather than let the smoke checks be skipped (they
      # could not be anyway: G_MESH_REQUIRE_SMOKE=1 makes a skip fatal).
      - name: Rosetta available
        if: matrix.target == 'x86_64-apple-darwin'
        shell: bash
        run: |
          if ! arch -x86_64 /usr/bin/true; then
            softwareupdate --install-rosetta --agree-to-license
            arch -x86_64 /usr/bin/true
          fi
          echo "Rosetta runs x86_64 code on this $(uname -m) runner"

      # All naming/staging/archiving lives in the script so that what CI
      # produces is exactly what a developer can reproduce locally. Invoked via
      # `bash` rather than as an executable because the checkout on Windows
      # does not carry the file mode.
      - name: Build and package ${{ matrix.target }}
        shell: bash
        run: bash scripts/build-targets.sh ${{ matrix.target }}

      # The toolchains that produced this target's archive: rustc built core
      # and the three cargo plugins (JS/TS, Rust, Python), go built the Go
      # plugin. Recorded per target rather than assumed uniform, because each
      # runner image carries its own patch versions. The publish job turns
      # these files into a table in the release notes; nothing fails if one
      # is missing.
      - name: Record what this artifact carries
        shell: bash
        run: |
          mkdir -p dist/meta
          {
            echo "target=${{ matrix.target }}"
            echo "runner=${{ matrix.runner }}"
            echo "go=$(go version)"
            echo "rustc=$(rustc --version)"
          } > "dist/meta/${{ matrix.target }}.txt"
          cat "dist/meta/${{ matrix.target }}.txt"

      # GM-333. `build_one()` above already proves the staged binary starts
      # and sees the plugins staged beside it (`--version`/`plugins list`,
      # gated on `can_run_target` inside build-targets.sh - which, in this
      # matrix, is every leg: natively, or for x86_64 macOS under Rosetta,
      # GM-613; with G_MESH_REQUIRE_SMOKE=1 a leg that cannot run them
      # fails). It never spawns a plugin process, indexes anything, or
      # touches the network - exactly what GM-206 went and checked by hand,
      # once, on one platform, and exactly what a build cannot reveal on its
      # own ("CI produced it" is not "it works"). This runs `<staged binary>
      # reindex` against an in-tree multi-language fixture
      # (scripts/release-smoke-fixture) on this target's own runner (x86_64
      # macOS: under Rosetta), so every
      # release gets that on all four - see scripts/release-smoke.sh's own
      # header for exactly what it checks and why, including the fixture
      # choice and why `g-mesh model fetch` is deliberately not part of this.
      #
      # Runs unconditionally - on a manual dispatch, a PR touching the
      # pipeline, and a tag alike - not only on a tag: `tests:` above already
      # makes this argument once for never building on untested code, and a
      # check that only runs at release time is a check that tells you after
      # it shipped.
      - name: Smoke test the staged artifact (GM-333)
        shell: bash
        run: |
          stage_dir="$(bash scripts/build-targets.sh --stage-dir ${{ matrix.target }})"
          bash scripts/release-smoke.sh "$stage_dir" ${{ matrix.target }} dist

      # Runs scripts/install.ps1 end to end against the archive this job just
      # staged (there is no published release to install from during a
      # build). A local file server hands out the staged `.zip` and `.sha256`
      # at the `<base>/v<version>/<asset>` shape install.ps1 expects from
      # GitHub Releases, through the documented `G_MESH_DOWNLOAD_BASE`
      # override (install.ps1's "TESTING IT WITHOUT A RELEASE" section). The
      # installed g-mesh.exe must then report the version, list all four
      # bundled plugins, index scripts/release-smoke-fixture (non-zero nodes
      # and edges, no undiscovered or shadowed plugin) and answer one
      # `find_callers` call over MCP through `mcp-shim` with a caller in every
      # language (scripts/mcp-smoke.py). After that come the user-Path, -Force
      # and opt-out checks.
      #
      # Invariant: the checkout's `plugins\` is renamed for the whole step.
      # The binary also searches a compiled-in root, `<checkout>\core\..\plugins`,
      # which on this runner is the live checkout, so with it in place a
      # plugin install.ps1 failed to install would still be found there and
      # every discovery check above would pass. Hidden, discovery is what a
      # user's machine has. `finally` renames it back and stops the daemon
      # the MCP call started, before removing the install it runs from.
      #
      # Everything the step creates lives under `$env:RUNNER_TEMP`, and
      # `finally` tears the server and the installs down besides, so nothing
      # here can affect a later step. It needs `python` on PATH (GitHub's
      # `windows-2022` image documents it); without it the step fails loudly
      # ("python not found") rather than skipping.
      - name: Install from the staged archive with install.ps1 (GM-333)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if (-not (Get-Command python -ErrorAction SilentlyContinue)) {
            throw "python not found on PATH - needed to serve the staged archive locally for install.ps1's end-to-end smoke test (GM-333)"
          }

          $version = ((& bash scripts/build-targets.sh --version) | Out-String).Trim()
          $names = @(& bash scripts/build-targets.sh --asset-names x86_64-pc-windows-msvc)
          $archive = $names[0]
          $checksum = $names[1]

          $serveRoot = Join-Path $env:RUNNER_TEMP 'g-mesh-install-smoke-serve'
          $versionDir = Join-Path $serveRoot "v$version"
          New-Item -ItemType Directory -Path $versionDir -Force | Out-Null
          Copy-Item "dist/$archive" (Join-Path $versionDir $archive)
          Copy-Item "dist/$checksum" (Join-Path $versionDir $checksum)

          $port = 8933
          Write-Host "==> starting a local file server on 127.0.0.1:$port ($serveRoot)"
          $serverOutLog = Join-Path $env:RUNNER_TEMP 'g-mesh-install-smoke-server.out.log'
          $serverErrLog = Join-Path $env:RUNNER_TEMP 'g-mesh-install-smoke-server.err.log'
          $server = Start-Process -FilePath 'python' `
            -ArgumentList @('-m', 'http.server', '--bind', '127.0.0.1', '--directory', $serveRoot, "$port") `
            -PassThru -WindowStyle Hidden `
            -RedirectStandardOutput $serverOutLog -RedirectStandardError $serverErrLog

          $installDir = Join-Path $env:RUNNER_TEMP 'g-mesh-install-smoke-installed'
          $foreignDir = Join-Path $env:RUNNER_TEMP 'g-mesh-install-smoke-foreign'
          $optOutDir = Join-Path $env:RUNNER_TEMP 'g-mesh-install-smoke-optout'

          # install.ps1 edits the user Path by default. The raw value and its
          # kind are saved here and put back in `finally`, so this step leaves
          # the runner's user Path exactly as it found it.
          $envKey = [Microsoft.Win32.Registry]::CurrentUser.CreateSubKey('Environment')
          $savedUserPath = $envKey.GetValue('Path', $null, [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
          $savedUserPathKind = if ($null -ne $savedUserPath) { $envKey.GetValueKind('Path') } else { $null }
          function Get-UserPathCount([string]$dir) {
            $raw = [string]$envKey.GetValue('Path', '', [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
            @($raw -split ';' | Where-Object { $_ -and ($_.TrimEnd('\') -ieq $dir.TrimEnd('\')) }).Count
          }

          # Paths for the installed-binary index + MCP smoke, and the
          # checkout plugins\ rename (see this step's comment).
          $checkoutPlugins = Join-Path $PWD 'plugins'
          $hiddenPluginsName = 'plugins.gm205-hidden'
          $hiddenPlugins = Join-Path $PWD $hiddenPluginsName
          $pluginsHidden = $false
          $smokeProject = Join-Path $env:RUNNER_TEMP 'gm205-proj'
          $smokeHome = Join-Path $env:RUNNER_TEMP 'gmh'

          try {
            Rename-Item -LiteralPath $checkoutPlugins -NewName $hiddenPluginsName
            $pluginsHidden = $true

            $ready = $false
            for ($i = 0; $i -lt 40; $i++) {
              try {
                Invoke-WebRequest -Uri "http://127.0.0.1:$port/v$version/$archive" -Method Head -UseBasicParsing -ErrorAction Stop | Out-Null
                $ready = $true
                break
              } catch {
                Start-Sleep -Milliseconds 250
              }
            }
            if (-not $ready) {
              throw "local file server on 127.0.0.1:$port never came up - see $serverOutLog / $serverErrLog"
            }

            $env:G_MESH_DOWNLOAD_BASE = "http://127.0.0.1:$port"
            # A `throw` inside install.ps1 (its `Die`) unwinds up through this
            # call and into the `finally` below, same as it would for anyone
            # running it - `&` invokes it in a child scope of this same
            # session, not a separate process, so nothing extra is needed to
            # propagate that failure into this step failing.
            & (Join-Path $PWD 'scripts/install.ps1') -Version $version -InstallDir $installDir

            $exe = Join-Path $installDir 'g-mesh.exe'
            if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
              throw "install.ps1 reported success but $exe does not exist"
            }

            Write-Host "==> verifying the installed binary runs from its final location"
            $reported = ((& $exe --version) -join "`n")
            if ($LASTEXITCODE -ne 0 -or $reported -notmatch [regex]::Escape($version)) {
              throw "installed g-mesh.exe --version did not report $version (exit $LASTEXITCODE, output: $reported)"
            }
            $pluginsOutput = ((& $exe plugins list) -join "`n")
            if ($LASTEXITCODE -ne 0) {
              throw "installed g-mesh.exe plugins list exited $LASTEXITCODE"
            }
            foreach ($lang in @('typescript', 'go', 'rust', 'python')) {
              if ($pluginsOutput -notmatch $lang) {
                throw "installed g-mesh.exe does not see the $lang plugin - plugins list:`n$pluginsOutput"
              }
            }

            Write-Host "PASS: install.ps1 installed g-mesh $version from the staged archive, and the installed binary runs with all four bundled plugins discovered"

            Write-Host "==> indexing scripts/release-smoke-fixture with the installed binary"
            Copy-Item -LiteralPath (Join-Path $PWD 'scripts/release-smoke-fixture') -Destination $smokeProject -Recurse
            Remove-Item -LiteralPath (Join-Path $smokeProject 'README.md')
            New-Item -ItemType Directory -Path $smokeHome -Force | Out-Null
            # A short G_MESH_HOME: the daemon's AF_UNIX socket lives under it
            # and its path must stay under ~108 characters.
            $env:G_MESH_HOME = $smokeHome
            Remove-Item Env:CLAUDE_PROJECT_DIR -ErrorAction SilentlyContinue
            Push-Location -LiteralPath $smokeProject
            $savedEap = $ErrorActionPreference
            $ErrorActionPreference = 'Continue'
            try {
              $reindexOutput = ((& $exe reindex 2>&1 | ForEach-Object { "$_" }) -join "`n")
              $reindexStatus = $LASTEXITCODE
            } finally {
              $ErrorActionPreference = $savedEap
              Pop-Location
            }
            Write-Host $reindexOutput
            if ($reindexStatus -ne 0) {
              throw "installed g-mesh.exe reindex exited $reindexStatus against the fixture - see output above"
            }
            if ($reindexOutput -match 'has no plugin installed') {
              throw "installed g-mesh.exe reindex reports a language with no plugin installed - its plugin was not discovered beside the installed binary"
            }
            if ($reindexOutput -match 'shadows') {
              throw "installed g-mesh.exe reindex found a plugin in more than one root - discovery is not what a user's machine has"
            }
            $counts = [regex]::Match($reindexOutput, '(?m)^\s*index:\s+(\d+) nodes, (\d+) edges')
            if (-not $counts.Success) {
              throw "installed g-mesh.exe reindex output has no 'index: N nodes, M edges' line"
            }
            $nodes = [int]$counts.Groups[1].Value
            $edges = [int]$counts.Groups[2].Value
            if ($nodes -le 0 -or $edges -le 0) {
              throw "installed g-mesh.exe indexed $nodes node(s) and $edges edge(s) from the fixture - expected both above 0"
            }
            Write-Host "==> reindex reported $nodes node(s), $edges edge(s)"

            Write-Host "==> one find_callers call over MCP through the installed binary's mcp-shim"
            & python -I (Join-Path $PWD 'scripts/mcp-smoke.py') $exe $smokeProject
            if ($LASTEXITCODE -ne 0) {
              throw "scripts/mcp-smoke.py exited $LASTEXITCODE against the installed g-mesh.exe - see output above"
            }
            Remove-Item Env:G_MESH_HOME
            Write-Host "PASS: the installed g-mesh.exe indexed the fixture and answered find_callers over MCP (go, python, rust, typescript)"

            $count = Get-UserPathCount $installDir
            if ($count -ne 1) {
              throw "after a default install, the user Path holds $installDir $count time(s), expected 1"
            }
            & (Join-Path $PWD 'scripts/install.ps1') -Version $version -InstallDir $installDir
            $count = Get-UserPathCount $installDir
            if ($count -ne 1) {
              throw "after a second install, the user Path holds $installDir $count time(s), expected still 1"
            }
            Write-Host "PASS: a default install added $installDir to the user Path once, and a re-install left it at once"

            # GM-347: -Force, executed rather than reasoned about. A non-empty
            # directory with no g-mesh.exe in it must be refused without
            # -Force, with its contents left alone, and replaced with it.
            New-Item -ItemType Directory -Path $foreignDir -Force | Out-Null
            $foreignFile = Join-Path $foreignDir 'someone-elses-file.txt'
            Set-Content -LiteralPath $foreignFile -Value 'not g-mesh'

            $refused = $null
            try {
              & (Join-Path $PWD 'scripts/install.ps1') -Version $version -InstallDir $foreignDir
            } catch {
              $refused = $_.Exception.Message
            }
            if (-not $refused) {
              throw "install.ps1 without -Force installed over a non-empty foreign directory instead of refusing"
            }
            if ($refused -notmatch 'is not empty') {
              throw "install.ps1 without -Force failed, but not with the non-empty refusal: $refused"
            }
            if (-not (Test-Path -LiteralPath $foreignFile -PathType Leaf)) {
              throw "install.ps1 refused, but the foreign directory's file is gone"
            }
            Write-Host "PASS: without -Force, install.ps1 refused the non-empty directory and left it intact ($refused)"

            & (Join-Path $PWD 'scripts/install.ps1') -Version $version -InstallDir $foreignDir -Force -NoModifyPath
            if (-not (Test-Path -LiteralPath (Join-Path $foreignDir 'g-mesh.exe') -PathType Leaf)) {
              throw "install.ps1 -Force reported success but g-mesh.exe is not in $foreignDir"
            }
            if (Test-Path -LiteralPath $foreignFile) {
              throw "install.ps1 -Force installed but left the directory's previous contents beside the new install"
            }
            Write-Host "PASS: with -Force, install.ps1 replaced the non-empty directory with a g-mesh install"
            if ((Get-UserPathCount $foreignDir) -ne 0) {
              throw "install.ps1 -NoModifyPath still added $foreignDir to the user Path"
            }
            Write-Host "PASS: -NoModifyPath left the user Path alone"

            $env:G_MESH_NO_MODIFY_PATH = '1'
            & (Join-Path $PWD 'scripts/install.ps1') -Version $version -InstallDir $optOutDir
            Remove-Item Env:G_MESH_NO_MODIFY_PATH
            if (-not (Test-Path -LiteralPath (Join-Path $optOutDir 'g-mesh.exe') -PathType Leaf)) {
              throw "install.ps1 with G_MESH_NO_MODIFY_PATH=1 reported success but g-mesh.exe is not in $optOutDir"
            }
            if ((Get-UserPathCount $optOutDir) -ne 0) {
              throw "install.ps1 with G_MESH_NO_MODIFY_PATH=1 still added $optOutDir to the user Path"
            }
            Write-Host "PASS: G_MESH_NO_MODIFY_PATH=1 left the user Path alone"
          } finally {
            # The daemon runs from $installDir and holds files under it and
            # under G_MESH_HOME; stop it before anything is removed.
            $installedExe = Join-Path $installDir 'g-mesh.exe'
            if ((Test-Path -LiteralPath $installedExe -PathType Leaf) -and (Test-Path -LiteralPath $smokeProject -PathType Container)) {
              $env:G_MESH_HOME = $smokeHome
              Push-Location -LiteralPath $smokeProject
              try { & $installedExe stop 2>&1 | Out-Host } catch { } finally { Pop-Location }
            }
            Remove-Item Env:G_MESH_HOME -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $smokeProject -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $smokeHome -Recurse -Force -ErrorAction SilentlyContinue
            if ($server -and -not $server.HasExited) {
              Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
            }
            Remove-Item -LiteralPath $installDir -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $foreignDir -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $optOutDir -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item Env:G_MESH_NO_MODIFY_PATH -ErrorAction SilentlyContinue
            if ($null -ne $savedUserPath) {
              $envKey.SetValue('Path', $savedUserPath, $savedUserPathKind)
            } else {
              $envKey.DeleteValue('Path', $false)
            }
            $envKey.Close()
            Remove-Item -LiteralPath $serveRoot -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item Env:G_MESH_DOWNLOAD_BASE -ErrorAction SilentlyContinue
            # Last, so a failed rename still fails the step without skipping
            # the cleanup above.
            if ($pluginsHidden) {
              Rename-Item -LiteralPath $hiddenPlugins -NewName 'plugins'
            }
          }

      # `meta/` rides along inside the same artifact rather than as a second
      # one: upload-artifact roots the upload at the common ancestor of these
      # paths (`dist/`), so the download in the publish job reconstructs
      # exactly this layout. It is not published as a release asset - only the
      # archives and their checksums are.
      - uses: actions/upload-artifact@v7
        with:
          name: g-mesh-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
            dist/meta/*.txt
          if-no-files-found: error

  # Installs the latest *published* GitHub Release on a clean Windows runner
  # with the README's one-liner, as a user runs it: install.ps1 from `main`
  # on raw.githubusercontent.com piped into `iex`, the version from the
  # releases/latest API, the archive and checksum from GitHub Releases, the
  # default install directory and user-Path edit. Once under PowerShell 7
  # (`pwsh`) and once under Windows PowerShell 5.1 (`powershell`, what stock
  # Windows ships). It tests what is already published, not this commit, so
  # it has no checkout and no build. It runs on a manual dispatch and on a tag
  # run once `publish` succeeded; on a tag run `releases/latest` must be that
  # tag. Its token is read-only; it publishes nothing.
  install-latest:
    name: Install the latest published release on Windows
    needs: publish
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.publish.result == 'success') }}
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # install.ps1 sends it to the releases/latest API when set: shared
      # runner IPs run out of the unauthenticated 60-per-hour limit.
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: README one-liner under PowerShell 7 (pwsh)
        shell: pwsh
        run: |
          Remove-Item -LiteralPath (Join-Path $env:USERPROFILE '.g-mesh') -Recurse -Force -ErrorAction SilentlyContinue
          irm https://raw.githubusercontent.com/madmurdok/g-mesh/main/scripts/install.ps1 | iex
          $exe = Join-Path $env:USERPROFILE '.g-mesh\bin\g-mesh.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "the one-liner reported success but $exe does not exist"
          }
          $latest = (Invoke-RestMethod -Uri 'https://api.github.com/repos/madmurdok/g-mesh/releases/latest' -Headers @{ Authorization = "Bearer $env:GITHUB_TOKEN" }).tag_name.TrimStart('v')
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $latest -ne $env:GITHUB_REF_NAME.TrimStart('v')) {
            throw "releases/latest is $latest, expected the tag $env:GITHUB_REF_NAME that this run just published"
          }
          $reported = ((& $exe --version) -join "`n")
          if ($LASTEXITCODE -ne 0 -or $reported -notmatch [regex]::Escape($latest)) {
            throw "installed g-mesh.exe --version did not report the latest release $latest (exit $LASTEXITCODE, output: $reported)"
          }
          $plugins = ((& $exe plugins list) -join "`n")
          if ($LASTEXITCODE -ne 0) {
            throw "installed g-mesh.exe plugins list exited $LASTEXITCODE"
          }
          foreach ($lang in @('typescript', 'go', 'rust', 'python')) {
            if ($plugins -notmatch $lang) {
              throw "installed g-mesh.exe does not see the $lang plugin - plugins list:`n$plugins"
            }
          }
          Write-Host "PASS: the README one-liner installed g-mesh $latest from GitHub Releases under PowerShell $($PSVersionTable.PSVersion), and it runs with all four bundled plugins"

      - name: README one-liner under Windows PowerShell 5.1 (powershell)
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5) {
            throw "expected Windows PowerShell 5.x, got $($PSVersionTable.PSVersion)"
          }
          Remove-Item -LiteralPath (Join-Path $env:USERPROFILE '.g-mesh') -Recurse -Force -ErrorAction SilentlyContinue
          irm https://raw.githubusercontent.com/madmurdok/g-mesh/main/scripts/install.ps1 | iex
          $exe = Join-Path $env:USERPROFILE '.g-mesh\bin\g-mesh.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "the one-liner reported success but $exe does not exist"
          }
          $latest = (Invoke-RestMethod -Uri 'https://api.github.com/repos/madmurdok/g-mesh/releases/latest' -Headers @{ Authorization = "Bearer $env:GITHUB_TOKEN" }).tag_name.TrimStart('v')
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $latest -ne $env:GITHUB_REF_NAME.TrimStart('v')) {
            throw "releases/latest is $latest, expected the tag $env:GITHUB_REF_NAME that this run just published"
          }
          $reported = ((& $exe --version) -join "`n")
          if ($LASTEXITCODE -ne 0 -or $reported -notmatch [regex]::Escape($latest)) {
            throw "installed g-mesh.exe --version did not report the latest release $latest (exit $LASTEXITCODE, output: $reported)"
          }
          $plugins = ((& $exe plugins list) -join "`n")
          if ($LASTEXITCODE -ne 0) {
            throw "installed g-mesh.exe plugins list exited $LASTEXITCODE"
          }
          foreach ($lang in @('typescript', 'go', 'rust', 'python')) {
            if ($plugins -notmatch $lang) {
              throw "installed g-mesh.exe does not see the $lang plugin - plugins list:`n$plugins"
            }
          }
          Write-Host "PASS: the README one-liner installed g-mesh $latest from GitHub Releases under PowerShell $($PSVersionTable.PSVersion), and it runs with all four bundled plugins"

  # The publish job's dangerous half - "are these the right files, under the
  # right names" - rehearsed on every non-tag run, so it is not first exercised
  # by the release it would ruin. Deliberately a separate job rather than a
  # step with an `if`, because permissions are per job: this one must never
  # hold `contents: write`, and it never calls `gh`.
  verify:
    name: Verify assets (dry run)
    needs: build
    # `!cancelled() && needs.build.result == 'success'` rather than the
    # implicit success(): that one also looks at `build`'s own ancestors, and
    # `tests` is skipped whenever ci-gate found a green run (GM-613), which
    # would skip this job too although `build` succeeded.
    if: ${{ !cancelled() && needs.build.result == 'success' && !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: g-mesh-*
          merge-multiple: true
      - name: Verify the assets and build SHA256SUMS
        shell: bash
        # No G_MESH_VERSION: off a tag, core/Cargo.toml is the only version
        # there is, and it is exactly what the archives were named after.
        run: bash scripts/prepare-release-assets.sh dist
      - name: Show what a release would publish
        shell: bash
        run: |
          {
            echo '### Assets a release from this commit would publish'
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
            echo
            echo 'Nothing was published: this run is not a version tag.'
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish Release
    # This is the "all four or nothing" rule: the matrix is `fail-fast: false`
    # so one platform's failure cannot hide the other three, but `build` as a
    # whole only has the result `success` when every leg does, and the `if`
    # below demands exactly that. It is spelled out rather than left to the
    # implicit success() because that one also looks at `build`'s ancestors,
    # and `tests` is *skipped* whenever ci-gate found a green full run
    # (GM-613) - the implicit check would then skip publishing although all
    # four legs succeeded. `!cancelled()` (not `always()`) keeps a cancelled
    # release from publishing.
    needs: build
    # Publishing is bound to a version tag and nothing else. Manual and PR runs
    # still build and upload all four artifacts, so the pipeline stays testable
    # without any path from a button press to a public Release.
    if: ${{ !cancelled() && needs.build.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      # The only elevated permission in this file, scoped to the one job that
      # needs it. Creating a Release and uploading assets is all `contents:
      # write` is for here - no packages, no id-token, no deployments.
      contents: write
    steps:
      - uses: actions/checkout@v7

      # v8, not v7: download-artifact and upload-artifact are versioned
      # independently and their current majors do not match.
      - name: Download every target's artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: g-mesh-*
          merge-multiple: true

      # The check that makes the rest of this job safe. It fails the release if
      # any archive, checksum or name is not exactly what a full four-target
      # build produces - including the case that matters most to #66's
      # installer, an asset whose URL is not the one the naming convention
      # predicts. It also writes dist/SHA256SUMS.
      - name: Verify the assets and build SHA256SUMS
        shell: bash
        run: |
          # The tag decides the version here. If it disagrees with
          # core/Cargo.toml the archives are named after the crate version, the
          # expected names will not be found, and the release stops - the same
          # mismatch the build jobs already refuse to start on, re-checked
          # against the files that actually exist.
          G_MESH_VERSION="${GITHUB_REF_NAME#v}" bash scripts/prepare-release-assets.sh dist

      - name: Compose release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"

          plugin_line=""
          {
            echo "## Downloads"
            echo
            echo "| target | archive | Go compiler used | built with |"
            echo "| --- | --- | --- | --- |"
            for target in $(bash scripts/build-targets.sh --list); do
              # First line is the archive, second is its .sha256. Piping to
              # `head -1` would risk a SIGPIPE failure under `pipefail`.
              names="$(G_MESH_VERSION="$version" bash scripts/build-targets.sh --asset-names "$target")"
              archive="${names%%$'\n'*}"

              go="unknown"
              rustc="unknown"
              meta="dist/meta/$target.txt"
              if [ -f "$meta" ]; then
                go="$(awk -F= '$1 == "go" { print $2 }' "$meta")"
                rustc="$(awk -F= '$1 == "rustc" { print $2 }' "$meta")"
              fi

              echo "| \`$target\` | \`$archive\` | $go | $rustc |"

              # Every line after the main archive's pair alternates plugin
              # asset, .sha256.
              plugin_line="$plugin_line"$'\n'"- \`$target\`:"
              n=0
              while IFS= read -r name; do
                n=$((n + 1))
                if [ "$n" -gt 2 ] && [ $((n % 2)) -eq 1 ]; then
                  plugin_line="$plugin_line \`$name\`"
                fi
              done <<< "$names"
            done

            echo
            echo "### Plugin assets"
            echo
            echo "Each bundled plugin is also published on its own, as the archive's"
            echo "\`plugins/<language>/\` directory. Unpacking one into \`plugins/\` beside the"
            echo "\`g-mesh\` executable restores that language (\`tar -xzf <asset> -C <install dir>/plugins\`):"
            echo "$plugin_line"

            echo
            echo "Every archive unpacks to a directory holding the \`g-mesh\` binary, the"
            echo "JS/TS plugin as a native binary in \`plugins/typescript/\`, the"
            echo "Go plugin as a static binary in \`plugins/go/\`, the Rust plugin in"
            echo "\`plugins/rust/\` and the Python plugin in \`plugins/python/\`. The machine"
            echo "running it needs no Node.js, no Go and no other toolchain for the structural"
            echo "graph of any of the four languages. The JS/TS semantic tier uses \`vtsls\`"
            echo "(on \`PATH\`, in the project's \`node_modules/.bin\`, or through \`npx\`),"
            echo "which needs Node.js; without it the structural tier answers alone. A future"
            echo "Python semantic tier would need \`pyright\` installed separately."
            echo "\`g-mesh model fetch\` downloads the embedding model \`search_code\` needs."
            echo
            echo "### Verifying a download"
            echo
            echo '```'
            echo "curl -LO https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/SHA256SUMS"
            echo "sha256sum --ignore-missing -c SHA256SUMS   # or: shasum -a 256 --ignore-missing -c SHA256SUMS"
            echo '```'
            echo
            echo "\`SHA256SUMS\` lists every archive and plugin asset; \`--ignore-missing\` is what"
            echo "keeps it from reporting the ones you did not download as failures. Each also has"
            echo "its own \`.sha256\` beside it if you would rather check just the one."
          } > notes.md

          # GitHub's own "what changed" text, fetched through the API and
          # concatenated here rather than passed as `gh release create
          # --generate-notes`: that flag's behaviour when a body is also
          # supplied has varied between gh versions, and the runner's gh is not
          # pinned. Notes are the one part of a release worth degrading rather
          # than failing over - a human reviews the draft before it goes out.
          if gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="$GITHUB_REF_NAME" --jq .body > generated.md; then
            { echo; echo "---"; echo; cat generated.md; } >> notes.md
          else
            echo "::warning::could not generate the changelog section; publishing notes without it"
          fi

          cat notes.md

      - name: Create, verify and publish the Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"

          # SHA256SUMS is the manifest: the previous step wrote one line per
          # archive it verified, so an upload list derived from it can neither
          # include a file that was not checked nor silently drop one - which
          # an unexpanded `dist/*.zip` glob could.
          assets=(dist/SHA256SUMS)
          while read -r _sum name; do
            name="${name#\*}"
            assets+=("dist/$name" "dist/$name.sha256")
          done < dist/SHA256SUMS

          if gh release view "$tag" >/dev/null 2>&1; then
            # A re-run against a Release that already exists - possibly one a
            # human has already edited or even published. Replace the assets
            # and touch nothing else: passing --draft again here would
            # un-publish a live release.
            echo "Release $tag already exists; replacing its assets only."
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" \
              --draft \
              --title "$tag" \
              --notes-file notes.md
          fi

          # A Release is public only after every asset is uploaded: the draft
          # is undrafted only once the uploaded count equals the list.
          uploaded="$(gh release view "$tag" --json assets --jq '.assets|length')"
          if [ "$uploaded" != "${#assets[@]}" ]; then
            echo "::error::release $tag has $uploaded assets, expected ${#assets[@]}; leaving it unpublished"
            exit 1
          fi

          # Only a draft is published. A Release that is already public (a
          # re-run, or one a human published) keeps its state and its
          # latest flag.
          if [ "$(gh release view "$tag" --json isDraft --jq .isDraft)" = "true" ]; then
            gh release edit "$tag" --draft=false --latest
          fi

          # Cosmetic, so it must not be able to fail a release that has already
          # happened.
          is_draft="$(gh release view "$tag" --json isDraft --jq .isDraft || echo unknown)"
          {
            echo "### $tag"
            echo
            echo "- draft: \`$is_draft\`"
            echo "- assets uploaded: ${#assets[@]}"
            echo
            if [ "$is_draft" = "false" ]; then
              echo "The Release is published and marked latest."
            else
              echo "The Release is still a draft and is not public."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
