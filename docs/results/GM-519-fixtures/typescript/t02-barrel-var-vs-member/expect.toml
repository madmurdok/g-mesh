# `handler` (the exported const) and `Router#handler` share a name, and the
# runner narrows an ambiguous name by `file` alone, so Router lives in its own
# file: each expectation then selects exactly one symbol.
[[callers]]
symbol = "Router#handler"
file = "src/router.ts"
expect = []

[[callers]]
symbol = "handler"
file = "src/x.ts"
expect = ["src/main.ts:run"]
