[package]
name = "g-mesh"
version = "3.6.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
name = "g_mesh"
path = "src/lib.rs"

[[bin]]
name = "g-mesh"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
dirs = "5"
flate2 = "1"
# Already resolved into this tree as a transitive dependency of `ignore`
# (which uses it internally for `.gitignore`-style overrides), so promoting
# it to a direct dependency for `daemon::manifest`'s `[plugin.workspace]
# watch_files` glob validation (`*.csproj`, per the multi-language-plugins
# architecture doc's paper stress test) adds no new subtree to compile -
# `cargo tree` already has one copy. Chosen over hand-rolling glob matching
# or reaching for `ignore`'s own `Override` type (built for `.gitignore`
# semantics - anchoring, negation, directory-only patterns - none of which
# `watch_files` needs) because `globset::Glob` is exactly "one shell-style
# pattern, compiled and validated once" with nothing else attached.
globset = "0.4"
# The wire protocol types, shared verbatim with `plugins/sdk` so core and
# every SDK-built plugin cannot disagree about the format - see that crate's
# own module doc for why they were moved out of `protocol::types` rather than
# either re-declared in the SDK or pulled in by making every plugin depend on
# this crate. `json-schema` is the `schemars` derive on `Position`, which only
# core needs (its MCP tool schemas); the SDK leaves it off.
g-mesh-wire = { path = "../wire", features = ["json-schema"] }
ignore = "0.4"
notify = "6"
# `[plugin] memoryLimitMb` (task GM-274, `daemon::memory`) needs each
# language plugin's *process-tree* resident memory - the plugin plus whatever
# it has spawned (tsserver, rust-analyzer, an LSP server behind a bridge) -
# sampled on the existing idle-check tick. Two ways to get that were weighed:
#
# - Hand-rolled platform code: `libproc`/`proc_pidinfo` on macOS,
#   `/proc/<pid>/status` on Linux, `Toolhelp32`/`GetProcessMemoryInfo` on
#   Windows - three FFI surfaces, one of which (macOS) has no safe crate in
#   this tree already and needs raw `extern "C"` bindings to get right, and
#   all three need their own "list every process, walk parent pids to find
#   descendants" logic, since none of the three platform APIs answers
#   "children of pid N" directly either.
# - `sysinfo`: one already-cross-platform crate that gives RSS
#   (`Process::memory()`) and parent pid (`Process::parent()`) per process on
#   all three platforms this daemon ships for, from a single `System::
#   refresh_processes` snapshot walked exactly the way the hand-rolled version
#   would have to anyway.
#
# `sysinfo` wins here on correctness, not convenience: this repo's own
# `src/process.rs` already hand-rolls the *much smaller* unix/libc vs.
# windows-sys split for "is this pid alive" and "kill it" - three lines of
# behaviour each, trivially testable against a real child process. Resident
# memory of a whole process tree is a different order of surface (macOS's
# `proc_pidinfo` struct layout alone is easy to get subtly wrong and hard to
# unit test without a real memory-hungry process on the CI runner for each of
# three platforms), and correctness here is exactly what a low `memoryLimitMb`
# depends on - a sampler that silently underreports would leave a plugin free
# to keep growing past the limit users set to protect against that.
# `default-features = false, features = ["system"]` keeps this to the process/
# memory backend only - the crate's default features (`component`, `disk`,
# `network`, `user`) pull in CoreFoundation/IOKit bindings on macOS and extra
# `windows-sys` surface this daemon has no use for, none of which this feature
# selection links in.
#
# Windows is `["system"]`-supported by `sysinfo` too, so sampling is not
# expected to be a hard no-op there the way the architecture doc's own
# contingency describes - but this daemon's Windows IPC transport is named
# pipes rather than the socket every other platform uses, and CI is the only
# place this has been exercised. See `daemon::memory`'s own doc comment for
# the documented fallback if a platform's sampling ever does come back empty:
# `None` with a one-time log, not a failure - `memoryLimitMb` becomes a no-op
# for that platform rather than taking the daemon down.
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
# ONNX Runtime bindings for the local embedding model (see src/embedding).
#
# Pinned to rc.9 on purpose, not "latest rc":
# - rc.9's prebuilt distribution still covers `x86_64-apple-darwin` (Intel
#   Macs), and links ONNX Runtime *statically*. Both matter here: rc.10+
#   dropped Intel macOS from its prebuilt matrix entirely, so `cargo build`
#   fails outright on those machines, and static linking is what keeps the
#   promise of "core is one binary with no runtime dependency for the user"
#   (REQUIREMENTS.md) instead of shipping a loose libonnxruntime.
# - rc.9's `Session::run` takes `&self` and `Session` is `Send + Sync`, so
#   `EmbeddingModel` can hand out `&self` inference to a multi-threaded daemon
#   without a mutex. rc.13 changed `run` to `&mut self`.
#
# No execution-provider feature is enabled on purpose: CPU-only, per
# REQUIREMENTS.md ("работает на CPU без GPU").
ort = "=2.0.0-rc.9"
# Not used directly - pinned only to hold `ort`'s own `ort-sys` dependency down.
# `ort` rc.9 asks for `ort-sys = "2.0.0-rc.9"`, and because that is a caret
# requirement on a pre-release, Cargo happily resolves it to rc.13, whose build
# script does not compile against current `ureq` and whose binary distribution
# has no Intel macOS entry. Without this pin the build breaks the first time
# anyone runs `cargo update`.
ort-sys = "=2.0.0-rc.9"
rmcp = { version = "2.2.0", features = ["server", "macros"] }
rusqlite = { version = "0.31", features = ["bundled", "hooks"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlite-vec = "0.1.9"
# Hugging Face tokenizers, for the BPE `tokenizer.json` that ships with the
# embedding model. `progressbar`/`esaxx_fast` are training-side extras we never
# use; `onig` is kept because the model's ByteLevel pre-tokenizer is regex-based.
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "io-util", "time", "sync"] }
toml = "0.8"
# The HTTP client behind `g-mesh model fetch` (src/cli/model.rs) - the one and
# only place in this crate that opens a network connection, enforced by a test
# there. Deliberately not "shell out to curl": the same promise that made ONNX
# Runtime a static link (see the `ort` pin above - "one binary with no runtime
# dependency for the user", REQUIREMENTS.md) rules out requiring curl in PATH,
# which distroless/alpine images and Windows do not guarantee.
#
# `tls` is rustls with the bundled Mozilla root store (webpki-roots), so
# certificate validation does not depend on the host having a usable CA bundle
# either; `proxy-from-env` keeps `HTTPS_PROXY` working for anyone behind a
# corporate proxy, which curl would have honored for free. `gzip` (a default) is
# off: the payload is 612 MiB of already-incompressible ONNX weights.
#
# 2.x rather than 3.x on purpose: `ort-sys`'s build script already pulls ureq 2
# into this tree, so this reuses that subtree instead of compiling a second
# copy of ureq and rustls.
ureq = { version = "2", default-features = false, features = ["tls", "proxy-from-env"] }

# The three POSIX primitives this crate still reaches for directly, all in
# `src/process.rs`: `kill(pid, 0)` as a liveness probe, `kill(pid, SIGTERM/
# SIGKILL)` to stop a daemon, and nothing else. Unix-only since the Windows
# port - the Windows half of that module answers the same three questions
# through `windows-sys` instead.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The Windows half of `src/process.rs` (OpenProcess/GetExitCodeProcess for
# liveness, TerminateProcess to stop a daemon) and of `src/ipc/` (named pipes,
# which is what AF_UNIX becomes there).
#
# Raw FFI rather than the higher-level `windows` crate, and hand-rolled rather
# than the `interprocess` crate, for reasons `src/ipc/mod.rs` sets out in full:
# the daemon has to *bind* its endpoint synchronously, before any tokio
# runtime exists, and the shim needs a half-close - and no local-socket
# abstraction on crates.io offers both. `windows-sys` is already in this
# tree's lock file via `tokio`'s own Windows dependencies, so this adds link
# declarations rather than a new subtree.
#
# `Win32_Security` is not used for security descriptors of its own - the pipe
# is created with the default one on purpose - only because `CreateNamedPipeW`
# and `CreateFileW` name `SECURITY_ATTRIBUTES` in their signatures.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
# Also a normal dependency - repeated here because integration tests link
# against the library's public API plus dev-dependencies only, and
# `tests/state_isolation.rs` has to spell out the *real* `~/.g-mesh` it must
# not be writing into.
dirs = "5"
rmcp = { version = "2.2.0", features = ["client", "transport-child-process"] }
tempfile = "3"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
