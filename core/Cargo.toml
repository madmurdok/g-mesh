[package]
name = "g-mesh"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "g-mesh"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "5"
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
