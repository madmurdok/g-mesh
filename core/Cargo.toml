[package]
name = "g-mesh"
version = "0.1.0"
edition = "2021"

[lib]
name = "g_mesh"
path = "src/lib.rs"

[[bin]]
name = "g-mesh"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
dirs = "5"
flate2 = "1"
ignore = "0.4"
notify = "6"
rmcp = { version = "2.2.0", features = ["server", "macros"] }
rusqlite = { version = "0.31", features = ["bundled", "hooks"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "io-util", "time"] }

[dev-dependencies]
rmcp = { version = "2.2.0", features = ["client", "transport-child-process"] }
tempfile = "3"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
