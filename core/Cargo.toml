[package]
name = "g-mesh"
version = "0.1.0"
edition = "2021"

[lib]
name = "g_mesh"
path = "src/lib.rs"

[[bin]]
name = "g-mesh"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
dirs = "5"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
