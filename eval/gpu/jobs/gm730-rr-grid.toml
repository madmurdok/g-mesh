entry = "eval/training/gm730/train_ce.py"
args = ["--stage", "grid", "--epochs", "2", "--batch", "32", "--max-len", "256", "--seed", "730", "--lr", "5e-5", "--tau-t", "2", "--alpha", "0.5"]
device = "cuda"

[[data]]
name = "gm730-windows"
env = "GM730_WINDOWS"
local_root = "~/Projects/ClaudeProjects/g-mesh-data/gm730/windows"
include = ["train/*", "dev/*"]

[[data]]
name = "gm730-teacher"
env = "GM730_TEACHER"
local_root = "~/Projects/ClaudeProjects/g-mesh-data/gm730/teacher"
include = ["*"]

[[data]]
name = "gm730-hf-l6"
env = "GM730_HF"
local_root = "~/Projects/ClaudeProjects/g-mesh-data/gm730/hf"
include = ["ms-marco-MiniLM-L6-v2@233902d25c440f23af6f7d6e94d2946bac0bee0a/*"]
