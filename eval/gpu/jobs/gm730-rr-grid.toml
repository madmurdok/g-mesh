# GM-730 job rr-grid: the pre-registered dev grid, one step per config
# (with the RR-T teacher; written by make_jobs.py).
name = "gm730-rr-grid"
requirements = "eval/training/gm730/requirements-linux-cu121.txt"
smoke = true
max_minutes = 120
checkpoint_minutes = 10
grace_seconds = 30
max_attempts = 5

[[steps]]
name = "lr2e-5-tt1-a0"
entry = "eval/training/gm730/train_ce.py"
args = ["--stage", "grid", "--epochs", "2", "--batch", "32", "--max-len", "256", "--seed", "730", "--lr", "2e-5", "--tau-t", "1", "--alpha", "0"]
device = "cuda"

[[steps]]
name = "lr2e-5-tt1-a0.5"
entry = "eval/training/gm730/train_ce.py"
args = ["--stage", "grid", "--epochs", "2", "--batch", "32", "--max-len", "256", "--seed", "730", "--lr", "2e-5", "--tau-t", "1", "--alpha", "0.5"]
device = "cuda"

[[steps]]
name = "lr2e-5-tt2-a0"
entry = "eval/training/gm730/train_ce.py"
args = ["--stage", "grid", "--epochs", "2", "--batch", "32", "--max-len", "256", "--seed", "730", "--lr", "2e-5", "--tau-t", "2", "--alpha", "0"]
device = "cuda"

[[steps]]
name = "lr2e-5-tt2-a0.5"
entry = "eval/training/gm730/train_ce.py"
args = ["--stage", "grid", "--epochs", "2", "--batch", "32", "--max-len", "256", "--seed", "730", "--lr", "2e-5", "--tau-t", "2", "--alpha", "0.5"]
device = "cuda"

[[steps]]
name = "lr5e-5-tt1-a0"
entry = "eval/training/gm730/train_ce.py"
args = ["--stage", "grid", "--epochs", "2", "--batch", "32", "--max-len", "256", "--seed", "730", "--lr", "5e-5", "--tau-t", "1", "--alpha", "0"]
device = "cuda"

[[steps]]
name = "lr5e-5-tt1-a0.5"
entry = "eval/training/gm730/train_ce.py"
args = ["--stage", "grid", "--epochs", "2", "--batch", "32", "--max-len", "256", "--seed", "730", "--lr", "5e-5", "--tau-t", "1", "--alpha", "0.5"]
device = "cuda"

[[steps]]
name = "lr5e-5-tt2-a0"
entry = "eval/training/gm730/train_ce.py"
args = ["--stage", "grid", "--epochs", "2", "--batch", "32", "--max-len", "256", "--seed", "730", "--lr", "5e-5", "--tau-t", "2", "--alpha", "0"]
device = "cuda"

[[steps]]
