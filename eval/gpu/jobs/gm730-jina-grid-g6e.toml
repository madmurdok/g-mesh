# GM-730 job jina-grid: the pre-registered dev grid, one step per config
# (with the RR-T teacher; written by make_jobs.py).
# On g6e (g6e.xlarge, g6e.2xlarge): max_minutes and --eta-limit-minutes are the g5
# values x 0.6, rounded up.
name = "gm730-jina-grid-g6e"
requirements = "eval/training/gm730/requirements-linux-cu121.txt"
smoke = true
max_minutes = 170
max_minutes_scope = "job"
checkpoint_minutes = 10
grace_seconds = 30
max_attempts = 5
instance_types = ["g6e.xlarge", "g6e.2xlarge"]

[[steps]]
name = "full-lr1e-5-a0"
entry = "eval/training/gm730/train_encoder.py"
args = ["--stage", "grid", "--model", "jina", "--epochs", "2", "--batch", "32", "--docs-per-query", "8", "--max-len-doc", "256", "--max-len-query", "64", "--bf16", "--seed", "730", "--mode", "full", "--lr", "1e-5", "--tau", "0.05", "--alpha", "0", "--job-steps", "8", "--eta-limit-minutes", "155"]
device = "cuda"

[[steps]]
name = "full-lr1e-5-a0.5"
entry = "eval/training/gm730/train_encoder.py"
args = ["--stage", "grid", "--model", "jina", "--epochs", "2", "--batch", "32", "--docs-per-query", "8", "--max-len-doc", "256", "--max-len-query", "64", "--bf16", "--seed", "730", "--mode", "full", "--lr", "1e-5", "--tau", "0.05", "--alpha", "0.5", "--job-steps", "7", "--eta-limit-minutes", "155"]
