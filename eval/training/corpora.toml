# Source repos of the GM-456 training data (docs/design/GM-456-training-data.md,
# section 1). Pins are the peeled commit of a release tag, or HEAD on
# 2026-11-10 where `ref = "HEAD"`. `checkout` is relative to this directory
# (eval/training/work is a symlink into the data dir). `licence`, `split` and
# `url` are extra keys `debug-embed-eval` ignores; `split` is the by-repo
# train/dev split.

