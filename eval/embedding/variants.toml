# Variants scored by `g-mesh debug-embed-eval` (docs/architecture/embedding-eval.md,
# D4, D7, D8). Every model row is pinned to a Hugging Face commit and uses its
# model card's recommended configuration (1_Pooling/config.json and the card's
# prefixes, read at the pinned revision on 2026-09-26). Nothing here is tuned
# on the eval. GM-422 and GM-423 add rows; they do not edit existing ones.

[settings]
reference = "jina-v2-base-code-fp32"
bootstrap_seed = 398
bootstrap_resamples = 10000
arm_seed = 398

# --- reference: exactly what production runs (a test pins this row) --------

[[variant]]
name = "jina-v2-base-code-fp32"
arm = "model"
role = "reference"
hf_repo = "jinaai/jina-embeddings-v2-base-code"
revision = "516f4baf13dec4ddddda8631e019b5737c8bc250"
onnx_file = "onnx/model.onnx"
model_dir = "~/.g-mesh/models/jina-embeddings-v2-base-code"
pooling = "mean"
dimension = 768
max_tokens = 1024
token_type_ids = false

