# --- GM-455: structural context before the text, on the first-paragraph form -
# `context` (default "none") prefixes unlabelled header lines - the file path,
# then the parent type or trait impl - and a blank line
# (core/src/cli/embed_eval/context.rs). Scored against fp-ctx-none, the same
# form without context; fp-ctx-none is control C0 (it must reproduce
# jina-v2-base-code-int8-first-paragraph's vectors) and the shuffled row is
# control C1 (real header shape, wrong content); both are informational, so
# their comparisons come from `report --reference <them>`.

[[variant]]
name = "fp-ctx-none"
arm = "model"
role = "informational"
hf_repo = "jinaai/jina-embeddings-v2-base-code"
revision = "516f4baf13dec4ddddda8631e019b5737c8bc250"
